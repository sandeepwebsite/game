<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Sort Puzzle</title>

<style>
:root{
  --bg:#020617;
  --tube-glass:rgba(255,255,255,.1);
  --border:#38bdf8;
  --radius:30px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:#020617;
  font-family:system-ui,sans-serif;
  color:white;
  display:flex;
  justify-content:center;
}

.game{max-width:480px;width:100%;padding:14px}
h1{text-align:center;margin:6px 0}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:.85rem;
  color:#38bdf8;
  margin-bottom:8px;
}

.board{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(50px,1fr));
  gap:14px;
  justify-items:center;
}

/* ORIGINAL TUBE CSS */
.tube{
  position:relative;
  width:50px;
  height:180px;
  background:var(--tube-glass);
  border-bottom-left-radius:var(--radius);
  border-bottom-right-radius:var(--radius);
  border-top-left-radius:4px;
  border-top-right-radius:4px;
  display:flex;
  flex-direction:column-reverse;
  cursor:pointer;
  transition:.2s;
  overflow:hidden;
}

.tube::before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:110%;
  height:6px;
  background:var(--border);
  border-radius:4px;
  z-index:10;
}

.tube::after{
  content:"";
  position:absolute;
  top:10%;
  left:15%;
  width:20%;
  height:70%;
  background:linear-gradient(to right,rgba(255,255,255,.15),transparent);
}

.tube.selected{
  transform:translateY(-15px);
  box-shadow:0 10px 25px rgba(56,189,248,.4);
  z-index:100;
}

.layer{flex:1;width:100%}
.layer:first-child{
  border-bottom-left-radius:22px;
  border-bottom-right-radius:22px;
}

.controls{display:flex;gap:8px;margin-top:10px}
button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  font-weight:600;
  background:#38bdf8;
  color:#020617;
  cursor:pointer;
}
button:disabled{opacity:.4}

.hint{text-align:center;font-size:.9rem;color:#facc15;margin-top:8px}

/* MAP MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index: 100;
}

.modal-content{
  background:#020617;
  border:1px solid #38bdf8;
  border-radius:14px;
  padding:16px;
  width:90%;
  max-width:360px;
}

.map{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.level-btn{
  padding:10px 0;
  border-radius:8px;
  background:#0f172a;
  text-align:center;
  font-size:.75rem;
  border:1px solid #1e293b;
}

.level-btn.locked{opacity:.35}
.level-btn.active{border-color:#38bdf8}
.stars{font-size:.7rem;color:#facc15}

/* GRAFFITI WIN */
.win-text{
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%) scale(.5);
  font-size:2.2rem;
  font-weight:900;
  letter-spacing:3px;
  color:#22c55e;
  text-align: content;
  text-shadow:3px 3px #000,6px 6px #16a34a;
  opacity:0;
  animation:graffiti .9s ease forwards;
  z-index: 100;
}

@keyframes graffiti{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(3deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.sound-btn{
  background:none;
  border:none;
  font-size:1.1rem;
  cursor:pointer;
  color:#38bdf8;
}
.sound-btn.muted{opacity:.4}
</style>
</head>

<body>
<div class="game">
<h1>Water Sort Puzzle</h1>

<div class="info">
  <div id="level"></div>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="moves"></div>
    <button id="soundBtn" class="sound-btn">🔊</button>
  </div>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <button onclick="resetLevel()">Reset</button>
  <button id="undoBtn" onclick="undoMove()" disabled>Undo</button>
  <button onclick="toggleMap()">Map</button>
</div>

<div class="hint" id="hint"></div>

<div class="modal" id="mapModal">
  <div class="modal-content">
    <div class="map" id="map"></div>
    <button onclick="closeMap()">Close</button>
  </div>
</div>
</div>

<audio id="pourSound" preload="auto"><source src="sound/pour.mp3"></audio>
<audio id="winSound" preload="auto"><source src="sound/win.mp3"></audio>

<script>
const MAX=4;
const COLORS=["red","blue","yellow","green","purple","orange"];
const COLOR_MAP={red:"#ef4444",blue:"#3b82f6",yellow:"#facc15",green:"#22c55e",purple:"#a855f7",orange:"#fb923c"};

let save=JSON.parse(localStorage.getItem("waterSortSave"))||{};
save.level ??= 1;
save.lastPlayed ??= save.level;
save.stars ??= {};
localStorage.setItem("waterSortSave",JSON.stringify(save));

let soundOn=JSON.parse(localStorage.getItem("soundOn") ?? "true");

let level=save.lastPlayed;
let tubes=[],moves=0,optimal=0,selected=null,animating=false;
let history=[];

const board=document.getElementById("board");
const levelEl=document.getElementById("level");
const movesEl=document.getElementById("moves");
const hintEl=document.getElementById("hint");
const map=document.getElementById("map");
const mapModal=document.getElementById("mapModal");
const undoBtn=document.getElementById("undoBtn");
const soundBtn=document.getElementById("soundBtn");
const pourSound=document.getElementById("pourSound");
const winSound=document.getElementById("winSound");

function playSound(a){
  if(!soundOn||!a)return;
  a.currentTime=0;
  a.play().catch(()=>{});
}

function updateSoundUI(){
  soundBtn.textContent=soundOn?"🔊":"🔇";
  soundBtn.classList.toggle("muted",!soundOn);
}

soundBtn.onclick=()=>{
  soundOn=!soundOn;
  localStorage.setItem("soundOn",JSON.stringify(soundOn));
  updateSoundUI();
};

function generateLevel(lvl){
  const count=Math.min(3+Math.floor(lvl/2),COLORS.length);
  const pool=[];
  for(let i=0;i<count;i++)for(let j=0;j<MAX;j++)pool.push(COLORS[i]);
  pool.sort(()=>Math.random()-.5);
  const t=Array.from({length:count+2},()=>[]);
  pool.forEach((c,i)=>t[i%count].push(c));
  optimal=count*3;
  return t;
}

function loadLevel(lvl){
  level=lvl;
  save.lastPlayed=lvl;
  localStorage.setItem("waterSortSave",JSON.stringify(save));
  tubes=generateLevel(level);
  moves=0;
  history=[];
  selected=null;
  hintEl.textContent="";
  render();
}

function render(){
  board.innerHTML="";
  levelEl.textContent=`Level ${level}`;
  movesEl.textContent=`Moves ${moves}/${optimal}`;
  undoBtn.disabled=!history.length||animating;
  tubes.forEach((tube,i)=>{
    const el=document.createElement("div");
    el.className="tube"+(selected===i?" selected":"");
    el.onclick=()=>selectTube(i);
    for(let j=0;j<MAX;j++){
      const l=document.createElement("div");
      l.className="layer";
      if(tube[j])l.style.background=COLOR_MAP[tube[j]];
      el.appendChild(l);
    }
    board.appendChild(el);
  });
}

function selectTube(i){
  if(animating)return;
  if(selected===null){
    if(!tubes[i].length)return;
    selected=i;
  }else{
    if(i!==selected){
      const snap=JSON.stringify(tubes);
      if(pour(selected,i)) history.push(snap);
    }
    selected=null;
  }
  render();
}

function pour(a,b){
  const A=tubes[a],B=tubes[b];
  if(!A.length||B.length>=MAX)return false;
  const c=A[A.length-1];
  if(B.length&&B[B.length-1]!==c)return false;

  animating=true;
  playSound(pourSound);
  setTimeout(()=>{
    while(A.length&&A[A.length-1]===c&&B.length<MAX)B.push(A.pop());
    moves++;
    animating=false;
    render();
    checkWin();
  },300);
  return true;
}

function undoMove(){
  if(!history.length||animating)return;
  tubes=JSON.parse(history.pop());
  moves=Math.max(0,moves-1);
  selected=null;
  render();
}

function checkWin(){
  if(!tubes.every(t=>!t.length||(t.length===MAX&&t.every(c=>c===t[0]))))return;

  const g=document.createElement("div");
  g.className="win-text";
  g.textContent="LEVEL COMPLETE!";
  document.body.appendChild(g);

  playSound(winSound);

  let starsEarned = 1;

  if (moves <= optimal) {
    starsEarned = 3;
  } else if (moves <= optimal + 2) {
    starsEarned = 2;
  }

save.stars[level] = Math.max(save.stars[level] || 0, starsEarned);

  save.level=Math.max(save.level,level+1);
  localStorage.setItem("waterSortSave",JSON.stringify(save));

  setTimeout(()=>{
    g.remove();
    loadLevel(level+1);
  },1200);
}

function resetLevel(){loadLevel(level)}

function toggleMap(){
  mapModal.style.display="flex";
  map.innerHTML="";
  for(let i=1;i<=Math.max(save.level,20);i++){
    const locked=i>save.level;
    const b=document.createElement("div");
    b.className="level-btn"+(locked?" locked":"")+(i===level?" active":"");
    b.innerHTML=locked?`🔒`:`${i}<div class="stars">${"★".repeat(save.stars[i]||0)}</div>`;
    if(!locked)b.onclick=()=>{closeMap();loadLevel(i)};
    map.appendChild(b);
  }
}

function closeMap(){mapModal.style.display="none"}

updateSoundUI();
loadLevel(level);
</script>
</body>
</html>
