<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Sort Puzzle</title>

<style>
:root {
  --bg: #020617;
  --tube-glass: rgba(255, 255, 255, 0.1);
  --border: #38bdf8;
  --radius: 30px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:linear-gradient(180deg,#020617,#020617);
  font-family:system-ui,sans-serif;
  color:white;
  display:flex;
  justify-content:center;
}

.game{
  max-width:480px;
  width:100%;
  padding:14px;
}

h1{text-align:center;margin:6px 0}

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:.85rem;
  color:#38bdf8;
  margin-bottom:8px;
}

.sound-btn{
  background:none;
  border:none;
  font-size:1.1rem;
  cursor:pointer;
  color:#38bdf8;
}

.sound-btn.muted{opacity:.4}

.board{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(50px,1fr));
  gap:14px;
  justify-items:center;
}

.tube{
  position:relative;
  width:50px;
  height:180px;
  background:var(--tube-glass);
  border-bottom-left-radius:var(--radius);
  border-bottom-right-radius:var(--radius);
  border-top-left-radius:4px;
  border-top-right-radius:4px;
  display:flex;
  flex-direction:column-reverse;
  cursor:pointer;
  transition:.2s;
  overflow:hidden;
}

.tube::before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:110%;
  height:6px;
  background:var(--border);
  border-radius:4px;
  z-index:11;
}

.tube::after{
  content:"";
  position:absolute;
  top:10%;
  left:15%;
  width:20%;
  height:70%;
  background:linear-gradient(to right,rgba(255,255,255,.15),transparent);
}

.tube.selected{
  transform:translateY(-15px);
  box-shadow:0 10px 25px rgba(56,189,248,.4);
  z-index:100;
}

.layer{
  flex:1;
  width:100%;
}

.layer:first-child{
  border-bottom-left-radius:22px;
  border-bottom-right-radius:22px;
}

.pouring{animation:tilt .3s ease}
@keyframes tilt{
  50%{transform:rotate(-6deg)}
}

.controls{
  display:flex;
  gap:8px;
  margin-top:10px;
}

button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  font-weight:600;
  background:#38bdf8;
  color:#020617;
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.hint{
  margin-top:8px;
  text-align:center;
  font-size:.8rem;
  color:#facc15;
}

.map{
  display:none;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:12px;
}

.level-btn{
  padding:10px 0;
  border-radius:8px;
  background:#0f172a;
  text-align:center;
  font-size:.75rem;
  border:1px solid #1e293b;
  cursor:pointer;
}

.level-btn.locked{opacity:.3;pointer-events:none}
.level-btn.active{border-color:#38bdf8}
.stars{color:#facc15;font-size:.7rem}
</style>
</head>

<body>
<div class="game">
<h1>Water Sort Puzzle</h1>

<div class="info">
  <div id="level"></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div id="moves"></div>
    <button id="soundBtn" class="sound-btn" onclick="toggleSound()">🔊</button>
  </div>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <button onclick="resetLevel()">Reset</button>
  <button id="undoBtn" onclick="undoMove()" disabled>Undo</button>
  <button onclick="showHint()" style="display: none;">Hint</button>
  <button onclick="toggleMap()">Map</button>
</div>

<div class="hint" id="hint"></div>
<div class="map" id="map"></div>

<audio id="pourSound" preload="auto"><source src="sound/pour.mp3"></audio>
<audio id="winSound" preload="auto"><source src="sound/win.mp3"></audio>
</div>

<script>
const MAX=4;
const COLORS=["red","blue","yellow","green","purple","orange","cyan","pink"];
const COLOR_MAP={red:"#ef4444",blue:"#3b82f6",yellow:"#facc15",green:"#22c55e",purple:"#a855f7",orange:"#fb923c",cyan:"#22d3ee",pink:"#ec4899"};

let save=JSON.parse(localStorage.getItem("waterSortSave"))||{level:1,stars:{}};
let soundOn=JSON.parse(localStorage.getItem("soundOn")??"true");
let level=save.level,tubes=[],selected=null,moves=0,optimal=0,animating=false;
let history=[];

const board=document.getElementById("board");
const levelEl=document.getElementById("level");
const movesEl=document.getElementById("moves");
const hintEl=document.getElementById("hint");
const mapEl=document.getElementById("map");
const undoBtn=document.getElementById("undoBtn");
const soundBtn=document.getElementById("soundBtn");
const pourSound=document.getElementById("pourSound");
const winSound=document.getElementById("winSound");

function playSound(a){
  if(!a||!soundOn)return;
  a.currentTime=0;
  a.play().catch(()=>{});
}

function toggleSound(){
  soundOn=!soundOn;
  localStorage.setItem("soundOn",JSON.stringify(soundOn));
  updateSoundUI();
}

function updateSoundUI(){
  soundBtn.textContent=soundOn?"🔊":"🔇";
  soundBtn.classList.toggle("muted",!soundOn);
}

function updateUndoUI(){
  undoBtn.disabled=!history.length||animating;
}

function generateLevel(lvl){
  const count=Math.min(3+Math.floor(lvl/2),COLORS.length);
  const pool=[];
  for(let i=0;i<count;i++)for(let j=0;j<MAX;j++)pool.push(COLORS[i]);
  pool.sort(()=>Math.random()-.5);
  const t=Array.from({length:count+2},()=>[]);
  pool.forEach((c,i)=>t[i%count].push(c));
  optimal=Math.max(7,count*3);
  return t;
}

function loadLevel(lvl){
  level=lvl;
  tubes=generateLevel(level);
  moves=0;
  history=[];
  selected=null;
  hintEl.textContent="";
  render();
  updateUndoUI();
}

function render(){
  board.innerHTML="";
  levelEl.textContent=`Level ${level}`;
  movesEl.textContent=`Moves ${moves} / ${optimal}`;
  tubes.forEach((tube,i)=>{
    const el=document.createElement("div");
    el.className="tube"+(selected===i?" selected":"");
    el.onclick=()=>selectTube(i);
    for(let j=0;j<MAX;j++){
      const l=document.createElement("div");
      l.className="layer";
      if(tube[j])l.style.background=COLOR_MAP[tube[j]];
      el.appendChild(l);
    }
    board.appendChild(el);
  });
}

function selectTube(i){
  if(animating)return;
  const els=document.querySelectorAll(".tube");
  if(selected===null){
    if(!tubes[i].length)return;
    selected=i;
    els[i].classList.add("selected");
  }else{
    const prev=selected;
    if(selected!==i){
      const snap=JSON.stringify(tubes);
      if(pour(selected,i)){
        history.push(snap);
        moves++;
        updateUndoUI();
      }
    }
    selected=null;
    els[prev].classList.remove("selected");
  }
}

function pour(a,b){
  const A=tubes[a],B=tubes[b];
  if(!A.length||B.length>=MAX)return false;
  const c=A[A.length-1];
  if(B.length&&B[B.length-1]!==c)return false;
  animating=true;
  updateUndoUI();
  playSound(pourSound);
  setTimeout(()=>{
    while(A.length&&A[A.length-1]===c&&B.length<MAX)B.push(A.pop());
    animating=false;
    render();
    updateUndoUI();
    checkWin();
  },300);
  return true;
}

function undoMove(){
  if(animating||!history.length)return;
  tubes=JSON.parse(history.pop());
  moves=Math.max(0,moves-1);
  selected=null;
  render();
  updateUndoUI();
}

function checkWin(){
  if(!tubes.every(t=>!t.length||(t.length===MAX&&t.every(c=>c===t[0]))))return;
  playSound(winSound);
  hintEl.textContent="🎉 Level Complete!";
  setTimeout(()=>loadLevel(level+1),1200);
}

function resetLevel(){loadLevel(level)}
function showHint(){hintEl.textContent=`Optimal solution ≈ ${optimal} moves.`}
function toggleMap(){
  if(mapEl.style.display==="grid"){
    mapEl.style.display="none";
  }else{
    mapEl.style.display="grid";
    renderMap();   // ✅ THIS WAS MISSING
  }
}


function renderMap(){
  mapEl.innerHTML="";
  const maxLevel = Math.max(save.level, 20);

  for(let i=1;i<=maxLevel;i++){
    const b=document.createElement("div");
    b.className="level-btn";

    if(i>save.level) b.classList.add("locked");
    if(i===level) b.classList.add("active");

    b.innerHTML=`
      ${i}
      <div class="stars">${"★".repeat(save.stars[i]||0)}</div>
    `;

    b.onclick=()=>{
      mapEl.style.display="none";
      loadLevel(i);
    };

    mapEl.appendChild(b);
  }
}


updateSoundUI();
loadLevel(level);
</script>
</body>
</html>
