<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Water Sort Puzzle</title>
<style>
:root{ --bg:#020617; --border:#38bdf8; --radius:30px; --star-gold: #facc15; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body {
    margin: 0;
    background: radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 80%);
    background-color: #020617;
    
    /* The technical grid pattern */
    background-image: 
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    background-attachment: fixed;
    
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.5);
    pointer-events: none;
    z-index: -1; /* Keep them behind the tubes */
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(1);
        opacity: 0;
    }
    10% { opacity: 0.5; }
    90% { opacity: 0.2; }
    100% {
        transform: translateY(-100vh) scale(0.5);
        opacity: 0;
    }
}

/* Add this to your HTML right after <body> starts */
/* <div class="bg-glow"></div> */

.bg-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Behind everything */
    pointer-events: none;
}

.bg-glow::before {
    content: "";
    position: absolute;
    top: -10%;
    left: -10%;
    width: 40%;
    height: 40%;
    background: #38bdf8;
    filter: blur(120px);
    opacity: 0.1;
}

.bg-glow::after {
    content: "";
    position: absolute;
    bottom: 10%;
    right: -5%;
    width: 35%;
    height: 35%;
    background: #a855f7;
    filter: blur(100px);
    opacity: 0.08;
}

header {
    position: fixed; /* Locks it to the top */
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100; /* Ensures it stays above the test tubes */
    
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    
    /* Modern Glass Effect */
    background: rgba(2, 6, 23, 0.8); 
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(56, 189, 248, 0.2);
}

.logo {
    width: 80px; /* Adjust this to change your logo size */
    height: auto;
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); /* Adds a glow effect */
    transition: transform 0.3s ease;
}

.logo:hover {
    transform: rotate(10deg) scale(1.1); /* Fun interaction */
}

header h1 {
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: 4px;
    color: var(--border);
    text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.5);
}

@media (max-width: 360px) {
    .logo {
        width: 60px;
    }
    header h1 {
        font-size: 1.4rem;
    }
}
.game {
    margin-top: 70px; /* Adjust this based on your header's height */
    max-width: 480px;
    width: 100%;
    padding: 14px;
}

/* --- Default: Mobile (Portrait) --- */
.game {
    /* Large margin because mobile headers are usually taller relative to screen */
    margin-top: 80px; 
    transition: margin-top 0.3s ease;
    padding: 10px;
    width: 100%;
}

/* --- Tablet (768px and up) --- */
@media (min-width: 768px) {
    .game {
        /* Tablets have more vertical space, we can reduce the margin slightly */
        margin-top: 110px;
        max-width: 600px;
    }
}

/* --- Laptop/Desktop (1024px and up) --- */
@media (min-width: 1024px) {
    .game {
        /* On Laptops, we often want the game centered and lower for ergonomics */
        margin-top: 120px;
        max-width: 800px;
    }
}

h1{text-align:center; color: var(--border); letter-spacing: 2px;}
.info{ display:flex; justify-content:space-between; align-items:center; font-size:.9rem; color:#38bdf8; margin-bottom:15px; }
.board{ display:grid; grid-template-columns:repeat(auto-fit,minmax(50px,1fr)); gap:15px; justify-items:center; }

/* REALISTIC TUBE CSS */
.tube{
  position:relative; width:48px; height:170px;
  background: linear-gradient(
        90deg, 
        rgba(255,255,255,0.05) 0%, 
        rgba(255,255,255,0.15) 15%, 
        rgba(255,255,255,0.05) 30%, 
        transparent 100%
    );
    box-shadow: 
        inset 0 0 10px rgba(0,0,0,0.5), /* Internal shadow */
        0 10px 20px rgba(0,0,0,0.4);   /* Drop shadow on the floor */  border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius);
  border: 1px solid rgba(255, 255, 255, 0.2); border-top: none;
  display:flex; flex-direction:column-reverse; cursor:pointer;
  transition: transform 0.3s; overflow:hidden;
}
.tube::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.3); z-index: 5; }
.tube.selected{ transform:translateY(-15px); border-color: var(--border); box-shadow: 0 0 15px var(--border); }
.tube.pouring { transform: translateY(-20px) rotate(25deg); }

@media (hover: hover) {
    .tube:hover {
        border-color: rgba(56, 189, 248, 0.5);
        background: rgba(255, 255, 255, 0.15);
    }
}

.layer {
    width: 100%;
    height: 25%;
    position: relative;
    transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    /* Gradient for depth - dark on edges, light in middle */
    background-image: linear-gradient(
        90deg, 
        rgba(0,0,0,0.2) 0%, 
        transparent 20%, 
        transparent 80%, 
        rgba(0,0,0,0.2) 100%
    );
}

/* The Liquid Surface (Meniscus & Wave) */
.layer::before {
    content: "";
    position: absolute;
    top: -4px;
    left: 0;
    width: 100%;
    height: 8px;
    background: inherit; /* Matches the color of the layer */
    border-radius: 50%; /* Creates the curved water top */
    filter: brightness(1.2); /* Highlight the top of the water */
    opacity: 0.9;
    z-index: 2;
}

.layer::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(circle at 20% 80%, rgba(255,255,255,0.25) 1px, transparent 2px),
        radial-gradient(circle at 60% 60%, rgba(255,255,255,0.2) 1px, transparent 2px),
        radial-gradient(circle at 40% 30%, rgba(255,255,255,0.15) 1px, transparent 2px);
    opacity: 0.25;
    animation: bubbleDrift 6s linear infinite;
}

@keyframes bubbleDrift {
    from { transform: translateY(5px); }
    to   { transform: translateY(-10px); }
}



.tube .layer:last-child::before {
    animation: liquidWave 3s ease-in-out infinite;
}

@keyframes liquidWave {
    0%, 100% {
        transform: scaleY(1) translateY(0);
    }
    50% {
        transform: scaleY(1.4) translateY(-1px);
    }
}


.tube.pouring .layer:last-child::before {
    animation: pourWave 0.6s ease-in-out infinite;
}

@keyframes pourWave {
    0% { transform: skewX(0deg) scaleY(1); }
    50% { transform: skewX(-8deg) scaleY(1.6); }
    100% { transform: skewX(0deg) scaleY(1); }
}


/* Realistic Glass Shine Overlay */
.tube::after {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    width: 20%;
    height: 100%;
    background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0.1) 0%,
        rgba(255, 255, 255, 0.05) 50%,
        transparent 100%
    );
    pointer-events: none;
    z-index: 5;
}

/* --- Tablet (768px to 1024px) --- */
@media (min-width: 768px) {
    .board {
        grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
        gap: 25px;
        max-width: 80% !important;
        margin: 0 auto;
    }
    .tube {
        width: 55px;
        height: 180px;
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
    }
}

/* --- Laptop/Desktop (1024px and up) --- */
@media (min-width: 1024px) {
    .board {
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 35px;
        max-width: 900px !important;
    }
    .tube {
        width: 60px;
        height: 200px;
        border-bottom-left-radius: 35px;
        border-bottom-right-radius: 35px;
    }
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px; /* Space between the image icons */
    margin-top: 30px;
    padding-bottom: 20px;
}

.icon-btn {
    width: 48px;
    height: 48px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
}

/* Feedback when clicking/touching */
.icon-btn:active {
    transform: scale(0.9);
    filter: brightness(1.2);
}

/* Gray out the Undo button when no history exists */
#undoBtn.disabled {
    opacity: 0.3;
    filter: grayscale(1);
    cursor: not-allowed;
    pointer-events: none;
}

button{ flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; background:#38bdf8; color:#020617; cursor:pointer; }
button:disabled{opacity:.3}
.hint{text-align:center; font-size:.85rem; height: 20px; margin:10px 0; color: #fb923c;}

.modal{position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; z-index: 200;}
.modal-content{background:#0f172a; border:2px solid #38bdf8; border-radius:15px; padding:20px; width:90%; max-width:380px;}
.map{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-height: 50vh; overflow-y: auto;}
.level-btn{padding:10px 0; border-radius:8px; background:#1e293b; text-align:center; border:1px solid #334155; color: white; display: flex; flex-direction: column; align-items: center;}
.level-btn.active{border-color:#38bdf8;}
.win-text{position:fixed; top:45%; left:50%; transform:translate(-50%,-50%); background: #0f172a; padding: 40px; border-radius: 25px; border: 3px solid var(--star-gold); text-align: center; z-index: 1000;}
.stars-container {display: flex; gap: 10px; margin-top: 15px; font-size: 2.5rem;}
.star.active {color: var(--star-gold); text-shadow: 0 0 15px var(--star-gold);}
.stars-container{
  text-align: center;
  display: flex;
  text-align: center;
  justify-content: center;
}
</style>
</head>
<body>
<div class="bg-glow"></div>
 <header>
    <h1>WATER SORT</h1>
    <img src="images/water-sort.png" class="logo" onclick="toggleMap()" style="cursor:pointer">
</header>
<div class="game">
  <div class="info">
    <div id="levelDisplay">Level 1</div>
    <div style="display:flex; align-items:center; gap:8px">
        <div id="moveDisplay">Moves: 0 / 0</div>
        <button id="soundBtn" style="background:none; border:none; color:#38bdf8; font-size:1.2rem; cursor:pointer; padding:0">🔊</button>
    </div>
    </div>
    <div id="board" class="board"></div>
    <div id="hintBox" class="hint"></div>
    <div class="controls">
    <img src="images/reset.png" alt="Reset" class="icon-btn" onclick="resetLevel()">
    <img src="images/undo.png" alt="Undo" class="icon-btn" id="undoBtn" onclick="undoMove()">
    <img src="images/level-up.png" alt="Level Map" class="icon-btn" onclick="toggleMap()">
</div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <h2 style="text-align:center; margin-top:0">Levels</h2>
        <div id="mapGrid" class="map"></div>
        <button onclick="closeMap()" style="width:100%; margin-top:20px; background:#ef4444; color:white">CLOSE</button>
    </div>
</div>
<audio id="pourSound" preload="auto">
    <source src="sound/pour.mp3" type="audio/mpeg">
</audio>
<audio id="winSound" preload="auto">
    <source src="sound/win.mp3" type="audio/mpeg">
</audio>
<script>
const MAX = 4;
const COLORS = ["red", "blue", "yellow", "green", "purple", "orange", "deepPink", "cyan", "lime", "white", "silver", "gold", "brown", "maroon", "navy", "olive", "teal", "indigo", "violet", "magenta", "coral", "crimson", "khaki", "plum"];
const COLOR_MAP = { red: "#ef4444", blue: "#3b82f6", yellow: "#facc15", green: "#22c55e", purple: "#a855f7", orange: "#fb923c", deepPink: "#db2777", cyan: "#06b6d4", lime: "#84cc16", white: "#f8fafc", silver: "#94a3b8", gold: "#eab308", brown: "#78350f", maroon: "#991b1b", navy: "#1e3a8a", olive: "#3f6212", teal: "#0d9488", indigo: "#4338ca", violet: "#7c3aed", magenta: "#d946ef", coral: "#fb7185", crimson: "#be123c", khaki: "#fde047", plum: "#dda0dd" };

let save = JSON.parse(localStorage.getItem("waterSortSave")) || { level: 1, lastPlayed: 1, stars: {}, activeLevel: null, currentBoard: null, currentMoves: 0, currentHistory: [] };
let tubes = [], moves = 0, history = [], level = 1, selected = null, animating = false, optimal = 0, maxMoves = 0;
let soundOn = JSON.parse(localStorage.getItem("soundOn") ?? "true");

const pourAudio = document.getElementById("pourSound");
const winAudio = document.getElementById("winSound");

function playSfx(audio) {
    if (soundOn && audio) {
        audio.currentTime = 0;
        audio.play().catch(e => console.log("Audio blocked by browser. Click page first."));
    }
}

function saveState() {
    save.lastPlayed = level; save.activeLevel = level;
    save.currentBoard = JSON.parse(JSON.stringify(tubes));
    save.currentHistory = [...history]; save.currentMoves = moves;
    localStorage.setItem("waterSortSave", JSON.stringify(save));
}

function generateLevel(lvl) {
    const tier = Math.floor(lvl / 50);
    const colorCount = Math.min(4 + tier, COLORS.length);
    const emptyTubes = (lvl >= 300) ? 3 : 2;
    const pool = [];
    for (let i = 0; i < colorCount; i++) for (let j = 0; j < MAX; j++) pool.push(COLORS[i]);
    pool.sort(() => Math.random() - 0.5);
    const t = Array.from({ length: colorCount + emptyTubes }, () => []);
    pool.forEach((c, i) => t[i % colorCount].push(c));
    optimal = colorCount * 4;
    maxMoves = optimal * 2;
    return t;
}

function loadLevel(lvl) {
    level = lvl;
    if (save.activeLevel === lvl && save.currentBoard) {
        tubes = JSON.parse(JSON.stringify(save.currentBoard));
        moves = save.currentMoves;
        history = [...save.currentHistory];
    } else {
        tubes = generateLevel(level);
        moves = 0;
        history = [];
    }
    const tier = Math.floor(level / 50);
    const colorCount = Math.min(4 + tier, COLORS.length);
    optimal = colorCount * 4;
    maxMoves = optimal * 2;

    document.getElementById("hintBox").textContent = (lvl > 1 && lvl % 50 === 0) ? "DIFFICULTY UP: New Color & Tube!" : "";
    saveState();
    render();
}



// Function to create a single bubble
function createBubble(x, y, isAmbient = true) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    
    // Randomize size
    const size = Math.random() * (isAmbient ? 15 : 8) + 4 + 'px';
    bubble.style.width = size;
    bubble.style.height = size;
    
    // Position
    bubble.style.left = x + '%';
    bubble.style.top = y + '%';
    
    // Randomize speed
    const duration = Math.random() * (isAmbient ? 10 : 3) + 4 + 's';
    bubble.style.animationDuration = duration;
    
    document.body.appendChild(bubble);
    
    // Remove from DOM after animation finishes to save memory
    setTimeout(() => {
        bubble.remove();
    }, parseFloat(duration) * 1000);
}

// Background ambient bubbles (run this once on load)
function startAmbientParticles() {
    setInterval(() => {
        // Only create if tab is active to save battery
        if (!document.hidden) {
            createBubble(Math.random() * 100, 100);
        }
    }, 1500);
}

// Pouring burst effect
function triggerPourParticles(tubeIndex) {
    const tube = document.querySelectorAll('.tube')[tubeIndex];
    const rect = tube.getBoundingClientRect();
    const centerX = (rect.left + rect.width / 2) / window.innerWidth * 100;

    for (let i = 0; i < 5; i++) {
        setTimeout(() => {
            createBubble(centerX + (Math.random() * 4 - 2), 70, false);
        }, i * 100);
    }
}



function render() {
    const board = document.getElementById("board");
    board.innerHTML = "";
    document.getElementById("levelDisplay").textContent = `Level ${level}`;
    document.getElementById("moveDisplay").textContent = `Moves: ${moves} / ${maxMoves}`;
    document.getElementById("undoBtn").disabled = history.length === 0;
    document.getElementById("soundBtn").textContent = soundOn ? "🔊" : "🔇";

    tubes.forEach((tube, i) => {
    const el = document.createElement("div");
    el.className = "tube" + (selected === i ? " selected" : "");
    el.onclick = () => selectTube(i);

    for (let j = 0; j < MAX; j++) {
        const l = document.createElement("div");
        l.className = "layer";
        if (tube[j]) {
            l.style.backgroundColor = COLOR_MAP[tube[j]];
            
            // Only add the 'surface' effect to the top-most color layer
            if (j === tube.length - 1) {
                l.classList.add("top-layer");
            }
        }
        el.appendChild(l);
    }
    board.appendChild(el);
});
}

function selectTube(i) {
    if (animating) return;
    if (selected === null) {
        if (tubes[i].length === 0) return;
        selected = i;
    } else {
        if (selected !== i) pour(selected, i);
        selected = null;
    }
    render();
}

function pour(a, b) {
    const A = tubes[a], B = tubes[b];
    if (!A.length || B.length >= MAX || (B.length && B[B.length - 1] !== A[A.length - 1])) return;
    
    const color = A[A.length - 1];
    const snapshot = JSON.stringify(tubes);
animating = true;
    const tubeEls = document.querySelectorAll(".tube");
    tubeEls[a].classList.add("pouring");
    
    // TRIGGER BUBBLES HERE
    triggerPourParticles(b);
    
    playSfx(pourAudio); // Play pour sound

    setTimeout(() => {
        while (A.length && A[A.length - 1] === color && B.length < MAX) B.push(A.pop());
        history.push(snapshot);
        moves++;
        animating = false;
        document.querySelectorAll(".tube")[a].classList.remove("pouring");
        
        if (moves > maxMoves) {
            alert("No more moves left!");
            resetLevel();
            return;
        }
        
        saveState();
        render();
        checkWin();
    }, 400);
}

function undoMove() {
    if (!history.length || animating) return;
    tubes = JSON.parse(history.pop());
    moves--;
    saveState();
    render();
}

function resetLevel() { save.activeLevel = null; loadLevel(level); }

function checkWin() {
    if (!tubes.every(t => !t.length || (t.length === MAX && t.every(c => c === t[0])))) return;
    
    playSfx(winAudio); // Play win sound

    let earned = moves <= optimal ? 3 : (moves <= (optimal + 3) ? 2 : 1);
    save.stars[level] = Math.max(save.stars[level] || 0, earned);
    const winMsg = document.createElement("div");
    winMsg.className = "win-text";
    winMsg.innerHTML = `<h2 style="color:#22c55e;margin:0">LEVEL COMPLETED!</h2>
        <div class="stars-container">
            <span class="star ${earned >= 1 ? 'active' : ''}">★</span>
            <span class="star ${earned >= 2 ? 'active' : ''}">★</span>
            <span class="star ${earned >= 3 ? 'active' : ''}">★</span>
        </div>`;
    document.body.appendChild(winMsg);
    if (level === save.level) save.level++;
    save.currentBoard = null; saveState();
    setTimeout(() => { winMsg.remove(); loadLevel(level + 1); }, 2000);
}

document.getElementById("soundBtn").onclick = () => {
    soundOn = !soundOn;
    localStorage.setItem("soundOn", soundOn);
    render();
};

function toggleMap() {
    const modal = document.getElementById("mapModal");
    const grid = document.getElementById("mapGrid");
    modal.style.display = "flex";
    grid.innerHTML = "";
    for (let i = 1; i <= Math.max(save.level, 20); i++) {
        const locked = i > save.level;
        const btn = document.createElement("div");
        btn.className = "level-btn" + (locked ? " locked" : "") + (i === level ? " active" : "");
        const s = save.stars[i] || 0;
        btn.innerHTML = locked ? "🔒" : `<span>${i}</span><div style="color:#facc15;font-size:10px">${"★".repeat(s)}</div>`;
        if (!locked) btn.onclick = () => { save.activeLevel = null; loadLevel(i); closeMap(); };
        grid.appendChild(btn);
    }
}
function closeMap() { document.getElementById("mapModal").style.display = "none"; }

loadLevel(save.lastPlayed || save.level);
</script>
</body>
</html>
