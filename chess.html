<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
    <title>Grandmaster Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #10b981;
            --text: #f8fafc; --secondary: #334155; --danger: #ef4444;
            --gold: #f59e0b;
        }

        html, body { 
            height: 100%; margin: 0; padding: 0; 
            background: var(--bg); color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        button { cursor: pointer; }
        .app-shell { 
            display: flex; flex-direction: column; 
            height: 100%; width: 100%; max-width: 450px; 
            margin: 0 auto; position: relative;
            overflow: hidden;
        }

        .screen { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
            transition: transform 0.4s ease-in-out, opacity 0.3s;
            transform: translateX(100%); opacity: 0; pointer-events: none;
        }
        .screen.active { transform: translateX(0); opacity: 1; pointer-events: auto; position: relative; }
        .screen.left { transform: translateX(-100%); opacity: 0; }

        #screen-home { justify-content: center; align-items: center; text-align: center; }
        .main-title { font-size: 2.2rem; font-weight: 900; color: var(--accent); margin: 0; }

        .board-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
        #myBoard { width: 90vw; max-width: 380px; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6); touch-action: none; }

        .btn { width: 90%; padding: 18px; margin: 8px 0; border-radius: 15px; border: none; font-size: 1.1rem; font-weight: bold; }
        .btn-primary { background: var(--accent); color: #064e3b; }
        .btn-secondary { background: var(--card); color: white; }

        .board-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .icon-btn { background: var(--card); border: none; color: white; width: 45px; height: 45px; border-radius: 12px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        
        /* Back Arrow Style */
        .back-arrow { cursor: pointer; font-size: 2.2rem; color: var(--text); width: 45px; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        .back-arrow:hover { opacity: 0.7; }

        .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 10px; overflow-y: auto; }
        .level-node { aspect-ratio: 1; border-radius: 15px; background: var(--secondary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
        .level-node.unlocked { background: var(--card); border: 2px solid var(--accent); color: white; cursor: pointer; }
        .level-node.current { background: var(--accent); color: #000; cursor: pointer; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 3000; justify-content: center; align-items: center; }
        .native-modal { width: 80%; background: var(--card); border-radius: 25px; padding: 30px; text-align: center; }
    </style>
</head>
<body>

<div class="app-shell">
    <div id="screen-home" class="screen active">
        <div style="font-size: 4rem;">♟️</div>
        <h1 class="main-title">Grandmaster Pro</h1>
        <p style="opacity:0.6; margin-bottom:30px;">Master the board, one level at a time.</p>
        <button class="btn btn-primary" onclick="initGame('ai')">🖥️ VS COMPUTER</button>
        <button class="btn btn-secondary" onclick="initGame('local')">👥 2 PLAYERS</button>
        <button id="resume-btn" class="btn" style="display:none; background:var(--gold); color:white;" onclick="resumeSavedGame()">⏯️ RESUME PROGRESS</button>
    </div>

    <div id="screen-map" class="screen">
        <div class="board-header" style="padding: 10px 5px;">
            <div class="back-arrow" onclick="navigate('screen-game')">←</div>
            <h2 style="margin:0; flex: 1; text-align: center;">Level Map</h2>
            <div style="width:45px"></div>
        </div>
        <div class="level-grid" id="mapGrid"></div>
    </div>

    <div id="screen-game" class="screen">
        <div class="board-header">
            <button class="icon-btn" onclick="openMapMenu()">🏁</button>
            <div id="game-info" style="font-weight: 800; color: var(--accent);">LEVEL 1</div>
            <button class="icon-btn" id="muteBtn">🔊</button>
        </div>
        <div id="status" style="text-align:center; padding:10px; font-weight:700;">White to move</div>
        <div class="board-wrapper">
            <div id="myBoard"></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px 0;">
            <button class="btn" style="width:100%; margin:0; background:var(--secondary); color:white;" onclick="resetGame()">RESET</button>
            <button class="btn" style="width:100%; margin:0; background:var(--accent); color:#000;" onclick="undoMove()">UNDO</button>
        </div>
    </div>

    <div class="modal-overlay" id="quitModal">
        <div class="native-modal">
            <h2>Quit Game?</h2>
            <p style="opacity:0.7;">Your current match will be saved locally.</p>
            <button class="btn btn-primary" onclick="confirmQuit()">QUIT & SAVE</button>
            <button class="btn btn-secondary" onclick="$('#quitModal').hide()">CONTINUE PLAYING</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="native-modal">
            <span id="resIcon" style="font-size:3.5rem;">🏆</span>
            <h2 id="resTitle" style="margin:10px 0; font-size:1.8rem;">VICTORY</h2>
            <p id="resWinner" style="opacity:0.7; margin-bottom:25px;"></p>
            <div id="modalButtons" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>
</div>

<script>
    let board = null;
    let game = new Chess();
    let gameMode = 'ai';
    let currentLevel = 1;
    let maxLevel = parseInt(localStorage.getItem('chess_max_level')) || 1;
    let isMuted = localStorage.getItem('chess_muted') === 'true';

    // --- AUDIO LOGIC ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playMoveSound(isSpecial = false) {
        if (isMuted) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = isSpecial ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(isSpecial ? 440 : 220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- NAVIGATION ---
    window.history.pushState({page: 'home'}, 'home', ''); 
    window.onpopstate = () => {
        if ($('#screen-game').hasClass('active')) {
            window.history.pushState({page: 'game'}, 'game', ''); 
            $('#quitModal').css('display', 'flex');
        }
    };

    function navigate(screenId) {
        $('.screen').removeClass('active left');
        $(`#${screenId}`).addClass('active').prevAll('.screen').addClass('left');
    }

    function confirmQuit() { saveGameState(); location.reload(); }

    // --- GAME LOGIC ---
    function initGame(mode) {
        gameMode = mode;
        updateHeader();
        navigate('screen-game');
        setTimeout(setupBoard, 450);
    }

    function updateHeader() {
        $('#game-info').text(gameMode === 'ai' ? `LEVEL ${currentLevel}` : "2 PLAYERS");
    }

    function openMapMenu() {
        if (gameMode !== 'ai') return;
        const grid = $('#mapGrid').empty();
        for (let i = 1; i <= 15; i++) {
            let status = (i < maxLevel) ? 'unlocked' : (i === maxLevel ? 'current' : 'locked');
            let node = $(`<div class="level-node ${status}">${i <= maxLevel ? i : '🔒'}</div>`);
            if (i <= maxLevel) {
                node.on('click', function() {
                    currentLevel = i;
                    updateHeader();
                    resetGame();
                    navigate('screen-game');
                });
            }
            grid.append(node);
        }
        navigate('screen-map');
    }

    function setupBoard() {
        const boardEl = document.getElementById('myBoard');
        boardEl.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        if (!board) {
            board = Chessboard('myBoard', {
                draggable: true, position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (s, t) => {
                    let m = game.move({ from: s, to: t, promotion: 'q' });
                    if (!m) return 'snapback';
                    playMoveSound(m.captured || game.in_check());
                    updateStatus();
                    saveGameState();
                    if (gameMode === 'ai' && !game.game_over()) setTimeout(makeAI, 450);
                }
            });
        }
        board.resize();
    }

    function makeAI() {
        let moves = game.moves();
        if (game.game_over()) return;
        let m = game.move(moves[Math.floor(Math.random() * moves.length)]);
        board.position(game.fen());
        playMoveSound(m.captured || game.in_check());
        updateStatus();
        saveGameState();
    }

    function updateStatus() {
        let status = game.turn() === 'w' ? "White" : "Black";
        if (game.in_checkmate()) {
            $('#status').text("CHECKMATE!").css('color', 'var(--danger)');
            playMoveSound(true);
            localStorage.removeItem('chess_saved_game'); 
            setTimeout(() => showResultModal('win'), 600);
        } else if (game.in_draw()) {
            $('#status').text("DRAW!").css('color', 'var(--gold)');
            localStorage.removeItem('chess_saved_game');
            setTimeout(() => showResultModal('draw'), 600);
        } else {
            $('#status').text(`${status}'s turn`).css('color', 'white');
            if(game.in_check()) $('#status').append(" (CHECK!)").css('color', 'var(--danger)');
        }
    }

    function showResultModal(type) {
        const modal = $('#resultModal').css('display', 'flex');
        const btns = $('#modalButtons').empty();
        const userWon = (game.turn() === 'b'); 

        if (type === 'draw') {
            $('#resTitle').text("DRAW").css('color', 'var(--gold)');
            $('#resIcon').text("⚖️");
        } else {
            $('#resTitle').text(userWon ? "VICTORY" : "DEFEAT");
            $('#resTitle').css('color', userWon ? 'var(--accent)' : 'var(--danger)');
            $('#resIcon').text(userWon ? "🏆" : "💀");
            
            if (userWon && gameMode === 'ai' && currentLevel === maxLevel) {
                maxLevel++;
                localStorage.setItem('chess_max_level', maxLevel);
            }
        }

        const btnText = (userWon && gameMode === 'ai') ? "NEXT LEVEL" : "RETRY";
        
        btns.append($('<button class="btn btn-primary"></button>').text(btnText).click(() => {
            if (userWon && gameMode === 'ai') { currentLevel++; }
            modal.hide();
            updateHeader();
            resetGame();
        }));

        btns.append($('<button class="btn btn-secondary">MAIN MENU</button>').click(() => location.reload()));
    }

    function saveGameState() {
        localStorage.setItem('chess_saved_game', JSON.stringify({
            fen: game.fen(), level: currentLevel, mode: gameMode
        }));
    }

    function resumeSavedGame() {
        const data = JSON.parse(localStorage.getItem('chess_saved_game'));
        if(!data) return;
        currentLevel = data.level;
        gameMode = data.mode;
        initGame(gameMode);
        setTimeout(() => { game.load(data.fen); board.position(data.fen); updateStatus(); }, 500);
    }

    function resetGame() { game.reset(); board.start(); updateStatus(); saveGameState(); }
    function undoMove() { 
        game.undo(); if(gameMode==='ai') game.undo(); 
        board.position(game.fen()); updateStatus(); saveGameState();
    }

    // Mute/Unmute & Persistence
    if (isMuted) $('#muteBtn').text('🔇');
    $('#muteBtn').click(function() {
        isMuted = !isMuted;
        localStorage.setItem('chess_muted', isMuted);
        $(this).text(isMuted ? '🔇' : '🔊');
    });

    if (localStorage.getItem('chess_saved_game')) $('#resume-btn').show();
</script>
</body>
</html>
