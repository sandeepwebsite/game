<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Logic: Number Bracelet</title>
    <style>
        :root {
            --bg: #09090B;
            --card: #18181B;
            --primary: #6366F1;
            --success: #22C55E;
            --accent: #F59E0B;
            --error: #EF4444;
            --text: #FAFAFA;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; min-height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .header-tools { display: flex; gap: 10px; align-items: center; }

        .coin-pill {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent); padding: 6px 14px; border-radius: 50px;
            font-weight: 800; transition: transform 0.3s;
            display: flex; flex-direction: row; justify-content: center; align-items: center;
        }

        .btn-icon {
            background: rgba(255,255,255,0.05); border: none; color: white;
            width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
            font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
        }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 5000; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }

        .modal-content {
            background: var(--card); padding: 30px; border-radius: 30px;
            width: 85%; max-width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-action {
            background: var(--primary); color: white; border: none; padding: 14px;
            width: 100%; border-radius: 15px; font-weight: 800; margin-top: 15px;
            cursor: pointer; text-decoration: none; display: block;
        }

        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }

        .bracelet-ring {
            width: 140px; height: 140px; border: 8px solid var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
        }

        .target-num { font-size: 2.8rem; font-weight: 900; }

        .equation-bar {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 8px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 20px;
            min-height: 60px;
        }

        .num-box { font-size: 1.4rem; font-weight: 700; color: #fff; }
        
        .slot {
            width: 40px; height: 40px; background: rgba(255,255,255,0.08);
            border: 2px dashed rgba(255,255,255,0.2); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: var(--accent); transition: 0.2s;
            cursor: pointer;
        }
        .slot.filled { border-style: solid; border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }

        #hint-display {
            height: 25px; color: var(--accent); font-weight: 700;
            font-size: 0.9rem; letter-spacing: 1px; text-align: center;
        }

        .op-dock { display: flex; gap: 10px; }
        .op-item {
            width: 50px; height: 50px; background: var(--card); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; cursor: pointer; border: 2px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }
        .op-item.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.2); }

        #map-screen {
            display: none; position: fixed; inset: 0; background: var(--bg);
            z-index: 2000; padding: 20px; overflow-y: auto;
        }
        .map-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .level-node {
            aspect-ratio: 1; background: var(--card); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-weight: 800;
        }
        .level-node.cleared { background: var(--success); color: #000; }
        .level-node.current { border: 2px solid var(--primary); box-shadow: 0 0 10px var(--primary); }
        .level-node.locked { opacity: 0.2; }

        .win-anim { animation: pulseSuccess 0.6s ease; }
        @keyframes pulseSuccess { 50% { transform: scale(1.1); border-color: var(--success); } }
        
        .gift-ready::after {
            content: ''; position: absolute; top: 0; right: 0;
            width: 10px; height: 10px; background: var(--error);
            border-radius: 50%; border: 2px solid var(--bg);
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-tools">
        <button class="btn-icon" onclick="toggleMap()">🗺️</button>
        <button id="mute-btn" class="btn-icon" onclick="toggleMute()">🔊</button>
    </div>
    <div class="coin-pill">
        <button id="gift-btn" class="btn-icon" style="position: relative;" onclick="openGiftModal()">🎁</button>
        <div id="coin-pill">💰 <span id="coin-val">100</span></div>
    </div>
</div>

<div class="main">
    <div id="level-label" style="text-transform: uppercase; letter-spacing: 3px; font-size: 0.75rem; opacity: 0.5;">Level 1</div>
    
    <div class="bracelet-ring" id="bracelet">
        <div class="target-num" id="target-ui">0</div>
    </div>

    <div class="equation-bar" id="eq-ui"></div>

    <div id="hint-display"></div>

    <div class="op-dock">
        <div class="op-item" draggable="true" ondragstart="onDrag(event)" onclick="selectOp('+', this)" data-op="+">+</div>
        <div class="op-item" draggable="true" ondragstart="onDrag(event)" onclick="selectOp('-', this)" data-op="-">−</div>
        <div class="op-item" draggable="true" ondragstart="onDrag(event)" onclick="selectOp('*', this)" data-op="*">×</div>
        <div class="op-item" draggable="true" ondragstart="onDrag(event)" onclick="selectOp('/', this)" data-op="/">÷</div>
    </div>

    <div style="display: flex; gap: 10px; width: 85%;">
        <button class="btn-action" style="background: rgba(255,255,255,0.05);" onclick="useHint()">💡 Hint (-5)</button>
        <button class="btn-action" style="background: rgba(255,255,255,0.05);" onclick="initLevel()">🔄 Reset</button>
    </div>
</div>

<div id="bankrupt-modal" class="modal">
    <div class="modal-content">
        <div style="font-size: 3rem;">💸</div>
        <h2 style="color: var(--error);">Out of Coins!</h2>
        <p style="opacity: 0.7;">Watch this update to earn a 100 coin refill!</p>
        <a id="ad-btn" href="#" target="_blank" class="btn-action" style="background: #FF0000;" onclick="claimAdReward()">📺 WATCH & REFILL</a>
    </div>
</div>

<div id="gift-modal" class="modal">
    <div class="modal-content">
        <div style="font-size: 3rem;">🎁</div>
        <h2>Daily Gift</h2>
        <p id="gift-status" style="opacity: 0.7; margin-bottom: 20px;">Come back later!</p>
        <button id="gift-claim-btn" class="btn-action" onclick="claimDailyGift()">CLAIM 50 COINS</button>
        <button class="btn-action" style="background:none; color:rgba(255,255,255,0.5)" onclick="closeGiftModal()">CLOSE</button>
    </div>
</div>

<div id="map-screen">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Saga Progress</h2>
        <button class="btn-icon" onclick="toggleMap()">✕</button>
    </div>
    <div class="map-grid" id="map-grid-ui"></div>
</div>

<script>
    let state = {
        coins: parseInt(localStorage.getItem('math_coins')) || 100,
        lvl: parseInt(localStorage.getItem('math_lvl')) || 1,
        maxLvl: parseInt(localStorage.getItem('math_max_lvl')) || 1,
        muted: localStorage.getItem('math_muted') === 'true',
        lastGift: localStorage.getItem('math_last_gift') || 0,
        nums: [], slots: [], target: 0, sol: [],
        selectedOp: null
    };

    const adLinks = [
        "https://youtube.com/shorts/UwM5pNA92AI",
        "https://youtube.com/shorts/fv46gAfsJbc",
        "https://youtube.com/shorts/lE1zQfHma28"
    ];

    let audioCtx = null;

    async function playSound(f, d, type = 'sine') {
        if (state.muted) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type; o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    function playCoinWinSound() {
        playSound(523.25, 0.1); 
        setTimeout(() => playSound(659.25, 0.2), 100);
    }

    function playClaimSound() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => setTimeout(() => playSound(f, 0.15, 'triangle'), i * 60));
    }

    function toggleMute() {
        state.muted = !state.muted;
        localStorage.setItem('math_muted', state.muted);
        document.getElementById('mute-btn').textContent = state.muted ? '🔇' : '🔊';
    }

    function claimDailyGift() {
        state.lastGift = Date.now();
        localStorage.setItem('math_last_gift', state.lastGift);
        updateCoins(50);
        playClaimSound();
        closeGiftModal();
        checkGiftStatus();
    }

    function claimAdReward() {
        setTimeout(() => { 
            updateCoins(100); 
            document.getElementById('bankrupt-modal').style.display = 'none'; 
            playClaimSound();
        }, 2000);
    }

    function win() {
        playCoinWinSound();
        document.getElementById('bracelet').classList.add('win-anim');
        setTimeout(() => {
            document.getElementById('bracelet').classList.remove('win-anim');
            if(state.lvl === state.maxLvl) { 
                updateCoins(10); 
                state.maxLvl++; 
                localStorage.setItem('math_max_lvl', state.maxLvl); 
            }
            state.lvl++; 
            localStorage.setItem('math_lvl', state.lvl);
            initLevel();
        }, 800);
    }

    function checkGiftStatus() {
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;
        const btn = document.getElementById('gift-btn');
        if (now - state.lastGift >= oneDay) {
            btn.classList.add('gift-ready');
            return true;
        } else {
            btn.classList.remove('gift-ready');
            return false;
        }
    }

    function openGiftModal() {
        const modal = document.getElementById('gift-modal');
        const status = document.getElementById('gift-status');
        const claimBtn = document.getElementById('gift-claim-btn');
        modal.style.display = 'flex';
        if (checkGiftStatus()) {
            status.textContent = "Your daily reward is ready!";
            claimBtn.style.display = 'block';
        } else {
            const nextGift = parseInt(state.lastGift) + (24 * 60 * 60 * 1000);
            const remaining = nextGift - Date.now();
            const hours = Math.floor(remaining / (1000 * 60 * 60));
            status.textContent = `Next gift in ${hours} hours.`;
            claimBtn.style.display = 'none';
        }
    }

    function closeGiftModal() { document.getElementById('gift-modal').style.display = 'none'; }

    function initLevel() {
        state.selectedOp = null;
        document.querySelectorAll('.op-item').forEach(el => el.classList.remove('selected'));
        document.getElementById('level-label').textContent = `Level ${state.lvl}`;
        document.getElementById('hint-display').textContent = '';
        const count = state.lvl > 10 ? 5 : 4;
        state.nums = Array.from({length: count}, () => Math.floor(Math.random() * 10) + 2);
        state.slots = Array(count - 1).fill(null);
        generateTarget(count);
        renderGame();
        checkGiftStatus();
    }

    function generateTarget(count) {
        const ops = ['+','-','*','/'];
        while(true) {
            let tempOps = Array.from({length: count - 1}, () => ops[Math.floor(Math.random()*4)]);
            let res = calculate([...state.nums], [...tempOps]);
            if(Number.isInteger(res) && res > 0 && res < 400) {
                state.target = res;
                state.sol = tempOps;
                break;
            }
        }
        document.getElementById('target-ui').textContent = state.target;
    }

    function calculate(n, o) {
        let tokens = [];
        for(let i=0; i<n.length; i++) {
            tokens.push(n[i]);
            if(i < o.length) tokens.push(o[i]);
        }
        for(let i=1; i<tokens.length; i+=2) {
            if(tokens[i] === '*' || tokens[i] === '/') {
                let left = tokens[i-1], right = tokens[i+1];
                let r = tokens[i] === '*' ? left * right : left / right;
                tokens.splice(i-1, 3, r); i -= 2;
            }
        }
        let final = tokens[0];
        for(let i=1; i<tokens.length; i+=2) {
            if(tokens[i] === '+') final += tokens[i+1];
            if(tokens[i] === '-') final -= tokens[i+1];
        }
        return final;
    }

    function renderGame() {
        const area = document.getElementById('eq-ui');
        area.innerHTML = '';
        state.nums.forEach((num, i) => {
            const n = document.createElement('div'); n.className = 'num-box'; n.textContent = num;
            area.appendChild(n);
            if(i < state.nums.length - 1) {
                const s = document.createElement('div');
                s.className = `slot ${state.slots[i] ? 'filled' : ''}`;
                s.textContent = state.slots[i] ? state.slots[i].replace('*','×').replace('/','÷') : '?';
                s.dataset.idx = i;
                s.ondragover = (e) => e.preventDefault();
                s.ondrop = onDrop;
                s.onclick = () => handleSlotClick(i);
                area.appendChild(s);
            }
        });
        const eq = document.createElement('div');
        eq.className = 'num-box';
        eq.innerHTML = ` = <span style="color:var(--primary)" id="live-res">?</span>`;
        area.appendChild(eq);
        updateLiveResult();
    }

    function selectOp(op, el) {
        state.selectedOp = op;
        document.querySelectorAll('.op-item').forEach(item => item.classList.remove('selected'));
        el.classList.add('selected');
        playSound(440, 0.05);
    }

    function handleSlotClick(idx) {
        if (state.selectedOp) {
            placeOperator(idx, state.selectedOp);
        }
    }

    function onDrag(e) { e.dataTransfer.setData("op", e.target.dataset.op); }

    function onDrop(e) {
        e.preventDefault();
        const op = e.dataTransfer.getData("op");
        const idx = e.target.dataset.idx;
        placeOperator(idx, op);
    }

    function placeOperator(idx, op) {
        state.slots[idx] = op;
        renderGame();
        playSound(880, 0.05);
    }

    function updateLiveResult() {
        const res = calculate([...state.nums], state.slots.map(s => s || '+'));
        const display = document.getElementById('live-res');
        if(display) {
            display.textContent = state.slots.includes(null) ? '?' : res;
            if(!state.slots.includes(null) && res === state.target) win();
        }
    }

    function updateCoins(amt) {
        state.coins += amt;
        if(state.coins <= 0) { state.coins = 0; showBankrupt(); }
        localStorage.setItem('math_coins', state.coins);
        document.getElementById('coin-val').textContent = state.coins;
        const p = document.getElementById('coin-pill');
        p.style.transform = "scale(1.2)"; setTimeout(()=>p.style.transform="scale(1)", 200);
    }

    function useHint() {
        if(state.coins < 5) return showBankrupt();
        updateCoins(-5);
        playSound(1200, 0.1);
        document.getElementById('hint-display').textContent = `USE: ${state.sol.join(', ')}`;
    }

    function showBankrupt() {
        const randomIndex = Math.floor(Math.random() * adLinks.length);
        document.getElementById('ad-btn').href = adLinks[randomIndex];
        document.getElementById('bankrupt-modal').style.display = 'flex';
    }

    function toggleMap() {
        const s = document.getElementById('map-screen');
        const g = document.getElementById('map-grid-ui');
        g.innerHTML = '';
        for(let i=1; i<=40; i++) {
            const n = document.createElement('div');
            n.className = `level-node ${i < state.maxLvl ? 'cleared' : i === state.maxLvl ? 'current' : 'locked'}`;
            n.textContent = i;
            if(i <= state.maxLvl) n.onclick = () => { state.lvl = i; initLevel(); toggleMap(); };
            g.appendChild(n);
        }
        s.style.display = s.style.display === 'block' ? 'none' : 'block';
    }

    window.onload = () => {
        document.getElementById('coin-val').textContent = state.coins;
        document.getElementById('mute-btn').textContent = state.muted ? '🔇' : '🔊';
        initLevel();
    };
</script>
</body>
</html>
