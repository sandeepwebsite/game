<style>
:root{ --bg:#020617; --border:#38bdf8; --radius:30px; --star-gold: #facc15; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body {
    margin: 0;
    background: radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 80%);
    background-color: #020617;
    
    /* The technical grid pattern */
    background-image: 
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    background-attachment: fixed;
    
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

h2{
    color: white;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.5);
    pointer-events: none;
    z-index: -1; /* Keep them behind the tubes */
    animation: floatUp linear forwards;
}
    
@keyframes floatUp {
    0% {
        transform: translateY(0) scale(1);
        opacity: 0;
    }
    10% { opacity: 0.5; }
    90% { opacity: 0.2; }
    100% {
        transform: translateY(-100vh) scale(0.5);
        opacity: 0;
    }
}

/* Add this to your HTML right after <body> starts */
/* <div class="bg-glow"></div> */

.bg-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Behind everything */
    pointer-events: none;
}

.bg-glow::before {
    content: "";
    position: absolute;
    top: -10%;
    left: -10%;
    width: 40%;
    height: 40%;
    background: #38bdf8;
    filter: blur(120px);
    opacity: 0.1;
}

.bg-glow::after {
    content: "";
    position: absolute;
    bottom: 10%;
    right: -5%;
    width: 35%;
    height: 35%;
    background: #a855f7;
    filter: blur(100px);
    opacity: 0.08;
}

header {
    position: fixed; /* Locks it to the top */
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100; /* Ensures it stays above the test tubes */
    
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    
    /* Modern Glass Effect */
    background: rgba(2, 6, 23, 0.8); 
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(56, 189, 248, 0.2);
}

.logo {
    width: 80px; /* Adjust this to change your logo size */
    height: auto;
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); /* Adds a glow effect */
    transition: transform 0.3s ease;

}

.logo:hover {
    transform: rotate(10deg) scale(1.1); /* Fun interaction */
}

header h1 {

.game {

h1{text-align:center; color: var(--border); letter-spacing: 2px;}
.info{ display:flex; justify-content:space-between; align-items:center; font-size:.9rem; color:#38bdf8; margin-bottom:15px; }

/* REALISTIC TUBE CSS */
.tube{
  position:relative; width:48px; height:170px;
  background: linear-gradient(
        90deg, 
        rgba(255,255,255,0.05) 0%, 
        rgba(255,255,255,0.15) 15%, 
        rgba(255,255,255,0.05) 30%, 
        transparent 100%
    );
    box-shadow: 
        inset 0 0 10px rgba(0,0,0,0.5), /* Internal shadow */
        0 10px 20px rgba(0,0,0,0.4);   /* Drop shadow on the floor */  border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius);
  border: 1px solid rgba(255, 255, 255, 0.2); border-top: none;
  display:flex; flex-direction:column-reverse; cursor:pointer;
  transition: transform 0.3s; overflow:hidden;
}
.tube::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.3); z-index: 5; }
.tube.selected{ transform:translateY(-15px); border-color: var(--border); box-shadow: 0 0 15px var(--border); }
.tube.pouring { transform: translateY(-20px) rotate(25deg); }

@media (hover: hover) {
    .tube:hover {
        border-color: rgba(56, 189, 248, 0.5);
        background: rgba(255, 255, 255, 0.15);
    }
}

.layer {
    width: 100%;
    height: 25%;
    position: relative;
    transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    /* Gradient for depth - dark on edges, light in middle */
    background-image: linear-gradient(
        90deg, 
        rgba(0,0,0,0.2) 0%, 
        transparent 20%, 
        transparent 80%, 
        rgba(0,0,0,0.2) 100%
    );
}

/* The Liquid Surface (Meniscus & Wave) */
.layer::before {
    content: "";
    position: absolute;
    top: -6px;
    left: -5%;
    width: 110%;
    height: 12px;

    background: radial-gradient(
        ellipse at center,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.25) 30%,
        rgba(255,255,255,0.1) 55%,
        transparent 70%
    );

    border-radius: 50%;
    filter: blur(0.5px);
    opacity: 0.85;
    pointer-events: none;
}

.layer::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(circle at 20% 80%, rgba(255,255,255,0.25) 1px, transparent 2px),
        radial-gradient(circle at 60% 60%, rgba(255,255,255,0.2) 1px, transparent 2px),
        radial-gradient(circle at 40% 30%, rgba(255,255,255,0.15) 1px, transparent 2px);
    opacity: 0.25;
    animation: bubbleDrift 6s linear infinite;
}

@keyframes bubbleDrift {
    from { transform: translateY(5px); }
    to   { transform: translateY(-10px); }
}



.tube .layer:last-child::before {
    animation: liquidWave 3s ease-in-out infinite;
}

@keyframes liquidWave {
    0%, 100% {
        transform: scaleY(1) translateY(0);
    }
    50% {
        transform: scaleY(1.4) translateY(-1px);
    }
}


.tube.pouring .layer:last-child::before {
    animation: pourWave 0.6s ease-in-out infinite;
}

@keyframes pourWave {
    0% { transform: skewX(0deg) scaleY(1); }
    50% { transform: skewX(-8deg) scaleY(1.6); }
    100% { transform: skewX(0deg) scaleY(1); }
}


/* Realistic Glass Shine Overlay */
.tube::after {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    width: 20%;
    height: 100%;
    background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0.1) 0%,
        rgba(255, 255, 255, 0.05) 50%,
        transparent 100%
    );
    pointer-events: none;
    z-index: 5;
}

/* --- Tablet (768px to 1024px) --- */
@media (min-width: 768px) {
    .board {
        grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
        gap: 25px;

/* --- Laptop/Desktop (1024px and up) --- */
@media (min-width: 1024px) {

}

.controls {

.icon-btn {

}

/* Feedback when clicking/touching */
.icon-btn:active {

}

/* Gray out the Undo button when no history exists */
#undoBtn.disabled {
    opacity: 0.3;
    filter: grayscale(1);
    cursor: not-allowed;
    pointer-events: none;
}

button{ flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; background:#38bdf8; color:#020617; cursor:pointer; }

.map{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-height: 50vh; overflow-y: auto;cursor: pointer;}
.level-btn{padding:10px 0; border-radius:8px; background:#1e293b; text-align:center; border:1px solid #334155; color: white; display: flex; flex-direction: column; align-items: center;cursor: pointer;}

.level-btn.active{border-color:#38bdf8;}
.win-text{position:fixed; top:45%; left:50%; transform:translate(-50%,-50%); background: #0f172a; padding: 40px; border-radius: 25px; border: 3px solid var(--star-gold); text-align: center; z-index: 1000;}
.stars-container {display: flex; gap: 10px; margin-top: 15px; font-size: 2.5rem;}
.star.active {color: var(--star-gold); text-shadow: 0 0 15px var(--star-gold);}
.stars-container{
  text-align: center;
  display: flex;
  text-align: center;
  justify-content: center;
}
</style>

<audio id="pourSound" preload="auto">

</audio>

<script>

const MAX = 4;
const COLORS = ["red", "blue", "yellow", "green", "purple", "orange", "deepPink", "cyan", "lime", "white", "silver", "gold", "brown", "maroon", "navy", "olive", "teal", "indigo", "violet", "magenta", "coral", "crimson", "khaki", "plum"];
const COLOR_MAP = { red: "#ef4444", blue: "#3b82f6", yellow: "#facc15", green: "#22c55e", purple: "#a855f7", orange: "#fb923c", deepPink: "#db2777", cyan: "#06b6d4", lime: "#84cc16", white: "#f8fafc", silver: "#94a3b8", gold: "#eab308", brown: "#78350f", maroon: "#991b1b", navy: "#1e3a8a", olive: "#3f6212", teal: "#0d9488", indigo: "#4338ca", violet: "#7c3aed", magenta: "#d946ef", coral: "#fb7185", crimson: "#be123c", khaki: "#fde047", plum: "#dda0dd" };

let save = JSON.parse(localStorage.getItem("waterSortSave")) || { level: 1, lastPlayed: 1, stars: {}, activeLevel: null, currentBoard: null, currentMoves: 0, currentHistory: [] };
let tubes = [], moves = 0, history = [], level = 1, selected = null, animating = false, optimal = 0, maxMoves = 0;
let soundOn = JSON.parse(localStorage.getItem("soundOn") ?? "true");

const pourAudio = document.getElementById("pourSound");
const winAudio = document.getElementById("winSound");

// --- BFS SOLVER FOR MINIMUM MOVES ---
function getMinMoves(initialTubes) {
    const serialize = (state) => state.map(t => t.join(',')).sort().join('|');
    let queue = [{ state: initialTubes, steps: 0 }];
    let visited = new Set([serialize(initialTubes)]);
    let iterations = 0;

    while (queue.length > 0 && iterations < 3000) {
        iterations++;
        let { state, steps } = queue.shift();

        if (state.every(t => t.length === 0 || (t.length === MAX && t.every(c => c === t[0])))) {
            return steps;
        }

        for (let i = 0; i < state.length; i++) {
            for (let j = 0; j < state.length; j++) {
                if (i === j) continue;
                if (canPour(state[i], state[j])) {
                    let newState = state.map(t => [...t]);
                    let color = newState[i][newState[i].length - 1];
                    while (newState[i].length > 0 && newState[i][newState[i].length - 1] === color && newState[j].length < MAX) {
                        newState[j].push(newState[i].pop());
                    }
                    let key = serialize(newState);
                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push({ state: newState, steps: steps + 1 });
                    }
                }
            }
        }
    }
    return null; 
}

function canPour(from, to) {
    if (from.length === 0) return false;
    if (to.length === MAX) return false;
    return to.length === 0 || from[from.length - 1] === to[to.length - 1];
}

// --- GAME LOGIC ---
function playSfx(audio) {
    if (soundOn && audio) {
        audio.currentTime = 0;
        audio.play().catch(e => {});
    }
}

function saveState() {
    save.lastPlayed = level; save.activeLevel = level;
    save.currentBoard = JSON.parse(JSON.stringify(tubes));
    save.currentHistory = [...history]; save.currentMoves = moves;
    localStorage.setItem("waterSortSave", JSON.stringify(save));
}


function getAiMinimum(initialTubes) {
    // We sort the serialized state so that tubes [A, B] and [B, A] are treated as the same
    const serialize = (state) => state.map(t => t.join(',')).sort().join('|');
    
    let queue = [{ state: initialTubes, steps: 0 }];
    let visited = new Set([serialize(initialTubes)]);
    
    let iterations = 0;
    const SAFETY_CAP = 4000; // Prevents long freezes on high levels

    while (queue.length > 0 && iterations < SAFETY_CAP) {
        iterations++;
        let { state, steps } = queue.shift();

        // Check for Win State
        if (state.every(t => t.length === 0 || (t.length === MAX && t.every(c => c === t[0])))) {
            return steps;
        }

        // Generate all possible valid moves
        for (let i = 0; i < state.length; i++) {
            for (let j = 0; j < state.length; j++) {
                if (i === j) continue; // Can't pour into itself

                if (canPour(state[i], state[j])) {
                    let newState = state.map(t => [...t]);
                    let color = newState[i][newState[i].length - 1];
                    
                    // Move the blocks
                    while (newState[i].length > 0 && 
                           newState[i][newState[i].length - 1] === color && 
                           newState[j].length < MAX) {
                        newState[j].push(newState[i].pop());
                    }

                    let key = serialize(newState);
                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push({ state: newState, steps: steps + 1 });
                    }
                }
            }
        }
    }
    // Fallback if level is too complex: return a heuristic estimate
    return Math.floor(initialTubes.filter(t => t.length > 0).length * 3.5);
}

function canPour(from, to) {
    if (from.length === 0) return false;
    if (to.length === MAX) return false;
    return to.length === 0 || from[from.length - 1] === to[to.length - 1];
}


function generateLevel(lvl) {
    const tier = Math.floor(lvl / 50);
    const colorCount = Math.min(4 + tier, COLORS.length);
    const emptyTubes = (lvl >= 300) ? 3 : 2;
    const pool = [];
    for (let i = 0; i < colorCount; i++) for (let j = 0; j < MAX; j++) pool.push(COLORS[i]);
    pool.sort(() => Math.random() - 0.5);
    const t = Array.from({ length: colorCount + emptyTubes }, () => []);
    pool.forEach((c, i) => t[i % colorCount].push(c));
    return t;
}

function loadLevel(lvl) {
    
    level = lvl;
    if (save.activeLevel === lvl && save.currentBoard) {
        tubes = JSON.parse(JSON.stringify(save.currentBoard));
        moves = save.currentMoves;
        history = [...save.currentHistory];
    } else {
        tubes = generateLevel(level);
        moves = 0;
        history = [];
    }
    
    // Calculate Absolute Minimum for Star System
    const minSteps = getMinMoves(tubes);
    optimal = getAiMinimum(tubes);
    
    maxMoves = optimal; 

    document.getElementById("hintBox").textContent = (lvl > 1 && lvl % 50 === 0) ? "DIFFICULTY UP: New Color & Tube!" : "";
    moves = 0;
    history = [];
    saveState();
    render();
}

function render() {
    const board = document.getElementById("board");
    board.innerHTML = "";
    // Update the Move Display to show Current / Max
    document.getElementById("levelDisplay").textContent = `Level ${level}`;
    document.getElementById("moveDisplay").textContent = `Moves: ${moves} / ${maxMoves}`;
    document.getElementById("soundBtn").textContent = soundOn ? "🔊" : "🔇";

    // Disable Undo on Start or when history is empty
    const undoBtn = document.getElementById("undoBtn");
    if (history.length === 0) {
        undoBtn.classList.add("disabled");
    } else {
        undoBtn.classList.remove("disabled");
    }

    tubes.forEach((tube, i) => {
        const el = document.createElement("div");
        el.className = "tube" + (selected === i ? " selected" : "");
        el.onclick = () => selectTube(i);

        for (let j = 0; j < MAX; j++) {
            const l = document.createElement("div");
            l.className = "layer";
            if (tube[j]) {
                l.style.backgroundColor = COLOR_MAP[tube[j]];
                if (j === tube.length - 1) l.classList.add("top-layer");
            }
            el.appendChild(l);
        }
        board.appendChild(el);
    });
}

function selectTube(i) {
    if (animating) return;
    if (selected === null) {
        if (tubes[i].length === 0) return;
        selected = i;
    } else {
        if (selected !== i) pour(selected, i);
        selected = null;
    }
    render();
}

function pour(a, b) {
    const A = tubes[a], B = tubes[b];
    if (!A.length || B.length >= MAX || (B.length && B[B.length - 1] !== A[A.length - 1])) return;
    
    const color = A[A.length - 1];
    const snapshot = JSON.stringify(tubes);
    animating = true;

const tubeEls = document.querySelectorAll(".tube");
const directionClass = b > a ? "pouring-right" : "pouring-left";
tubeEls[a].classList.add(directionClass);

triggerPourParticles(b);
playSfx(pourAudio);

setTimeout(() => {
    while (A.length && A[A.length - 1] === color && B.length < MAX) {
        B.push(A.pop());
    }

    history.push(snapshot);
    moves++;
    animating = false;

    tubeEls[a].classList.remove("pouring-left", "pouring-right");

    saveState();
    render();
    if (checkWin()) return;
}, 400);

}

function undoMove() {
    if (!history.length || animating) return;
    tubes = JSON.parse(history.pop());
    moves--;
    saveState();
    render();
}

function checkWin() {
    if (!tubes.every(t => 
        !t.length || (t.length === MAX && t.every(c => c === t[0]))
    )) return false;

    playSfx(winAudio);

    let earned = 1;
    if (moves <= optimal) earned = 3;
    else if (moves <= Math.floor(optimal * 1.3)) earned = 2;

    save.stars[level] = Math.max(save.stars[level] || 0, earned);

    const winMsg = document.createElement("div");
    winMsg.className = "win-text";
    winMsg.innerHTML = `
        <h2 style="color:#22c55e;margin:0">LEVEL COMPLETED!</h2>
        <div class="stars-container">
            <span class="star ${earned >= 1 ? 'active' : ''}">★</span>
            <span class="star ${earned >= 2 ? 'active' : ''}">★</span>
            <span class="star ${earned >= 3 ? 'active' : ''}">★</span>
        </div>`;
    document.body.appendChild(winMsg);

    if (level === save.level) save.level++;
    save.currentBoard = null;
    saveState();

    setTimeout(() => {
        winMsg.remove();
        loadLevel(level + 1);
    }, 2000);

    return true;
}


function startAmbientParticles() {
    setInterval(() => { if (!document.hidden) createBubble(Math.random() * 100, 100); }, 1500);
}

function createBubble() {}
function createBubbleAtPoint() {}
function triggerButtonBubbles() {}
function triggerPourParticles() {}


function resetLevel() { save.activeLevel = null; loadLevel(level); }

function toggleMap() {
    const modal = document.getElementById("mapModal");
    const grid = document.getElementById("mapGrid");

    modal.style.display = "flex";

    requestAnimationFrame(() => {
        modal.classList.add("show");
    });

    grid.innerHTML = "";
    for (let i = 1; i <= Math.max(save.level, 50); i++) {
        const locked = i > save.level;
        const btn = document.createElement("div");
        btn.className = "level-btn" + (locked ? " locked" : "") + (i === level ? " active" : "");
        const s = save.stars[i] || 0;
        btn.innerHTML = locked
            ? "🔒"
            : `<span>${i}</span><div style="color:#facc15;font-size:10px">${"★".repeat(s)}</div>`;

        if (!locked) btn.onclick = () => {
            save.activeLevel = null;
            loadLevel(i);
            closeMap();
        };
        grid.appendChild(btn);
    }
}


function closeMap() {
    const modal = document.getElementById("mapModal");
    modal.classList.remove("show");

    setTimeout(() => {
        modal.style.display = "none";
    }, 350);
}



function toggleAbout() {
    const modal = document.getElementById("aboutModal");
    modal.style.display = "flex";
    requestAnimationFrame(() => modal.classList.add("show"));
}

function closeAbout() {
    const modal = document.getElementById("aboutModal");
    modal.classList.remove("show");
    setTimeout(() => modal.style.display = "none", 350);
}
