<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Space Impact Game</title>
<style>
:root{--primary:#00e5ff;--danger:#ff4d4d;}
*{box-sizing:border-box;touch-action:none}
body{margin:0;height:100vh;background:#020617;display:flex;justify-content:center;align-items:center;font-family:system-ui;color:white;}
.game{width:min(100%,360px);aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 0 40px rgba(0,229,255,.4);}
.topbar{position:absolute;top:env(safe-area-inset-top);left:0;right:0;height:48px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.95),rgba(0,0,0,.4));z-index:50;font-size:14px;}
#soundBtn{cursor:pointer}
canvas{width:100%;height:100%;display:block;}
.controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:10px;z-index:40;}
.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  touch-action:none;
  user-select:none;
  color:#00e5ff;

  /* ======= BASE BUTTON ======= */

  /* ❄ Frosted glass */
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  /* 🕹️ Retro arcade outline */
  border:2px solid rgba(127,252,255,0.6);
  outline:2px dashed rgba(127,252,255,0.25);
  outline-offset:-6px;

  /* 🌈 Cyberpunk hologram glow */
  box-shadow:
    inset 0 0 20px rgba(0,229,255,.4),
    0 0 14px rgba(0,229,255,.4),
    0 0 30px rgba(0,229,255,.25);

  text-shadow:
    0 0 6px rgba(0,229,255,.9),
    0 0 14px rgba(0,229,255,.6);

  transition:transform .12s ease;
  position:relative;
  overflow:hidden;
}

/* 🌈 Hologram shimmer layer */
.btn::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(0,255,255,.25),
    transparent
  );
  animation:holo 4s linear infinite;
}

/* 🔥 Pulse while holding */
.btn:active{
  transform:scale(.92);
  animation:pulse .6s infinite alternate;
}

/* ======= FIRE BUTTON ======= */
.fire{
  color:#ff9a9a;
  background:rgba(255,80,80,0.12);

  border-color:rgba(255,80,80,.65);
  outline-color:rgba(255,80,80,.35);

  box-shadow:
    inset 0 0 22px rgba(255,80,80,.45),
    0 0 18px rgba(255,80,80,.45),
    0 0 34px rgba(255,80,80,.25);

  text-shadow:
    0 0 6px rgba(255,80,80,.9),
    0 0 16px rgba(255,80,80,.7);
}

.fire::before{
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,120,120,.35),
    transparent
  );
}

/* ======= ANIMATIONS ======= */
@keyframes holo{
  from{transform:translateX(-60%)}
  to{transform:translateX(60%)}
}

@keyframes pulse{
  from{
    box-shadow:
      inset 0 0 24px currentColor,
      0 0 18px currentColor;
  }
  to{
    box-shadow:
      inset 0 0 38px currentColor,
      0 0 32px currentColor;
  }
}


@media(hover:hover){.controls{display:none}}
.overlay{position:absolute;inset:0;background:radial-gradient(circle,#020617,#000);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:60;}
.start-btn{margin-top:20px;padding:14px 36px;font-size:20px;font-weight:900;border:none;border-radius:14px;background:linear-gradient(135deg,#00e5ff,#0077ff);color:white;cursor:pointer;}
.hidden{display:none;}
</style>
</head>
<body>

<div class="game">
  <div class="topbar">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="high">0</span></div>
    <div>Kills: <span id="kills">0</span></div>
    <div id="soundBtn">🔊</div>
  </div>

  <canvas id="game" width="360" height="640"></canvas>

  <div class="controls">
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
    <button class="btn fire" id="fire">FIRE</button>
  </div>

  <div class="overlay" id="startScreen">
    <h1>SPACE IMPACT</h1>
    <button class="start-btn" onclick="startGame()">START GAME</button>
  </div>
</div>

<script>
/* ================= SETUP ================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const highEl=document.getElementById("high");
const killsEl=document.getElementById("kills");
const startScreen=document.getElementById("startScreen");
const soundBtn=document.getElementById("soundBtn");

/* 🔧 FIXED: explicit mobile buttons */
const leftBtn=document.getElementById("left");
const rightBtn=document.getElementById("right");
const fireBtn=document.getElementById("fire");

let soundOn=true;
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?"🔊":"🔇"}

const shootSound=new Audio("sound/shoot.mp3");
const boomSound=new Audio("sound/explosion.mp3");
const enemyShootSound=new Audio("sound/enemy-shoot.mp3");
const playerDeathSound=new Audio("sound/player-death.mp3");
[shootSound,boomSound,enemyShootSound,playerDeathSound].forEach(s=>s.volume=0.6);
const playSound=s=>soundOn&&(s.currentTime=0,s.play().catch(()=>{}));

const rand=(a,b)=>Math.random()*(b-a)+a;
const collide=(a,b)=>a&&b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ================= STATE ================= */
let running=false,frame=0,shake=0;
let score=0,kills=0;
let high=+localStorage.getItem("highScore")||0;
highEl.textContent=high;

const ship={x:160,y:560,w:24,h:24,s:6};
let bullets=[],enemies=[],enemyBullets=[],explosions=[];
let boss=null;

/* ================= STARS ================= */
const stars=Array.from({length:60},()=>({x:rand(0,360),y:rand(0,640),s:rand(.4,1.6)}));

/* ================= DRAW ================= */
function drawPlayer(x,y){
  ctx.fillStyle="#0ff";
  ctx.fillRect(x+8,y,8,16);
  ctx.fillRect(x,y+10,8,8);
  ctx.fillRect(x+16,y+10,8,8);
  ctx.fillStyle="#fff";
  ctx.fillRect(x+10,y+4,4,4);
}
function drawEnemy(e){
  ctx.fillStyle="#aaa";
  ctx.fillRect(e.x+4,e.y,12,12);
  ctx.fillStyle="#000";
  ctx.fillRect(e.x+7,e.y+4,2,2);
  ctx.fillRect(e.x+11,e.y+4,2,2);
}
function drawZigZag(e){
  ctx.fillStyle="#4f4";
  ctx.fillRect(e.x+2,e.y,16,10);
  ctx.fillRect(e.x+6,e.y+10,8,6);
}
function drawKamikaze(e){
  ctx.fillStyle="#f44";
  ctx.fillRect(e.x+6,e.y,8,16);
  ctx.fillStyle="#fff";
  ctx.fillRect(e.x+8,e.y+4,4,4);
}
function drawBoss(b){
  // === GLOW AURA ===
  ctx.save();
  ctx.shadowColor = "rgba(255,0,0,0.7)";
  ctx.shadowBlur = 25;

  // === BODY GRADIENT ===
  const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  grad.addColorStop(0, "#ff3b3b");
  grad.addColorStop(0.5, "#8b0000");
  grad.addColorStop(1, "#400000");

  ctx.fillStyle = grad;
  ctx.fillRect(b.x, b.y, b.w, b.h);

  ctx.restore();

  // === NEON OUTLINE ===
  ctx.strokeStyle = "rgba(255,80,80,0.9)";
  ctx.lineWidth = 3;
  ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);

  // === CORE EYE (PULSING) ===
  const pulse = Math.sin(frame * 0.15) * 4;
  ctx.beginPath();
  ctx.arc(
    b.x + b.w / 2,
    b.y + b.h / 2,
    10 + pulse,
    0,
    Math.PI * 2
  );
  ctx.fillStyle = "#fff";
  ctx.shadowColor = "#ff0000";
  ctx.shadowBlur = 20;
  ctx.fill();
  ctx.shadowBlur = 0;

  // === SIDE CANNONS ===
  ctx.fillStyle = "#111";
  ctx.fillRect(b.x + 8, b.y + 15, 16, 20);
  ctx.fillRect(b.x + b.w - 24, b.y + 15, 16, 20);
}


/* ================= START ================= */
function startGame(){
  score=0;kills=0;frame=0;
  bullets=[];enemies=[];enemyBullets=[];explosions=[];
  boss=null;
  ship.x=160;
  running=true;
  startScreen.classList.add("hidden");
}

/* ================= INPUT ================= */
let keys={};

window.onkeydown=e=>{
  if(e.key==="ArrowLeft")keys.left=true;
  if(e.key==="ArrowRight")keys.right=true;
  if(e.key===" ")shoot();
};
window.onkeyup=e=>{
  if(e.key==="ArrowLeft")keys.left=false;
  if(e.key==="ArrowRight")keys.right=false;
};

/* 🔧 FIXED MOBILE TOUCH HANDLING */
function bind(btn, down, up){
  btn.addEventListener("touchstart",e=>{
    e.preventDefault();
    down();
  },{passive:false});
  btn.addEventListener("touchend",e=>{
    e.preventDefault();
    up&&up();
  },{passive:false});
  btn.addEventListener("touchcancel",e=>{
    e.preventDefault();
    up&&up();
  },{passive:false});
}

bind(leftBtn,()=>keys.left=true,()=>keys.left=false);
bind(rightBtn,()=>keys.right=true,()=>keys.right=false);
bind(fireBtn,()=>shoot());

canvas.addEventListener("touchmove",e=>{
  const r=canvas.getBoundingClientRect();
  ship.x=e.touches[0].clientX-r.left-ship.w/2;
},{passive:false});

/* ================= SHOOT ================= */
function shoot(){
  if(!running)return;
  bullets.push({x:ship.x+10,y:ship.y,w:4,h:10,s:8});
  playSound(shootSound);
}

/* ================= ENEMIES ================= */
function spawnEnemy(){
  const t=Math.random();
  if(t<0.33)enemies.push({type:"zigzag",x:rand(20,320),y:-30,w:20,h:20,a:0});
  else if(t<0.66)enemies.push({type:"kamikaze",x:rand(20,320),y:-30,w:20,h:20});
  else enemies.push({type:"basic",x:rand(20,320),y:-30,w:20,h:20});
}

/* ================= BOSS ================= */
function spawnBoss(){
  boss={x:120,y:40,w:120,h:60,hp:80,max:80,dx:2,fire:60};
}

/* ================= EXPLOSION ================= */
function explode(x,y,p=1){
  shake=10*p;playSound(boomSound);
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2,s=rand(2,5)*p;
    explosions.push({x,y,dx:Math.cos(a)*s,dy:Math.sin(a)*s,life:30});
  }
}

/* ================= DEATH ================= */
function death(){
  running=false;
  playSound(playerDeathSound);
  explode(ship.x,ship.y,2);
  if(score>high){
    high=score;
    localStorage.setItem("highScore",high);
    highEl.textContent=high;
  }
  setTimeout(()=>startScreen.classList.remove("hidden"),900);
}

/* ================= UPDATE ================= */
function update(){
  if(!running)return;
  frame++;

  ship.x+=(keys.right?ship.s:0)-(keys.left?ship.s:0);
  ship.x=Math.max(0,Math.min(336,ship.x));

  stars.forEach(s=>{s.y+=s.s;if(s.y>640)s.y=0});

  if(frame%20===0&&!boss)spawnEnemy();
  if(!boss&&kills>=10&&Math.random()<0.005)spawnBoss();

  enemies.forEach(e=>{
    if(e.type==="zigzag"){e.a+=0.05;e.y+=2;e.x+=Math.sin(e.a)*2;}
    else if(e.type==="kamikaze"){e.y+=3;e.x+=(ship.x-e.x)*0.03;}
    else e.y+=2;
  });

  bullets.forEach(b=>b.y-=b.s);
  enemyBullets.forEach(b=>b.y+=b.s);

  if(boss){
    boss.x+=boss.dx;
    if(boss.x<20||boss.x>220)boss.dx*=-1;
    boss.fire--;
    if(boss.fire<=0){
      enemyBullets.push({x:boss.x+60,y:boss.y+60,w:6,h:14,s:4});
      playSound(enemyShootSound);
      boss.fire=50;
    }
  }

  enemies.forEach(e=>collide(ship,e)&&death());
  enemyBullets.forEach(b=>collide(ship,b)&&death());

  for(let i=enemies.length-1;i>=0;i--){
    for(let j=bullets.length-1;j>=0;j--){
      if(collide(enemies[i],bullets[j])){
        bullets.splice(j,1);
        explode(enemies[i].x,enemies[i].y,.8);
        enemies.splice(i,1);
        score+=10;kills++;
        break;
      }
    }
  }

  if(boss){
    for(let i=bullets.length-1;i>=0;i--){
      if(collide(bullets[i],boss)){
        bullets.splice(i,1);
        boss.hp--;
        explode(boss.x+60,boss.y+30,.5);
        if(boss.hp<=0){
          explode(boss.x+60,boss.y+30,3);
          score+=50;
          boss=null;
        }
      }
    }
  }

  explosions.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.dy+=.1;p.life--});
  explosions=explosions.filter(p=>p.life>0);
  enemies=enemies.filter(e=>e.y<700);
  bullets=bullets.filter(b=>b.y>-20);
  enemyBullets=enemyBullets.filter(b=>b.y<700);

  scoreEl.textContent=score;
  killsEl.textContent=kills;
}

/* ================= DRAW ================= */
function draw(){
  ctx.save();
  if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.9}
  ctx.clearRect(0,0,360,640);

  ctx.fillStyle="#fff";
  stars.forEach(s=>ctx.fillRect(s.x,s.y,2,2));

  drawPlayer(ship.x,ship.y);

  ctx.fillStyle="#fff";
  bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

  enemies.forEach(e=>{
    if(e.type==="zigzag")drawZigZag(e);
    else if(e.type==="kamikaze")drawKamikaze(e);
    else drawEnemy(e);
  });

  ctx.fillStyle="#ff0";
  enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

  if (boss) {
    drawBoss(boss);

    // === BOSS HEALTH BAR ===
    const hpW = 200 * (boss.hp / boss.max);
    const hpGrad = ctx.createLinearGradient(80, 0, 280, 0);
    hpGrad.addColorStop(0, "#ff4d4d");
    hpGrad.addColorStop(1, "#ff0000");

    ctx.shadowColor = "rgba(255,0,0,0.8)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = hpGrad;
    ctx.fillRect(80, 50, hpW, 8);

    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(80, 50, 200, 8);
}


  explosions.forEach(p=>{
    ctx.fillStyle=`rgba(255,160,60,${p.life/30})`;
    ctx.fillRect(p.x,p.y,3,3);
  });

  ctx.restore();
}

/* ================= LOOP ================= */
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
