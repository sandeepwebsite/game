<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberRunner // Neo-Tokyo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --dark-bg: #0d0e15;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: var(--dark-bg);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Fluid HUD Layout --- */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: max(16px, env(safe-area-inset-left));
            right: max(16px, env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        /* Dynamically scales text down to a crisp 16px on tiny phones */
        #score-container {
            font-size: clamp(1rem, 4vw, 1.4rem);
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .cyber-btn {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 6px 12px;
            font-size: clamp(0.75rem, 3vw, 0.9rem);
            cursor: pointer;
            pointer-events: auto;
            text-shadow: 0 0 5px var(--neon-pink);
            box-shadow: 0 0 5px rgba(255, 0, 127, 0.3);
            transition: all 0.2s;
        }

        /* --- Fluid UI Overlay Screens --- */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 21, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.3s ease;
            padding: 24px;
            text-align: center;
        }

        .overlay-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Clamped title prevents breaking or line-wrapping on narrow mobile ports */
        #overlay-title {
            font-size: clamp(1.8rem, 8vw, 3.2rem);
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            margin: 0 0 12px 0;
            letter-spacing: 2px;
            font-weight: 700;
            line-height: 1.2;
        }

        #overlay-subtitle {
            color: #aaa;
            margin: 0 0 30px 0;
            font-size: clamp(0.8rem, 3.5vw, 1.05rem);
            letter-spacing: 1px;
            line-height: 1.4;
            max-width: 90%;
        }

        .cyber-btn-large {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.95rem, 4.5vw, 1.25rem);
            font-weight: 700;
            padding: 14px 32px;
            cursor: pointer;
            text-shadow: 0 0 8px var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            clip-path: polygon(0 0, 85% 0, 100% 30%, 100% 100%, 15% 100%, 0 70%);
            transition: all 0.2s;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div id="score-container">SCORE: <span id="score-val">00000</span></div>
            <button id="mute-btn" class="cyber-btn">MUTE</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="overlay" class="overlay-visible">
            <h1 id="overlay-title">CYBER_RUNNER</h1>
            <p id="overlay-subtitle">TAP ANYWHERE ON THE SCREEN TO JUMP</p>
            <button id="start-btn" class="cyber-btn-large">INITIALIZE ENGINE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreVal = document.getElementById('score-val');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const startBtn = document.getElementById('start-btn');
        const muteBtn = document.getElementById('mute-btn');

        let audioCtx = null;
        let isMuted = localStorage.getItem('gameMuted') === 'true';
        updateMuteButtonUI();

        let gameRunning = false;
        let score = 0;
        let gameSpeed = 5;
        let baseSpeed = 5;
        let maxSpeed = 15;
        let obstacles = [];
        let particles = [];
        let frameCount = 0;

        let FLOOR_Y = 0;
        let GRAVITY = 0;
        
        const player = {
            x: 0,
            y: 0,
            width: 0,
            height: 0,
            vy: 0,
            jumpForce: 0,
            isGrounded: false,
            color: '#ff007f', 
            trail: []
        };

        function resizeCanvasToViewport() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            FLOOR_Y = canvas.height * 0.75; 
            
            player.width = Math.max(32, canvas.width * 0.045);
            player.height = player.width * 1.4; 
            player.x = Math.max(35, canvas.width * 0.12);
            
            GRAVITY = canvas.height * 0.0013;
            player.jumpForce = -(canvas.height * 0.033);

            if (!gameRunning) {
                player.y = FLOOR_Y - player.height;
            }
        }

        window.addEventListener('resize', resizeCanvasToViewport);
        resizeCanvasToViewport();

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            e.preventDefault();
            triggerJump();
        }, { passive: false });
        
        window.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            e.preventDefault();
            triggerJump();
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            startGame();
        });
        
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });

        function startGame() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            score = 0;
            baseSpeed = Math.max(5, canvas.width * 0.008);
            maxSpeed = baseSpeed * 2.2;
            gameSpeed = baseSpeed;
            obstacles = [];
            particles = [];
            frameCount = 0;
            
            resizeCanvasToViewport();
            player.y = FLOOR_Y - player.height;
            player.vy = 0;
            player.trail = [];
            
            overlay.classList.add('overlay-hidden');
            gameRunning = true;
            playTone(220, 0.1, 'sawtooth'); 
            animate();
        }

        function gameOver() {
            gameRunning = false;
            localStorage.setItem('highScore', Math.max(score, localStorage.getItem('highScore') || 0));
            
            playTone(100, 0.3, 'sawtooth');
            playTone(60, 0.4, 'triangle');

            overlayTitle.innerText = "SYSTEM_FAILURE";
            overlayTitle.style.color = "var(--neon-pink)";
            overlayTitle.style.textShadow = "0 0 15px var(--neon-pink)";
            overlaySubtitle.innerHTML = `SCORE: ${Math.floor(score)} | HIGH SCORE: ${Math.floor(localStorage.getItem('highScore'))}`;
            startBtn.innerText = "REBOOT SYSTEM";
            overlay.classList.remove('overlay-hidden');
        }

        function triggerJump() {
            if (!gameRunning) return;
            
            if (player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
                playTone(440, 0.08, 'square'); 
                spawnParticles(player.x + player.width/2, player.y + player.height, '#00f3ff', 10);
            }
        }

        function playTone(frequency, duration, type = 'sine') {
            if (isMuted || !audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = frequency;
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { console.error(e); }
        }

        function toggleMute() {
            isMuted = !isMuted;
            localStorage.setItem('gameMuted', isMuted);
            updateMuteButtonUI();
        }

        function updateMuteButtonUI() {
            muteBtn.innerText = isMuted ? "UNMUTE" : "MUTE";
            if(isMuted) {
                muteBtn.style.color = '#555';
                muteBtn.style.borderColor = '#555';
                muteBtn.style.textShadow = 'none';
            } else {
                muteBtn.style.color = 'var(--neon-pink)';
                muteBtn.style.borderColor = 'var(--neon-pink)';
                muteBtn.style.textShadow = '0 0 5px var(--neon-pink)';
            }
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6 - (gameSpeed * 0.15),
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function drawCyberRunner(ctx, x, y, width, height, frame, color, isGrounded) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.shadowBlur = 10;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(2.2, width * 0.08); 
            ctx.fillStyle = color;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            let phase = isGrounded ? Math.sin(frame * 0.22) : 0.4;

            ctx.beginPath();
            ctx.arc(width * 0.55, height * 0.15, width * 0.16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = Math.max(1.2, width * 0.04);
            ctx.beginPath();
            ctx.moveTo(width * 0.55 + (width * 0.06), height * 0.15 - 2);
            ctx.lineTo(width * 0.55 + (width * 0.16), height * 0.15 + 2);
            ctx.stroke();

            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(2.2, width * 0.08);

            let neckX = width * 0.5;
            let neckY = height * 0.28;
            let hipX = width * 0.3;
            let hipY = height * 0.62;
            
            ctx.beginPath();
            ctx.moveTo(neckX, neckY);
            ctx.lineTo(hipX, hipY);
            ctx.stroke();

            let knee1X = hipX + (width * 0.1) + (phase * (width * 0.22));
            let knee1Y = hipY + (height * 0.18);
            let foot1X = hipX - (width * 0.15) + (phase * (width * 0.3));
            let foot1Y = height;
            
            ctx.beginPath();
            ctx.moveTo(hipX, hipY);
            ctx.lineTo(knee1X, knee1Y);
            ctx.lineTo(foot1X, foot1Y);
            ctx.stroke();

            let knee2X = hipX + (width * 0.35) - (phase * (width * 0.22));
            let knee2Y = hipY + (height * 0.16) + (isGrounded ? 0 : -3);
            let foot2X = hipX + (width * 0.45) - (phase * (width * 0.3));
            let foot2Y = isGrounded ? height : height - (height * 0.08);
            
            ctx.beginPath();
            ctx.moveTo(hipX, hipY);
            ctx.lineTo(knee2X, knee2Y);
            ctx.lineTo(foot2X, foot2Y);
            ctx.stroke();

            let shoulderX = neckX - 2;
            let shoulderY = neckY + 2;
            let elbowX = shoulderX - (width * 0.25) - (phase * (width * 0.12));
            let elbowY = shoulderY + (height * 0.14);
            let handX = shoulderX + (width * 0.25) + (phase * (width * 0.15));
            let handY = elbowY - (phase * 4);

            ctx.beginPath();
            ctx.moveTo(shoulderX, shoulderY);
            ctx.lineTo(elbowX, elbowY);
            ctx.lineTo(handX, handY);
            ctx.stroke();

            ctx.restore();
        }

        function animate() {
            if (!gameRunning) return;
            frameCount++;
            
            ctx.fillStyle = '#0d0e15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            gameSpeed = Math.min(baseSpeed + (frameCount / 800), maxSpeed);
            score += gameSpeed * 0.015;
            scoreVal.innerText = String(Math.floor(score)).padStart(5, '0');

            ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
            ctx.lineWidth = 1;
            let spacing = Math.max(40, canvas.width * 0.06);
            for(let i = 0; i < canvas.width + spacing; i += spacing) {
                ctx.beginPath();
                ctx.moveTo(i - ((frameCount * gameSpeed * 0.4) % spacing), 0);
                ctx.lineTo(i - ((frameCount * gameSpeed * 0.4) % spacing), FLOOR_Y);
                ctx.stroke();
            }

            player.vy += GRAVITY;
            player.y += player.vy;

            if (player.y + player.height >= FLOOR_Y) {
                player.y = FLOOR_Y - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            if (frameCount % 3 === 0) {
                player.trail.push({x: player.x, y: player.y});
                if (player.trail.length > 4) player.trail.shift();
            }

            player.trail.forEach((pos, idx) => {
                drawCyberRunner(ctx, pos.x, pos.y, player.width, player.height, frameCount - (idx * 3), `rgba(255, 0, 127, ${0.04 * idx})`, player.isGrounded);
            });

            drawCyberRunner(ctx, player.x, player.y, player.width, player.height, frameCount, player.color, player.isGrounded);

            if (frameCount % Math.max(50, Math.floor(110 - gameSpeed * 3)) === 0) {
                let isTall = Math.random() > 0.4;
                let obsHeight = isTall ? player.height * 1.1 : player.height * 0.55;
                let obsWidth = isTall ? player.width * 0.6 : player.width * 1.2;

                obstacles.push({
                    x: canvas.width,
                    y: FLOOR_Y - obsHeight,
                    width: obsWidth,
                    height: obsHeight,
                    color: '#00f3ff' 
                });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                ctx.shadowBlur = 10;
                ctx.shadowColor = obs.color;
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.shadowBlur = 0;

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameOver();
                    return;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1.0; 
            }

            ctx.strokeStyle = 'var(--neon-cyan)';
            ctx.lineWidth = Math.max(3, canvas.height * 0.006);
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'var(--neon-cyan)';
            ctx.beginPath();
            ctx.moveTo(0, FLOOR_Y);
            ctx.lineTo(canvas.width, FLOOR_Y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#141622';
            ctx.fillRect(0, FLOOR_Y + ctx.lineWidth/2, canvas.width, canvas.height - FLOOR_Y);

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
