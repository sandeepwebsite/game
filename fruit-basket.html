<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Basket</title>
    <style>
        :root { 
            --bg: #fff5f8; --panel: #ffe0e9; --text: #ff4d8d; 
            --basket-rim: #5d4037; --basket-side: #795548;
        }

        body { 
            margin: 0; background: var(--bg); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif; touch-action: none; 
            overflow: hidden; color: var(--text);
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            20% { transform: translate(-3px, 0px); }
            40% { transform: translate(3px, 2px); }
            60% { transform: translate(-1px, -1px); }
            100% { transform: translate(0px, 0px); }
        }
        .shake { animation: shake 0.2s ease-in-out; }

        #ui { 
            display: flex; gap: 10px; margin-bottom: 10px; z-index: 10; 
            width: 90vw; max-width: 380px; justify-content: center;
        }

        .stat-box, #mute-btn { 
            background: white; padding: 8px 15px; border-radius: 20px; 
            border: 3px solid var(--panel); box-shadow: 0 4px 0 var(--panel);
            font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px;
        }

        #evolution-bar {
            display: flex; gap: 5px; background: rgba(255,255,255,0.6); 
            padding: 5px 10px; border-radius: 15px; margin-bottom: 10px;
        }
        .evo-item { opacity: 0.3; font-size: 14px; transition: all 0.3s; }
        .evo-active { opacity: 1; transform: scale(1.2); }

        #game-wrapper { 
            position: relative; width: 90vw; max-width: 380px; height: 70vh;
            background: #fff; border-left: 12px solid var(--basket-side);
            border-right: 12px solid var(--basket-side); border-bottom: 18px solid var(--basket-rim);
            border-radius: 0 0 35px 35px;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.05), 0 15px 0 #3e2723;
        }

        #next-preview {
            position: absolute; top: -55px; right: 10px;
            background: white; border: 3px solid var(--panel);
            border-radius: 15px; padding: 5px 12px; text-align: center;
        }

        #danger-line {
            position: absolute; top: 90px; left: 0; width: 100%; height: 2px;
            border-top: 2px dashed rgba(255, 0, 0, 0.4); display: none;
        }

        #container { width: 100%; height: 100%; overflow: hidden; }
        
        .popup { 
            position: absolute; color: var(--text); font-weight: bold; pointer-events: none; 
            animation: floatUp 0.8s ease-out forwards; z-index: 100; font-size: 20px;
            text-shadow: 2px 2px 0 white;
        }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(1.5); opacity: 0; } }

        button {
            background: var(--text); color: white; border: none; padding: 10px 25px;
            border-radius: 15px; font-family: inherit; font-size: 16px; cursor: pointer;
            margin-top: 10px; box-shadow: 0 4px 0 #d63031;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat-box">Score: <strong id="score">0</strong></div>
        <div class="stat-box">Best: <strong id="best">0</strong></div>
        <div id="mute-btn">🔊</div>
    </div>

    <div id="evolution-bar"></div>

    <div id="game-wrapper">
        <div id="next-preview">
            <small style="font-size: 10px; display: block; opacity: 0.6;">NEXT</small>
            <span id="next-emoji-text" style="font-size: 24px;">🍒</span>
        </div>
        <div id="danger-line"></div>
        <div id="container"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Vector } = Matter;

        const EMOJIS = [
            { label: '🍒', radius: 15, score: 2, color: '#ff4d4d' },
            { label: '🍓', radius: 22, score: 4, color: '#ff6b6b' },
            { label: '🍇', radius: 32, score: 8, color: '#a29bfe' },
            { label: '🍊', radius: 44, score: 16, color: '#fdcb6e' },
            { label: '🍎', radius: 56, score: 32, color: '#d63031' },
            { label: '🍐', radius: 68, score: 64, color: '#55efc4' },
            { label: '🍑', radius: 80, score: 128, color: '#fab1a0' },
            { label: '🍍', radius: 92, score: 256, color: '#f1c40f' },
            { label: '🍈', radius: 105, score: 512, color: '#81ecec' },
            { label: '🍉', radius: 125, score: 1024, color: '#2ecc71' }
        ];

        const wrapper = document.getElementById('game-wrapper');
        const WIDTH = wrapper.clientWidth;
        const HEIGHT = wrapper.clientHeight;
        
        let score = 0;
        let highscore = localStorage.getItem('emoji-merge-best') || 0;
        document.getElementById('best').innerText = highscore;

        let isMuted = localStorage.getItem('emoji-mute-setting') === 'true';
        document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';

        let currentLvl = Math.floor(Math.random() * 3);
        let nextLvl = Math.floor(Math.random() * 3);
        let mouseX = WIDTH / 2, canDrop = true, isGameOver = false;
        let particles = [], dangerTicks = 0;

        const evoBar = document.getElementById('evolution-bar');
        EMOJIS.forEach((e, i) => {
            const s = document.createElement('span');
            s.className = 'evo-item';
            s.id = `evo-${i}`;
            s.innerText = e.label;
            evoBar.appendChild(s);
        });
        document.getElementById('next-emoji-text').innerText = EMOJIS[nextLvl].label;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, type, dur) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + dur);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        const engine = Engine.create();
        const render = Render.create({
            element: document.getElementById('container'),
            engine: engine,
            options: { width: WIDTH, height: HEIGHT, wireframes: false, background: 'transparent' }
        });

        // WALLS & GROUND FIX: Ensuring no overlap and low friction so fruits slide
        const wallOpt = { isStatic: true, friction: 0.05, restitution: 0.2 };
        Composite.add(engine.world, [
            // Ground (exactly at the visual bottom)
            Bodies.rectangle(WIDTH/2, HEIGHT + 10, WIDTH, 20, wallOpt),
            // Left & Right walls (shifted outside so they don't block the visual sides)
            Bodies.rectangle(-10, HEIGHT/2, 20, HEIGHT, wallOpt),
            Bodies.rectangle(WIDTH + 10, HEIGHT/2, 20, HEIGHT, wallOpt)
        ]);

        function createEmoji(x, y, lvl) {
            const d = EMOJIS[lvl];
            document.getElementById(`evo-${lvl}`).classList.add('evo-active');
            return Bodies.circle(x, y, d.radius, {
                label: `lvl_${lvl}`, restitution: 0.3, friction: 0.1,
                render: { label: d.label, size: d.radius * 1.6, color: d.color }
            });
        }

        function createSplash(x, y, color) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 1.0, color
                });
            }
        }

        const handleInput = (e) => {
            if(isGameOver) return;
            if (e.cancelable) e.preventDefault();

            const r = render.canvas.getBoundingClientRect();
            let clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
            
            const relativeX = clientX - r.left;
            const padding = EMOJIS[currentLvl].radius + 5;
            mouseX = Math.max(padding, Math.min(WIDTH - padding, relativeX));
        };

        render.canvas.addEventListener('mousemove', handleInput);
        render.canvas.addEventListener('touchmove', handleInput, { passive: false });
        render.canvas.addEventListener('touchstart', handleInput, { passive: false });

        render.canvas.addEventListener('pointerup', (e) => {
            if(e.target.id === 'mute-btn') return;
            if(!canDrop || isGameOver) return;
            canDrop = false;
            playSfx(150, 'sine', 0.2);
            Composite.add(engine.world, createEmoji(mouseX, 40, currentLvl));
            
            setTimeout(() => {
                currentLvl = nextLvl;
                nextLvl = Math.floor(Math.random() * 3);
                document.getElementById('next-emoji-text').innerText = EMOJIS[nextLvl].label;
                canDrop = true;
            }, 600);
        });

        document.getElementById('mute-btn').onclick = () => {
            isMuted = !isMuted;
            document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
            localStorage.setItem('emoji-mute-setting', isMuted);
        };

        Events.on(engine, 'collisionStart', (e) => {
            e.pairs.forEach(p => {
                const { bodyA, bodyB } = p;
                if(bodyA.label === bodyB.label && bodyA.label.startsWith('lvl_')) {
                    const lvl = parseInt(bodyA.label.split('_')[1]);
                    if(lvl < EMOJIS.length - 1) {
                        const mid = Vector.div(Vector.add(bodyA.position, bodyB.position), 2);
                        Composite.remove(engine.world, [bodyA, bodyB]);
                        Composite.add(engine.world, createEmoji(mid.x, mid.y, lvl + 1));
                        
                        playSfx(300 + (lvl * 50), 'triangle', 0.3);
                        createSplash(mid.x, mid.y, EMOJIS[lvl].color);
                        if(lvl > 4) { wrapper.classList.add('shake'); setTimeout(()=>wrapper.classList.remove('shake'),200); }

                        const popup = document.createElement('div');
                        popup.className = 'popup';
                        popup.style.left = mid.x + 'px';
                        popup.style.top = mid.y + 'px';
                        popup.innerText = `+${EMOJIS[lvl].score}`;
                        wrapper.appendChild(popup);
                        setTimeout(() => popup.remove(), 800);

                        score += EMOJIS[lvl].score;
                        document.getElementById('score').innerText = score;
                        if(score > highscore) {
                            highscore = score;
                            localStorage.setItem('emoji-merge-best', highscore);
                            document.getElementById('best').innerText = highscore;
                        }
                    }
                }
            });
        });

        Events.on(engine, 'afterUpdate', () => {
            const bodies = Composite.allBodies(engine.world);
            const overLine = bodies.some(b => !b.isStatic && b.position.y < 90 && b.velocity.y < 0.1);
            if(overLine) {
                dangerTicks++;
                document.getElementById('danger-line').style.display = 'block';
                if(dangerTicks > 200 && !isGameOver) { 
                    isGameOver = true; 
                    setTimeout(() => {
                        const over = document.createElement('div');
                        over.innerHTML = `<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:30px;border-radius:25px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.3);z-index:1000;border:5px solid var(--panel);min-width:200px;"><h2>Game Over</h2><p style="font-size: 20px;">Score: <strong>${score}</strong></p><button onclick="location.reload()">Restart</button></div>`;
                        document.body.appendChild(over);
                    }, 300);
                }
            } else {
                dangerTicks = 0; document.getElementById('danger-line').style.display = 'none';
            }
        });

        Events.on(render, 'afterRender', () => {
            const ctx = render.context;
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life <= 0) particles.splice(i, 1);
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            if(canDrop && !isGameOver) {
                ctx.setLineDash([5, 10]); ctx.strokeStyle = "#ffe0e9"; ctx.beginPath();
                ctx.moveTo(mouseX, 60); ctx.lineTo(mouseX, HEIGHT); ctx.stroke();
                ctx.font = `${EMOJIS[currentLvl].radius*1.6}px serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(EMOJIS[currentLvl].label, mouseX, 40);
            }

            Composite.allBodies(engine.world).forEach(b => {
                if(b.render.label) {
                    ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
                    ctx.font = `${b.render.size}px serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(b.render.label, 0, 0); ctx.restore();
                }
            });
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);
    </script>
</body>
</html>
