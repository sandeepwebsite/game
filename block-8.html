<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🧱</text></svg>">
    <title>Blocks 8 - Pro</title>
    <style>
      :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --cell: #334155;
            --btn: #334155;
            --accent: #fbbf24;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            overflow: hidden;
            height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 420px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            filter: blur(10px); /* Blurred until start */
            transition: filter 0.5s ease;
        }

        .app.active { filter: blur(0); }

        header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: var(--panel);
            padding: 8px;
            border-radius: 12px;
            position: relative;
        }

        .cell {
            aspect-ratio: 1;
            position: relative;
            background: var(--cell);
            border-radius: 4px;
            transform: scale(0);
        }

        .cell.pop { animation: cellPop 0.4s ease-out forwards; }

        @keyframes cellPop { to { transform: scale(1); } }

        .falling-block {
            position: absolute;
            inset: 0;
            border-radius: 4px;
            z-index: 50;
            pointer-events: none;
            animation: slowFall 0.8s cubic-bezier(0.5, 0, 0.7, 0.4) forwards;
        }

        @keyframes slowFall {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            20% { transform: translateY(-5px) scale(1.1); opacity: 1; }
            100% { transform: translateY(500px) scale(0.3) rotate(20deg); opacity: 0; }
        }

        .combo-text {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            z-index: 100; pointer-events: none;
            animation: comboPop 1s ease-out forwards;
        }

        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -120%) scale(0.8); opacity: 0; }
        }

        .confetti {
            position: fixed; width: 8px; height: 8px; z-index: 1000;
            pointer-events: none; animation: confettiFall 1.5s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translate(0, 0) rotate(0); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; }
        }

        .graffiti-tag {
            font-size: 4rem; font-weight: 900; color: #f43f5e;
            text-transform: uppercase; font-style: italic;
            text-shadow: 4px 4px 0px #fff, 8px 8px 0px #000;
            margin-bottom: 20px; display: block;
            animation: graffitiScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes graffitiScale {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            100% { transform: scale(1) rotate(-5deg); opacity: 1; }
        }

        .cell.ghost {
            opacity: 0.3; outline: 2px solid rgba(255,255,255,0.5); outline-offset: -3px;
        }

        .pieces {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-top: 20px;
        }

        .piece-box {
            background: var(--panel); border-radius: 12px;
            padding: 10px; display: flex; justify-content: center;
            align-items: center; min-height: 110px;
            opacity: 0; transform: translateY(20px);
        }

        .piece-box.show {
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .piece { display: grid; gap: 3px; }
        .piece div {
            width: 22px; height: 22px; border-radius: 3px;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2);
        }

        .piece.dragging {
            position: fixed; z-index: 9999; pointer-events: none;
            transform: translate(-50%, -140px) scale(1.1);
            filter: drop-shadow(0 30px 20px rgba(0,0,0,0.8));
        }

        .controls {
            display: flex; justify-content: space-between;
            margin-top: auto; padding-bottom: 20px;
        }

        button {
            padding: 12px 20px; border-radius: 10px; border: none;
            color: white; font-weight: bold; background: var(--btn);
            box-shadow: 0 4px 0px #111; cursor: pointer;
        }

        button:active { transform: translateY(2px); box-shadow: 0 2px 0px #111; }
        button:disabled { opacity: 0.3; cursor: default; }

        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            display: flex; align-items: center; justify-content: center; z-index: 10000; 
        }
        .hidden { display: none !important; }
        .popup { background: var(--panel); padding: 40px; border-radius: 30px; text-align: center; width: 85%; max-width: 350px; border: 2px solid #334155; }
        
        #startModal h1 { font-size: 3rem; margin: 0; color: var(--accent); text-shadow: 3px 3px 0 #000; }
    </style>
  </head>
  <body>

    <div class="overlay" id="startModal">
        <div class="popup">
            <h1>BLOCKS</h1>
            <p style="margin-bottom:30px; opacity:0.8">Match lines to survive!</p>
            <button onclick="startGame()" style="background:var(--success); width:100%; padding:18px; font-size:1.2rem">START GAME</button>
        </div>
    </div>

    <div class="app" id="gameApp">
      <header>
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="high">0</span></div>
      </header>
      <div class="board" id="board"></div>
      <div class="pieces" id="pieces"></div>
      <div class="controls">
        <button id="undo" disabled>UNDO</button>
        <button id="mute">🔊</button>
      </div>
    </div>

    <div class="overlay hidden" id="gameOver">
      <div class="popup">
        <div id="graffitiContainer"></div>
        <h1 id="gameOverTitle">GAME OVER</h1>
        <p>Score: <span id="finalScore" style="font-size:1.5rem"></span></p>
        <button onclick="resetGame()" style="background:var(--success); width:100%; padding:15px; margin-top:10px">PLAY AGAIN</button>
      </div>
    </div>

    <script>
      const boardEl = document.getElementById("board");
      const piecesEl = document.getElementById("pieces");
      const scoreEl = document.getElementById("score");
      const highEl = document.getElementById("high");
      const undoBtn = document.getElementById("undo");
      const startModal = document.getElementById("startModal");
      const gameOverModal = document.getElementById("gameOver");
      const muteBtn = document.getElementById("mute");

      let grid = Array(64).fill(null);
      let score = 0;
      let history = null;
      let dragging = null;
      let gameEnded = false;
      let startX = 0, startY = 0;
      let isDragging = false;

      // Audio & Persistence
      let muted = localStorage.getItem("blocks8_muted") === "true";
      muteBtn.textContent = muted ? "🔇" : "🔊";
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const shapes = [
        {s:[[1]], c:"#22c55e"}, {s:[[1,1]], c:"#38bdf8"}, 
        {s:[[1,1,1]], c:"#a78bfa"}, {s:[[1,1],[1,1]], c:"#facc15"},
        {s:[[1,1,1],[0,1,0]], c:"#fb7185"}, {s:[[1,0],[1,1]], c:"#fb923c"},
        {s:[[1,1,1,1]], c:"#60a5fa"}
      ];

      function playSound(type) {
        if (muted || audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'place') {
          osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        } else if (type === 'clear') {
          osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(50, now + 0.6);
          gain.gain.setValueAtTime(0.1, now);
        }
        osc.start(); osc.stop(now + 0.6);
      }

      function getHigh() { return parseInt(localStorage.getItem("blocks8High")) || 0; }
      highEl.textContent = getHigh();

      function startGame() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startModal.classList.add("hidden");
        document.getElementById("gameApp").classList.add("active");
        resetGame();
      }

      function initBoard(isInitial = false) {
        boardEl.innerHTML = "";
        grid.forEach((v, i) => {
          const c = document.createElement("div");
          c.className = "cell";
          if (isInitial) {
            c.classList.add("pop");
            c.style.animationDelay = (i * 0.008) + "s";
          } else {
            c.style.transform = "scale(1)";
          }
          if(v) {
            c.style.background = `linear-gradient(135deg, #fff4, ${v})`;
            c.style.boxShadow = "inset 2px 2px 4px rgba(255,255,255,0.2)";
          }
          boardEl.appendChild(c);
        });
      }

      function enableDrag(piece) {
        piece.onpointerdown = e => {
          if (gameEnded) return;
          dragging = piece; startX = e.clientX; startY = e.clientY;
          isDragging = false; piece.setPointerCapture(e.pointerId);
        };
        piece.onpointermove = e => {
          if (!dragging) return;
          const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
          if (dist > 10) {
            isDragging = true; dragging.classList.add("dragging");
            dragging.style.left = e.clientX + "px"; dragging.style.top = e.clientY + "px";
            const r = boardEl.getBoundingClientRect();
            preview(dragging.shape, Math.floor((e.clientX - r.left) / (r.width / 8)), Math.floor((e.clientY - 140 - r.top) / (r.height / 8)));
          }
        };
        piece.onpointerup = e => {
          if (!dragging) return;
          if (!isDragging) {
            dragging.shape = dragging.shape[0].map((_, i) => dragging.shape.map(row => row[i]).reverse());
            renderPieceBlocks(dragging);
          } else {
            const r = boardEl.getBoundingClientRect();
            tryPlace(dragging, Math.floor((e.clientX - r.left) / (r.width / 8)), Math.floor((e.clientY - 140 - r.top) / (r.height / 8)));
            dragging.classList.remove("dragging");
          }
          dragging = null; isDragging = false; clearGhost();
        };
      }

      function renderPieceBlocks(p) {
        p.innerHTML = "";
        p.style.gridTemplateColumns = `repeat(${p.shape[0].length}, 1fr)`;
        p.shape.flat().forEach(v => {
          const d = document.createElement("div");
          d.style.visibility = v ? "visible" : "hidden";
          d.style.background = p.color;
          p.appendChild(d);
        });
      }

      function preview(shape, x, y) {
        clearGhost();
        shape.forEach((row, dy) => row.forEach((v, dx) => {
          const cx = x + dx, cy = y + dy, i = cy * 8 + cx;
          if (v && cx >= 0 && cx < 8 && cy >= 0 && cy < 8 && !grid[i]) boardEl.children[i].classList.add("ghost");
        }));
      }

      function clearGhost() { document.querySelectorAll(".ghost").forEach(c => c.classList.remove("ghost")); }

      function tryPlace(p, x, y) {
        let cells = []; let canPlace = true;
        p.shape.forEach((row, dy) => row.forEach((v, dx) => {
          const cx = x + dx, cy = y + dy, i = cy * 8 + cx;
          if (v) {
            if (cx < 0 || cx >= 8 || cy < 0 || cy >= 8 || grid[i]) canPlace = false;
            cells.push(i);
          }
        }));
        if (!canPlace) { initBoard(); return; }

        playSound('place');
        history = [...grid]; undoBtn.disabled = false;
        cells.forEach(i => grid[i] = p.color);
        score += cells.length;
        p.parentElement.innerHTML = ""; 
        const linesCleared = clearLines();
        
        if (linesCleared) {
            playSound('clear');
            setTimeout(() => { initBoard(); update(); }, 800);
        } else {
            initBoard(); update();
        }
      }

      function clearLines() {
        let rows = [], cols = [];
        for (let y = 0; y < 8; y++) if (grid.slice(y*8, y*8+8).every(v => v)) rows.push(y);
        for (let x = 0; x < 8; x++) {
          let col = true;
          for (let y = 0; y < 8; y++) if (!grid[y*8+x]) col = false;
          if (col) cols.push(x);
        }

        const toClear = new Set();
        rows.forEach(y => { for(let x=0; x<8; x++) toClear.add(y*8+x); });
        cols.forEach(x => { for(let y=0; y<8; y++) toClear.add(y*8+x); });

        if (rows.length + cols.length >= 2) {
            const txt = document.createElement("div");
            txt.className = "combo-text"; txt.textContent = "COMBO!";
            boardEl.appendChild(txt); setTimeout(() => txt.remove(), 1000);
        }

        if (toClear.size > 0) {
          score += toClear.size + 20;
          toClear.forEach(i => {
            const cell = boardEl.children[i];
            const fall = document.createElement("div");
            fall.className = "falling-block"; fall.style.background = grid[i];
            cell.appendChild(fall); grid[i] = null;
          });
          return true;
        }
        return false;
      }

      function spawnConfetti() {
        for(let i=0; i<40; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.style.background = shapes[Math.floor(Math.random()*shapes.length)].c;
          c.style.left = "50%"; c.style.top = "50%";
          c.style.setProperty("--dx", (Math.random() - 0.5) * 600 + "px");
          c.style.setProperty("--dy", (Math.random() * 600) + 200 + "px");
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 1500);
        }
      }

      function update() {
        scoreEl.textContent = score;
        if ([...piecesEl.querySelectorAll(".piece")].length === 0) newPieces();
        checkGameOver();
      }

      function checkGameOver() {
        const pieces = [...piecesEl.querySelectorAll(".piece")];
        if (pieces.length === 0) return;
        const canMove = pieces.some(p => {
          for (let i = 0; i < 64; i++) {
            if (canFit(p.shape, i % 8, Math.floor(i / 8))) return true;
          }
          return false;
        });
        if (!canMove) {
          gameEnded = true; playSound('gameover');
          const oldBest = getHigh();
          document.getElementById("finalScore").textContent = score;
          const grafCont = document.getElementById("graffitiContainer");
          grafCont.innerHTML = "";
          
          if (score > oldBest && score > 0) {
              localStorage.setItem("blocks8High", score);
              highEl.textContent = score;
              grafCont.innerHTML = `<span class="graffiti-tag">New Best!</span>`;
              spawnConfetti();
              document.getElementById("gameOverTitle").style.display = "none";
          } else {
              document.getElementById("gameOverTitle").style.display = "block";
          }
          gameOverModal.classList.remove("hidden");
        }
      }

      function canFit(shape, x, y) {
        return shape.every((row, dy) => row.every((v, dx) => {
          if (!v) return true;
          const cx = x + dx, cy = y + dy, i = cy * 8 + cx;
          return cx >= 0 && cx < 8 && cy >= 0 && cy < 8 && !grid[i];
        }));
      }

      function newPieces(isInitial = false) {
        piecesEl.innerHTML = "";
        for(let i=0; i<3; i++) {
          const data = shapes[Math.floor(Math.random() * shapes.length)];
          const box = document.createElement("div");
          box.className = "piece-box show"; 
          box.style.animationDelay = (isInitial ? (0.6 + i*0.1) : 0) + "s";
          const p = document.createElement("div");
          p.className = "piece"; p.shape = data.s; p.color = data.c;
          renderPieceBlocks(p); enableDrag(p);
          box.appendChild(p);
          piecesEl.appendChild(box);
        }
      }

      muteBtn.onclick = () => {
        muted = !muted; localStorage.setItem("blocks8_muted", muted);
        muteBtn.textContent = muted ? "🔇" : "🔊";
      };

      undoBtn.onclick = () => {
        if (!history) return;
        grid = [...history]; history = null; undoBtn.disabled = true;
        initBoard();
      };

      function resetGame() {
        grid = Array(64).fill(null); score = 0; gameEnded = false;
        gameOverModal.classList.add("hidden"); 
        initBoard(true); newPieces(true); update();
      }

      // Pre-initialize empty visual board before start
      initBoard(false);
    </script>
  </body>
</html>
