<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ludo Game</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            redBase: '#ff3b30',
            redDark: '#b30000',
            greenBase: '#34c759',
            greenDark: '#147a2e',
            yellowBase: '#ffcc00',
            yellowDark: '#b38f00',
            blueBase: '#007aff',
            blueDark: '#004080',
          },
          animation: {
            'pulse-glow': 'pulseGlow 1.2s infinite alternate',
            'token-bounce': 'tokenBounce 0.7s infinite alternate ease-in-out',
            'dice-roll': 'diceRoll 0.5s ease-in-out infinite',
          },
          keyframes: {
            pulseGlow: {
              '0%': { opacity: '0.4', transform: 'scale(0.8)' },
              '100%': { opacity: '1', transform: 'scale(1.2)' },
            },
            tokenBounce: {
              '0%': { transform: 'scale(1) translateY(0)', boxShadow: '0 0 4px #ffffff, 0 4px 8px rgba(0,0,0,0.4)' },
              '100%': { transform: 'scale(1.3) translateY(-4px)', boxShadow: '0 0 16px #ffffff, 0 10px 16px rgba(0,0,0,0.5)' },
            },
            diceRoll: {
              '0%': { transform: 'rotate(0deg) scale(0.95)' },
              '50%': { transform: 'rotate(180deg) scale(1.1)' },
              '100%': { transform: 'rotate(360deg) scale(0.95)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      overscroll-behavior: none;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen min-h-[100dvh] bg-[#070a12] text-white overflow-hidden p-0 sm:p-3 relative">

  <!-- Game Setup Modal Overlay -->
  <div class="fixed inset-0 w-full h-full h-[100dvh] bg-[#04070d]/[0.92] backdrop-blur-2xl z-[1000] flex items-center justify-center p-3 sm:p-4 transition-all duration-300" id="setup-modal">
    <div class="bg-[rgba(18,26,43,0.98)] border border-white/10 sm:rounded-[28px] rounded-2xl p-5 w-full max-w-[420px] shadow-[0_25px_60px_rgba(0,0,0,0.9),_0_0_40px_rgba(56,189,248,0.15)] flex flex-col gap-4 text-center max-h-[92vh] overflow-y-auto">
      <div class="text-[1.35rem] font-black tracking-[1.5px] bg-gradient-to-br from-white to-sky-400 bg-clip-text text-transparent uppercase">LUDO MULTIPLAYER</div>

      <!-- Mode Selector -->
      <div>
        <div class="text-[0.72rem] font-extrabold text-slate-400 uppercase tracking-[1.2px] mb-2 text-left">Select Game Mode</div>
        <div class="grid grid-cols-2 gap-1.5 bg-black/40 p-1 rounded-2xl border border-white/10">
          <button class="opt-btn active bg-gradient-to-br from-sky-600 to-sky-700 border border-white/25 text-white shadow-[0_4px_14px_rgba(2,132,199,0.4)] rounded-xl py-2.5 px-1.5 font-bold text-[0.85rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" id="mode-offline-btn" onclick="setMatchMode('offline')">
            <span class="text-[1.1rem]">🎮</span>
            <span>Offline</span>
          </button>
          <button class="opt-btn border border-transparent rounded-xl py-2.5 px-1.5 text-slate-400 font-bold text-[0.85rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" id="mode-online-btn" onclick="setMatchMode('online')">
            <span class="text-[1.1rem]">🌐</span>
            <span>Online Room</span>
          </button>
        </div>
      </div>

      <!-- Offline Settings View -->
      <div id="offline-settings">
        <div class="text-[0.72rem] font-extrabold text-slate-400 uppercase tracking-[1.2px] mb-2 text-left">Number of Players</div>
        <div class="grid grid-cols-3 gap-1.5 bg-black/40 p-1 rounded-2xl border border-white/10">
          <button class="opt-btn active bg-gradient-to-br from-sky-600 to-sky-700 border border-white/25 text-white shadow-[0_4px_14px_rgba(2,132,199,0.4)] rounded-xl py-2.5 px-1.5 font-bold text-[0.82rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" data-count="2" onclick="selectPlayerCount(2)">
            <span class="text-[1.05rem]">👥</span>
            <span>2 Players</span>
          </button>
          <button class="opt-btn border border-transparent rounded-xl py-2.5 px-1.5 text-slate-400 font-bold text-[0.82rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" data-count="3" onclick="selectPlayerCount(3)">
            <span class="text-[1.05rem]">👥</span>
            <span>3 Players</span>
          </button>
          <button class="opt-btn border border-transparent rounded-xl py-2.5 px-1.5 text-slate-400 font-bold text-[0.82rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" data-count="4" onclick="selectPlayerCount(4)">
            <span class="text-[1.05rem]">👥</span>
            <span>4 Players</span>
          </button>
        </div>
      </div>

      <!-- Online Settings View -->
      <div id="online-settings" class="hidden flex-col gap-3">
        <div class="text-[0.72rem] font-extrabold text-slate-400 uppercase tracking-[1.2px] mb-2 text-left">Online Room Action</div>
        <div class="grid grid-cols-2 gap-1.5 bg-black/40 p-1 rounded-2xl border border-white/10">
          <button class="opt-btn active bg-gradient-to-br from-sky-600 to-sky-700 border border-white/25 text-white shadow-[0_4px_14px_rgba(2,132,199,0.4)] rounded-xl py-2.5 px-1.5 font-bold text-[0.85rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" id="online-create-btn" onclick="setOnlineAction('create')">Create Room</button>
          <button class="opt-btn border border-transparent rounded-xl py-2.5 px-1.5 text-slate-400 font-bold text-[0.85rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" id="online-join-btn" onclick="setOnlineAction('join')">Join Room</button>
        </div>

        <div id="online-player-select">
          <div class="text-[0.72rem] font-extrabold text-slate-400 uppercase tracking-[1.2px] mb-2 text-left">Room Capacity</div>
          <div class="grid grid-cols-3 gap-1.5 bg-black/40 p-1 rounded-2xl border border-white/10">
            <button class="opt-btn active bg-gradient-to-br from-sky-600 to-sky-700 border border-white/25 text-white shadow-[0_4px_14px_rgba(2,132,199,0.4)] rounded-xl py-2.5 px-1.5 font-bold text-[0.82rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" data-count="2" onclick="selectPlayerCount(2)">
              <span class="text-[1.05rem]">👥</span>
              <span>2 Players</span>
            </button>
            <button class="opt-btn border border-transparent rounded-xl py-2.5 px-1.5 text-slate-400 font-bold text-[0.82rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" data-count="3" onclick="selectPlayerCount(3)">
              <span class="text-[1.05rem]">👥</span>
              <span>3 Players</span>
            </button>
            <button class="opt-btn border border-transparent rounded-xl py-2.5 px-1.5 text-slate-400 font-bold text-[0.82rem] flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95" data-count="4" onclick="selectPlayerCount(4)">
              <span class="text-[1.05rem]">👥</span>
              <span>4 Players</span>
            </button>
          </div>
        </div>

        <input type="text" id="room-code-input" class="w-full bg-[#060b14]/80 border border-white/10 rounded-2xl p-3 text-sky-400 text-[1.15rem] font-extrabold text-center tracking-[5px] uppercase outline-none focus:border-sky-400 shadow-inner hidden" maxlength="5" placeholder="ENTER 5-DIGIT CODE" />
        <div class="text-[0.75rem] font-bold text-sky-400 min-h-[18px]" id="room-status-text">Select option to proceed</div>
      </div>

      <!-- Color Selector -->
      <div>
        <div class="text-[0.72rem] font-extrabold text-slate-400 uppercase tracking-[1.2px] mb-2 text-left">Choose Your Color</div>
        <div class="grid grid-cols-4 gap-3 py-1">
          <button class="color-btn red active aspect-square rounded-full border-[3px] border-white/20 bg-[radial-gradient(circle_at_30%_30%,_#ff6b6b,_#ff3b30)] scale-110 shadow-[0_0_18px_#ff3b30] transition-all cursor-pointer relative" onclick="selectUserColor('red')"></button>
          <button class="color-btn green aspect-square rounded-full border-[3px] border-white/10 bg-[radial-gradient(circle_at_30%_30%,_#51cf66,_#34c759)] transition-all cursor-pointer relative" onclick="selectUserColor('green')"></button>
          <button class="color-btn yellow aspect-square rounded-full border-[3px] border-white/10 bg-[radial-gradient(circle_at_30%_30%,_#fcc419,_#b38f00)] transition-all cursor-pointer relative" onclick="selectUserColor('yellow')"></button>
          <button class="color-btn blue aspect-square rounded-full border-[3px] border-white/10 bg-[radial-gradient(circle_at_30%_30%,_#339af0,_#007aff)] transition-all cursor-pointer relative" onclick="selectUserColor('blue')"></button>
        </div>
      </div>

      <button class="w-full bg-gradient-to-br from-emerald-500 to-emerald-600 border border-white/20 rounded-2xl p-3.5 text-white font-extrabold text-[0.95rem] uppercase tracking-[1.2px] shadow-[0_10px_25px_-4px_rgba(16,185,129,0.4)] transition-all active:scale-95 mt-1 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed" id="start-btn" onclick="startGame()">Start Match</button>
    </div>
  </div>

  <!-- Main App Viewport Container (Edge-to-Edge on Mobile) -->
  <div class="w-full h-full h-[100dvh] sm:h-auto sm:max-w-[460px] sm:max-h-[880px] flex flex-col justify-between gap-2 sm:gap-3 bg-[rgba(18,26,43,0.95)] sm:bg-[rgba(18,26,43,0.82)] sm:backdrop-blur-[32px] sm:border sm:border-[rgba(255,255,255,0.12)] sm:rounded-[32px] p-2.5 sm:p-4 shadow-none sm:shadow-[0_30px_60px_-12px_rgba(0,0,0,0.85)] relative z-1">
    
    <!-- Top Bar -->
    <header class="w-full flex items-center justify-between bg-[rgba(12,18,32,0.8)] border border-[rgba(255,255,255,0.1)] py-2 px-3 rounded-2xl">
      <div class="text-[0.88rem] font-black tracking-[1.2px] bg-gradient-to-br from-white to-slate-300 bg-clip-text text-transparent" id="app-title">LUDO NATIVE</div>
      <div class="text-[0.7rem] font-extrabold text-sky-400 bg-sky-500/10 py-1 px-2.5 rounded-[10px] border border-sky-400/30 hidden tracking-wide" id="room-tag">ROOM: -----</div>
      <div class="flex items-center gap-1.5 text-[0.72rem] font-extrabold uppercase py-1.5 px-3 rounded-full bg-white/[0.08] border border-white/15 tracking-wide" id="turn-badge">
        <div class="w-2 h-2 rounded-full shadow-[0_0_10px_currentColor] animate-pulse-glow" id="turn-dot"></div>
        <span id="turn-text">RED'S TURN</span>
      </div>
    </header>

    <!-- Main Board & Player Section -->
    <main class="w-full flex flex-col items-center justify-center flex-1 gap-2 sm:gap-3 my-auto">
      <!-- Top Players (Red & Green) -->
      <div class="w-full grid grid-cols-2 gap-2">
        <div class="player-card red text-redBase active opacity-100 bg-[#172138]/90 border-[currentColor] shadow-[0_4px_16px_-2px_currentColor] rounded-2xl p-2 px-3 flex items-center justify-between relative overflow-hidden transition-all duration-300" id="card-red">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-[currentColor] flex items-center justify-center text-white font-black text-[0.75rem] shadow-md">R</div>
            <span class="text-[0.82rem] font-extrabold text-slate-100" id="name-red">Red</span>
          </div>
        </div>
        <div class="player-card green text-greenBase opacity-45 bg-[#0c1220]/60 border border-[rgba(255,255,255,0.12)] rounded-2xl p-2 px-3 flex items-center justify-between relative overflow-hidden transition-all duration-300" id="card-green">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-[currentColor] flex items-center justify-center text-white font-black text-[0.75rem] shadow-md">G</div>
            <span class="text-[0.82rem] font-extrabold text-slate-100" id="name-green">Green</span>
          </div>
        </div>
      </div>

      <!-- Max-Sized Responsive Ludo Board Container -->
      <div class="w-[min(96vw,_390px)] aspect-square relative bg-slate-900 rounded-2xl p-1 shadow-[0_15px_35px_rgba(0,0,0,0.8)] border border-white/10">
        <div class="w-full h-full grid grid-cols-[repeat(15,_1fr)] grid-rows-[repeat(15,_1fr)] rounded-xl overflow-hidden bg-slate-50" id="board">
          <div class="center-home col-start-7 col-end-10 row-start-7 row-end-10 bg-[conic-gradient(#ff3b30_0deg_90deg,_#34c759_90deg_180deg,_#ffcc00_180deg_270deg,_#007aff_270deg_360deg)] border-[0.5px] border-slate-400 flex flex-wrap items-center justify-center p-0.5 gap-0.5 z-[5]"></div>
          
          <div class="home home-red col-start-1 col-end-7 row-start-1 row-end-7 bg-gradient-to-br from-[#ff5252] to-redBase flex items-center justify-center p-[8%]" id="home-red">
            <div class="home-inner w-full h-full bg-white grid grid-cols-2 grid-rows-2 p-[10%] gap-[10%] rounded-2xl shadow-[inset_0_3px_8px_rgba(0,0,0,0.25)]" id="base-red"></div>
          </div>
          <div class="home home-green col-start-10 col-end-16 row-start-1 row-end-7 bg-gradient-to-br from-[#4cd964] to-greenBase flex items-center justify-center p-[8%]" id="home-green">
            <div class="home-inner w-full h-full bg-white grid grid-cols-2 grid-rows-2 p-[10%] gap-[10%] rounded-2xl shadow-[inset_0_3px_8px_rgba(0,0,0,0.25)]" id="base-green"></div>
          </div>
          <div class="home home-yellow col-start-10 col-end-16 row-start-10 row-end-16 bg-gradient-to-br from-[#ffe066] to-yellowDark flex items-center justify-center p-[8%]" id="home-yellow">
            <div class="home-inner w-full h-full bg-white grid grid-cols-2 grid-rows-2 p-[10%] gap-[10%] rounded-2xl shadow-[inset_0_3px_8px_rgba(0,0,0,0.25)]" id="base-yellow"></div>
          </div>
          <div class="home home-blue col-start-1 col-end-7 row-start-10 row-end-16 bg-gradient-to-br from-[#4dabf7] to-blueBase flex items-center justify-center p-[8%]" id="home-blue">
            <div class="home-inner w-full h-full bg-white grid grid-cols-2 grid-rows-2 p-[10%] gap-[10%] rounded-2xl shadow-[inset_0_3px_8px_rgba(0,0,0,0.25)]" id="base-blue"></div>
          </div>
        </div>
      </div>

      <!-- Bottom Players (Blue & Yellow) -->
      <div class="w-full grid grid-cols-2 gap-2">
        <div class="player-card blue text-blueBase opacity-45 bg-[#0c1220]/60 border border-[rgba(255,255,255,0.12)] rounded-2xl p-2 px-3 flex items-center justify-between relative overflow-hidden transition-all duration-300" id="card-blue">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-[currentColor] flex items-center justify-center text-white font-black text-[0.75rem] shadow-md">B</div>
            <span class="text-[0.82rem] font-extrabold text-slate-100" id="name-blue">Blue</span>
          </div>
        </div>
        <div class="player-card yellow text-yellowBase opacity-45 bg-[#0c1220]/60 border border-[rgba(255,255,255,0.12)] rounded-2xl p-2 px-3 flex items-center justify-between relative overflow-hidden transition-all duration-300" id="card-yellow">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-[currentColor] flex items-center justify-center text-white font-black text-[0.75rem] shadow-md">Y</div>
            <span class="text-[0.82rem] font-extrabold text-slate-100" id="name-yellow">Yellow</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Controls Card -->
    <footer class="w-full flex items-center justify-between gap-2.5 pb-1">
      <div class="flex-1 bg-[rgba(12,18,32,0.8)] border border-[rgba(255,255,255,0.12)] py-2 px-3.5 rounded-2xl flex items-center gap-3 shadow-lg">
        <div class="dice-btn w-12 h-12 bg-[radial-gradient(circle_at_30%_30%,_#ffffff,_#e2e8f0)] rounded-xl grid grid-cols-3 grid-rows-3 p-1.5 gap-0.5 shadow-[0_8px_16px_rgba(0,0,0,0.4),_inset_0_-3px_4px_rgba(0,0,0,0.2)] cursor-pointer border border-white/90 active:scale-95 transition-transform" id="dice" onclick="handleDiceClick()"></div>
        <div class="dice-hint text-[0.85rem] font-extrabold text-slate-300" id="dice-hint">Tap Dice to Roll</div>
      </div>
      <div class="chat-trigger-btn w-12 h-12 rounded-2xl bg-[rgba(12,18,32,0.8)] border border-[rgba(255,255,255,0.12)] flex items-center justify-center cursor-pointer relative active:scale-95 transition-transform shadow-lg" onclick="toggleChat(true)">
        <svg class="w-6 h-6 fill-sky-400" viewBox="0 0 24 24">
          <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"></path>
        </svg>
        <div class="unread-badge absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 border-2 border-[#0b1120] rounded-full hidden" id="unread-badge"></div>
      </div>
    </footer>
  </div>

  <!-- Chat Drawer Bottom Sheet Overlay -->
  <div class="chat-drawer fixed bottom-0 left-0 w-full h-[65vh] max-h-[520px] bg-[rgba(11,17,32,0.96)] backdrop-blur-2xl rounded-t-[32px] border-t border-white/15 z-[1100] flex flex-col translate-y-full transition-transform duration-300 shadow-[0_-15px_50px_rgba(0,0,0,0.9)]" id="chat-drawer">
    <div class="chat-header py-3 px-5 border-b border-white/10 flex flex-col items-center gap-2">
      <div class="drag-handle w-10 h-1.5 bg-white/20 rounded-full"></div>
      <div class="chat-header-row w-full flex items-center justify-between">
        <div class="chat-title text-[0.92rem] font-extrabold text-slate-100">Room Live Chat</div>
        <button class="chat-close-btn bg-white/10 border-none text-slate-400 w-7 h-7 rounded-full text-[0.9rem] flex items-center justify-center cursor-pointer" onclick="toggleChat(false)">✕</button>
      </div>
    </div>
    <div class="chat-messages flex-1 py-3.5 px-4 overflow-y-auto flex flex-col gap-2.5" id="chat-messages"></div>
    <div class="quick-chips flex gap-2 py-2 px-4 overflow-x-auto border-t border-white/5">
      <button class="chip-btn bg-white/10 border border-white/10 py-1.5 px-3.5 rounded-full text-[0.74rem] font-bold text-slate-200 whitespace-nowrap cursor-pointer" onclick="sendQuickMessage('Good Luck! 🎲')">Good Luck! 🎲</button>
      <button class="chip-btn bg-white/10 border border-white/10 py-1.5 px-3.5 rounded-full text-[0.74rem] font-bold text-slate-200 whitespace-nowrap cursor-pointer" onclick="sendQuickMessage('Well Played! 👏')">Well Played! 👏</button>
      <button class="chip-btn bg-white/10 border border-white/10 py-1.5 px-3.5 rounded-full text-[0.74rem] font-bold text-slate-200 whitespace-nowrap cursor-pointer" onclick="sendQuickMessage('Rolling a 6 now! 🔥')">Rolling a 6 now! 🔥</button>
      <button class="chip-btn bg-white/10 border border-white/10 py-1.5 px-3.5 rounded-full text-[0.74rem] font-bold text-slate-200 whitespace-nowrap cursor-pointer" onclick="sendQuickMessage('Oops! 😅')">Oops! 😅</button>
    </div>
    <div class="chat-input-row py-2.5 px-4 pb-5 flex gap-2">
      <input type="text" id="chat-input" class="chat-input flex-1 bg-slate-800/80 border border-white/10 rounded-full py-2.5 px-4 text-white text-[0.85rem] outline-none" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessage()" />
      <button class="send-btn bg-gradient-to-br from-sky-600 to-sky-700 border-none rounded-full w-[38px] h-[38px] flex items-center justify-center text-white cursor-pointer shadow-md" onclick="sendChatMessage()">➔</button>
    </div>
  </div>

  <!-- Exit Modal Overlay -->
  <div id="exit-modal" class="modal-overlay fixed inset-0 w-full h-full bg-black/75 backdrop-blur-md flex items-center justify-center z-[9999] opacity-0 invisible transition-all duration-200">
    <div class="glass-modal bg-[#121a2b]/95 border border-white/20 rounded-[28px] p-6 w-[88%] max-w-[340px] text-center shadow-2xl">
      <div class="exit-avatar-ring w-14 h-14 mx-auto mb-3 rounded-full flex items-center justify-center bg-rose-500/15 border-2 border-rose-500">
        <div class="exit-icon text-2xl">🚪</div>
      </div>
      <h3 class="exit-title text-white text-[1.15rem] font-extrabold mb-1.5" id="exit-modal-title">Player Left</h3>
      <p class="exit-desc text-slate-400 text-[0.85rem] leading-relaxed mb-4" id="exit-modal-desc">Player RED has disconnected from the game.</p>
      <button class="modal-primary-btn w-full py-3 rounded-2xl border-none bg-gradient-to-br from-sky-600 to-sky-700 text-white text-[0.9rem] font-extrabold cursor-pointer" onclick="closeExitModal()">Got It</button>
    </div>
  </div>

  <script src="ludo-script.js"></script>
</body>
</html>
