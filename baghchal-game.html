<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BaghChal Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      :root {
            --bg-dark: #07070c;
            --bg-glow: radial-gradient(circle at 50% 50%, #121225 0%, #07070c 100%);
            --panel-bg: rgba(20, 20, 35, 0.65);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-gold: #ffcc00;
            --tiger-neon: #ff2a5f;
            --tiger-glow: rgba(255, 42, 95, 0.25);
            --goat-neon: #00b0ff;
            --goat-glow: rgba(0, 176, 255, 0.25);
            --board-wood: #221610;
            --board-lines: #4a3525;
            --text-main: #f0f0f8;
            --text-muted: #7e7e9a;
            --glass-sheet: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, Helvetica, sans-serif;
            background: var(--bg-dark);
            background-image: var(--bg-glow);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 16px;
        }

        /* Ambient Animated Tech Background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        /* AAA Game App Wrapper Canvas Container */
        .app-window {
            width: 100%;
            max-width: 430px;
            background: var(--panel-bg);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            border: 1px solid var(--panel-border);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .app-header {
            text-align: center;
            margin-bottom: 4px;
        }

        .app-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 40%, #a5a5c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        .app-header p {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* Component Cards */
        .game-card {
            background: rgba(10, 10, 20, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 18px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Inputs */
        .app-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(5, 5, 10, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
            font-weight: 600;
            transition: all 0.25s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        .app-input:focus {
            border-color: rgba(255,255,255,0.2);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 0 12px rgba(255,255,255,0.05);
        }

        /* 3D App Tactile Buttons */
        .app-btn {
            position: relative;
            width: 100%;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            background: linear-gradient(180deg, #2c2c3d 0%, #1e1e2b 100%);
            border-bottom: 4px solid #13131c;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
        }

        .app-btn:hover {
            filter: brightness(1.1);
        }

        .app-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
        }

        .btn-primary {
            background: linear-gradient(180deg, #3d3d5c 0%, #29293d 100%);
            border-bottom: 4px solid #1a1a26;
        }

        .btn-accent-goat {
            background: linear-gradient(180deg, #0091ea 0%, #0071bc 100%);
            border-bottom: 4px solid #005691;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .btn-accent-tiger {
            background: linear-gradient(180deg, #ff1744 0%, #d50000 100%);
            border-bottom: 4px solid #9b0000;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .btn-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Segmented Controller Settings Component */
        .segmented-control {
            display: flex;
            background: rgba(5, 5, 10, 0.6);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 4px;
        }

        .segment-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .segment-btn.active[data-diff="easy"] { background: #00e676; color: #003311; box-shadow: 0 2px 8px rgba(0,230,118,0.3); }
        .segment-btn.active[data-diff="medium"] { background: #ff9100; color: #331a00; box-shadow: 0 2px 8px rgba(255,145,0,0.3); }
        .segment-btn.active[data-diff="hard"] { background: #ff1744; color: #fff; box-shadow: 0 2px 8px rgba(255,23,68,0.3); }

        /* Match Network Code Panel Badge */
        .lobby-status-box {
            text-align: center;
            margin-top: 10px;
        }

        .numeric-code-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 230, 118, 0.06);
            border: 1px dashed #00e676;
            color: #00e676;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 1.5rem;
            font-family: 'SF Mono', SFMono-Regular, monospace;
            font-weight: 800;
            letter-spacing: 4px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .numeric-code-badge:hover {
            background: rgba(0, 230, 118, 0.1);
            transform: scale(1.02);
        }

        /* --- ARÈNE HUD AND RUNTIME PANEL --- */
        #game-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .dashboard-panel {
            background: rgba(10, 10, 18, 0.8);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        /* Neon status track accents under score bar */
        .dashboard-panel::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--goat-neon), var(--tiger-neon));
            opacity: 0.7;
        }

        #turn-indicator {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #score-board {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* High Tech Cyber-Grid Game Board Viewport Container */
        .board-viewport {
            width: 100%;
            aspect-ratio: 1;
            background-color: var(--board-wood);
            border: 8px solid #140d0a;
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6),
                        inset 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .board-canvas {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #board-svg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.85;
        }

        .board-interactive-surface {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
        }

        /* Precise Intersection Layer Nodes */
        .board-node {
            position: absolute;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 6;
            transition: background 0.2s;
        }

        /* Action Highlighting */
        .board-node.source-highlight { background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255,255,255,0.2); }
        .board-node.target-highlight { background: rgba(255, 255, 255, 0.2); border: 2px dashed rgba(255,255,255,0.5); }

        .board-node.valid-target::after {
            content: '';
            width: 16px;
            height: 16px;
            background-color: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 14px #00e676, 0 0 24px #00e676;
            animation: pulseEffect 1.2s infinite ease-in-out;
        }

        @keyframes pulseEffect {
            0% { transform: scale(0.75); opacity: 0.6; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.75); opacity: 0.6; }
        }

        /* Micro-polished Engine Game Pieces */
        .game-piece {
            position: absolute;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            transform: translate(-50%, -50%);
            transition: top 0.24s cubic-bezier(0.34, 1.56, 0.64, 1),
                left 0.24s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.1s;
            z-index: 10;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6), inset 0 -3px 0 rgba(0,0,0,0.3);
            cursor: pointer;
            pointer-events: none;
        }

        .game-piece.tiger {
            background: radial-gradient(circle at 35% 35%, #ff527b 0%, var(--tiger-neon) 70%, #900 100%);
            border: 2px solid #3a000c;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6), 0 0 14px var(--tiger-glow);
        }

        .game-piece.goat {
            background: radial-gradient(circle at 35% 35%, #40c4ff 0%, var(--goat-neon) 70%, #004b7c 100%);
            border: 2px solid #001a2e;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6), 0 0 14px var(--goat-glow);
        }
        
        .board-node.active-selected-node + .game-piece { 
            transform: translate(-50%, -50%) scale(1.22); 
            z-index: 20; 
            outline: 3px solid var(--accent-gold);
            outline-offset: 2px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.7); 
        }

        /* --- PREMIUM ONLINE CHAT BOX ENGINE --- */
        .online-chat-box {
            display: none;
            flex-direction: column;
            background: rgba(5, 5, 12, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 12px;
            gap: 10px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }

        .chat-log {
            height: 110px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        /* Custom Modern Scrollbar */
        .chat-log::-webkit-scrollbar { width: 4px; }
        .chat-log::-webkit-scrollbar-track { background: transparent; }
        .chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .chat-msg {
            font-size: 0.82rem;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-word;
            padding: 6px 12px;
            border-radius: 12px;
            max-width: 80%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .chat-msg.me {
            background: linear-gradient(135deg, #2a2a40 0%, #1e1e2d 100%);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .chat-msg.them {
            background: rgba(15, 15, 25, 0.9);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .chat-msg.system {
            background: transparent;
            color: var(--text-muted);
            font-style: italic;
            align-self: center;
            text-align: center;
            box-shadow: none;
            font-size: 0.75rem;
        }

        .chat-compose-row {
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            font-weight: 500;
        }
        
        .chat-input:focus {
            border-color: rgba(255,255,255,0.15);
        }

        .chat-send-btn {
            padding: 0 16px;
            background: #222235;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 0.82rem;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            border-bottom: 2px solid #141421;
        }

        .chat-send-btn:active {
            transform: translateY(1px);
            border-bottom-width: 0px;
        }

        /* Modals Overlays Screens layout templates */
        .modal-mask {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(3, 3, 6, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal-mask.active { display: flex; opacity: 1; }
        
        .modal-body {
            background: linear-gradient(135deg, #161626 0%, #0f0f1a 100%);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 32px 24px;
            border-radius: 24px;
            text-align: center;
            width: 88%;
            max-width: 350px;
            box-shadow: 0 24px 50px rgba(0,0,0,0.9);
        }
        .modal-headline { font-size: 1.8rem; font-weight: 900; margin-bottom: 6px; color: var(--accent-gold); letter-spacing: 0.5px; }
        .modal-subtext { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; font-weight: 500; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="app-window">
      <div id="menu-screen" style="display: flex; flex-direction: column; gap: 18px;">
        <div class="app-header">
          <h1>BAGHCHAL</h1>
          <p>Tactical Arena</p>
        </div>
        
        <div class="game-card">
          <div class="card-title">🤖 Single Player vs AI</div>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <div class="segmented-control">
              <button class="segment-btn active" data-diff="easy" onclick="setDifficulty('easy')">Easy</button>
              <button class="segment-btn" data-diff="medium" onclick="setDifficulty('medium')">Medium</button>
              <button class="segment-btn" data-diff="hard" onclick="setDifficulty('hard')">Hard</button>
            </div>
            <div class="btn-grid-2">
              <button class="app-btn btn-accent-goat" onclick="startLocalGame('vsAI', 'G')">🐐 Goats</button>
              <button class="app-btn btn-accent-tiger" onclick="startLocalGame('vsAI', 'T')">🐯 Tigers</button>
            </div>
          </div>
        </div>

        <div class="game-card">
          <div class="card-title">👥 Offline Local Mode</div>
          <button class="app-btn btn-primary" onclick="startLocalGame('local2P', null)">Pass &amp; Play Match</button>
        </div>

        <div class="game-card">
          <div class="card-title">🌐 P2P Online Arena</div>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <button id="btn-host" class="app-btn btn-primary" onclick="initOnlineRoom(true)">Host Private Match</button>
            <div style="display: flex; gap: 10px;">
              <input type="text" id="join-id-input" class="app-input" placeholder="5-Digit Code" maxlength="5" pattern="\d*" />
              <button id="btn-join" class="app-btn btn-primary" style="width: auto; padding: 0 24px;" onclick="initOnlineRoom(false)">Join</button>
            </div>
            <div id="network-status" class="lobby-status-box" style="color: var(--text-muted); font-size: 0.8rem; font-weight: 500;"></div>
          </div>
        </div>
      </div>

      <div id="game-screen">
        <div class="dashboard-panel">
          <div id="turn-indicator">Goat's Turn</div>
          <div id="score-board">Placing Phase</div>
        </div>

        <div class="board-viewport">
          <div class="board-canvas">
            <svg id="board-svg-grid" viewBox="0 0 400 400" preserveAspectRatio="none">
              <line x1="0" y1="0" x2="400" y2="0" stroke="var(--board-lines)" stroke-width="5"></line>
              <line x1="0" y1="100" x2="400" y2="100" stroke="var(--board-lines)" stroke-width="3"></line>
              <line x1="0" y1="200" x2="400" y2="200" stroke="var(--board-lines)" stroke-width="3"></line>
              <line x1="0" y1="300" x2="400" y2="300" stroke="var(--board-lines)" stroke-width="3"></line>
              <line x1="0" y1="400" x2="400" y2="400" stroke="var(--board-lines)" stroke-width="5"></line>
              <line x1="0" y1="0" x2="0" y2="400" stroke="var(--board-lines)" stroke-width="5"></line>
              <line x1="100" y1="0" x2="100" y2="400" stroke="var(--board-lines)" stroke-width="3"></line>
              <line x1="200" y1="0" x2="200" y2="400" stroke="var(--board-lines)" stroke-width="3"></line>
              <line x1="300" y1="0" x2="300" y2="400" stroke="var(--board-lines)" stroke-width="3"></line>
              <line x1="400" y1="0" x2="400" y2="400" stroke="var(--board-lines)" stroke-width="5"></line>
              <line x1="0" y1="0" x2="400" y2="400" stroke="var(--board-lines)" stroke-width="3"></line>
              <line x1="400" y1="0" x2="0" y2="400" stroke="var(--board-lines)" stroke-width="3"></line>
              <line x1="200" y1="0" x2="0" y2="200" stroke="var(--board-lines)" stroke-width="2"></line>
              <line x1="200" y1="0" x2="400" y2="200" stroke="var(--board-lines)" stroke-width="2"></line>
              <line x1="0" y1="200" x2="200" y2="400" stroke="var(--board-lines)" stroke-width="2"></line>
              <line x1="400" y1="200" x2="200" y2="400" stroke="var(--board-lines)" stroke-width="2"></line>
            </svg>
            <div class="board-interactive-surface" id="interactive-layer"></div>
          </div>
        </div>
        
        <div id="chat-container" class="online-chat-box">
          <div id="chat-messages-log" class="chat-log"></div>
          <div class="chat-compose-row">
            <input type="text" id="chat-input-field" class="chat-input" placeholder="Send a message..." maxlength="120" />
            <button class="chat-send-btn" onclick="sendChatMessage()">Send</button>
          </div>
        </div>

        <div class="btn-grid-2">
          <button id="undo-btn" class="app-btn btn-primary" onclick="handleUndoClick()" disabled>Undo Move ↩</button>
          <button class="app-btn btn-primary" style="color: #ff5252;" onclick="returnToMenu()">Leave Lobby 🚪</button>
        </div>
      </div>
    </div>

    <div id="game-over-modal" class="modal-mask">
      <div class="modal-body">
        <div id="modal-title" class="modal-headline">Victory!</div>
        <div id="modal-desc" class="modal-subtext">Description of match results.</div>
        <button class="app-btn btn-accent-goat" style="background: linear-gradient(180deg, #00e676 0%, #00b359 100%); border-bottom-color: #00803f;" onclick="closeModalAndExit()">Confirm 🔄</button>
      </div>
    </div>

    <script>
        const BOARD_SIZE = 5;
        let board = []; 
        let turn = 'G'; 
        let gameMode = 'vsAI'; 
        let playerSide = 'G';  
        let currentDifficulty = 'easy';
        let goatsToPlace = 20;
        let goatsEaten = 0;
        let selectedPiece = null; 
        let validMoves = [];
        let isGameOver = false;
        let isMuted = false;

        let historyStack = [];
        let lastMoveVisual = null; 

        let peer = null;
        let conn = null;
        let activeRoomId = "";

        const interactiveLayer = document.getElementById('interactive-layer');
        const turnIndicator = document.getElementById('turn-indicator');
        const scoreBoard = document.getElementById('score-board');
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const undoBtn = document.getElementById('undo-btn');
        const netStatus = document.getElementById('network-status');
        
        const gameOverModal = document.getElementById('game-over-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');

        const chatContainer = document.getElementById('chat-container');
        const chatMessagesLog = document.getElementById('chat-messages-log');
        const chatInputField = document.getElementById('chat-input-field');

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'place') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'capture') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        function setDifficulty(level) {
            currentDifficulty = level;
            document.querySelectorAll('.segment-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('data-diff') === level) btn.classList.add('active');
            });
        }

        function loadMuteSettings() {
            const saved = localStorage.getItem('baghChalMute');
            isMuted = saved === 'true';
        }

        function accurateHasDiagonal(r, c) {
            return (r + c) % 2 === 0;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedDiff = localStorage.getItem('bc_diff') || 'easy';
            setDifficulty(savedDiff);
            loadMuteSettings();

            chatInputField.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });
        });

        function startLocalGame(mode, side) {
            gameMode = mode;
            playerSide = side; 
            menuScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            chatContainer.style.display = 'none';

            let title = "BaghChal: Local 2P";
            if (gameMode === 'vsAI') {
                localStorage.setItem('bc_diff', currentDifficulty);
            }
            initGame();
        }

        function initOnlineRoom(isHost) {
            gameMode = 'onlineP2P';
            netStatus.style.color = '#ffcc00';
            activeRoomId = "";
            
            if (peer) { peer.destroy(); }

            if (isHost) {
                playerSide = 'G'; 
                netStatus.innerText = "Securing private match-room key...";
                const numericalId = String(Math.floor(10000 + Math.random() * 90000));
                peer = new Peer(numericalId);

                peer.on('open', (id) => {
                    activeRoomId = id;
                    netStatus.style.color = '#fff';
                    netStatus.innerHTML = `
                        <div style="margin-bottom: 6px; color: var(--text-muted); font-size:0.8rem; font-weight:600;">Lobby Created! Tap key to duplicate:</div>
                        <div class="numeric-code-badge" onclick="copyRoomIdToClipboard()">${id} 📋</div>
                        <div id="copy-confirm" style="font-size:0.75rem; color:#00e676; margin-top:6px; opacity:0; transition:opacity 0.2s; font-weight:700;">Code Copied!</div>
                    `;
                });

                peer.on('connection', (connection) => {
                    conn = connection;
                    setupNetworkEvents();
                    launchOnlineGame();
                });
                
                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        peer = new Peer();
                        peer.on('open', (fallbackId) => {
                            activeRoomId = fallbackId.substring(0, 5);
                            netStatus.innerHTML = `<div class="numeric-code-badge" onclick="copyRoomIdToClipboard()">${activeRoomId} 📋</div>`;
                        });
                    } else {
                        netStatus.innerText = "Error: " + err.type;
                        netStatus.style.color = '#ff1744';
                    }
                });
            } else {
                playerSide = 'T'; 
                const targetId = document.getElementById('join-id-input').value.trim();
                if (!targetId || targetId.length < 4) {
                    netStatus.innerText = "Please fill out a valid identity key.";
                    netStatus.style.color = '#ff1744';
                    return;
                }
                netStatus.innerText = `Connecting onto mainframe node ${targetId}...`;
                
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect(targetId);
                    setupNetworkEvents();
                });
            }
        }

        function copyRoomIdToClipboard() {
            if (!activeRoomId) return;
            navigator.clipboard.writeText(activeRoomId).then(() => {
                const confirmation = document.getElementById('copy-confirm');
                if (confirmation) {
                    confirmation.style.opacity = '1';
                    setTimeout(() => { confirmation.style.opacity = '0'; }, 1800);
                }
            });
        }

        function setupNetworkEvents() {
            conn.on('open', () => {
                launchOnlineGame();
            });

            conn.on('data', (data) => {
                if (data.type === 'SYNC_MOVE') {
                    board = data.board;
                    turn = data.turn;
                    goatsToPlace = data.goatsToPlace;
                    goatsEaten = data.goatsEaten;
                    lastMoveVisual = data.lastMoveVisual;
                    
                    playSound(data.soundEvent);
                    renderUnifiedBoard();
                    updateStatusAndControls();
                } else if (data.type === 'CHAT_MSG') {
                    appendChatMessage(data.sender, data.text, 'them');
                }
            });

            conn.on('close', () => {
                alert("Match partner aborted session connection.");
                returnToMenu();
            });
        }

        function launchOnlineGame() {
            menuScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            chatContainer.style.display = 'flex';
            chatMessagesLog.innerHTML = '';
            appendChatMessage('System', 'Connected directly onto P2P secure channel.', 'system');
            initGame();
        }

        function sendChatMessage() {
            const rawMsg = chatInputField.value.trim();
            if (!rawMsg || !conn) return;

            const senderName = playerSide === 'G' ? 'Goat' : 'Tiger';
            conn.send({
                type: 'CHAT_MSG',
                sender: senderName,
                text: rawMsg
            });

            appendChatMessage(senderName, rawMsg, 'me');
            chatInputField.value = '';
        }

        function appendChatMessage(sender, text, tone) {
            const row = document.createElement('div');
            row.classList.add('chat-msg', tone);
            if (tone === 'system') {
                row.innerText = text;
            } else {
                row.innerText = `${sender}: ${text}`;
            }
            chatMessagesLog.appendChild(row);
            chatMessagesLog.scrollTop = chatMessagesLog.scrollHeight;
        }

        function returnToMenu() {
            gameScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
            gameOverModal.classList.remove('active');
            if (peer) {
                peer.destroy();
                peer = null;
                conn = null;
            }
            netStatus.innerHTML = "";
            activeRoomId = "";
        }

        function showGameOverModal(description) {
            modalTitle.innerText = "Match Concluded";
            modalDesc.innerText = description;
            gameOverModal.classList.add('active');
        }

        function closeModalAndExit() {
            gameOverModal.classList.remove('active');
            returnToMenu();
        }

        function initGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            turn = 'G'; 
            goatsToPlace = 20;
            goatsEaten = 0;
            selectedPiece = null;
            validMoves = [];
            isGameOver = false;
            historyStack = [];
            lastMoveVisual = null;

            board[0][0] = 'T'; board[0][4] = 'T';
            board[4][0] = 'T'; board[4][4] = 'T';

            renderUnifiedBoard();
            updateStatusAndControls();

            if (gameMode === 'vsAI' && playerSide === 'T') {
                setTimeout(makeComputerMove, 500);
            }
        }

        function renderUnifiedBoard() {
            interactiveLayer.innerHTML = '';
            
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const topPct = `${r * 25}%`;
                    const leftPct = `${c * 25}%`;

                    const hotspot = document.createElement('div');
                    hotspot.classList.add('board-node');
                    hotspot.style.top = topPct;
                    hotspot.style.left = leftPct;
                    
                    if (lastMoveVisual) {
                        if (lastMoveVisual.fromR === r && lastMoveVisual.fromC === c) hotspot.classList.add('source-highlight');
                        if (lastMoveVisual.toR === r && lastMoveVisual.toC === c) hotspot.classList.add('target-highlight');
                    }

                    if (isMyTurn() && validMoves.some(m => m.r === r && m.c === c)) {
                        hotspot.classList.add('valid-target');
                    }

                    if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                        hotspot.classList.add('active-selected-node');
                    }

                    hotspot.addEventListener('click', () => handleCellClick(r, c));
                    interactiveLayer.appendChild(hotspot);

                    if (board[r][c]) {
                        const p = document.createElement('div');
                        p.classList.add('game-piece', board[r][c] === 'T' ? 'tiger' : 'goat');
                        p.innerText = board[r][c] === 'T' ? '🐯' : '🐐';
                        p.style.top = topPct;
                        p.style.left = leftPct;

                        interactiveLayer.appendChild(p);
                    }
                }
            }
        }

        function isMyTurn() {
            if (isGameOver) return false;
            if (gameMode === 'local2P') return true; 
            return (turn === playerSide);
        }

        function saveHistoryState() {
            const boardClone = board.map(row => [...row]);
            historyStack.push({
                board: boardClone,
                turn: turn,
                goatsToPlace: goatsToPlace,
                goatsEaten: goatsEaten,
                lastMoveVisual: lastMoveVisual ? {...lastMoveVisual} : null
            });
        }

        function handleUndoClick() {
            if (!isMyTurn() || gameMode === 'onlineP2P') return; 
            if (historyStack.length < (gameMode === 'vsAI' ? 2 : 1)) return;
            
            if (gameMode === 'vsAI') {
                historyStack.pop(); 
                const preservedState = historyStack.pop();
                restoreState(preservedState);
            } else {
                const preservedState = historyStack.pop();
                restoreState(preservedState);
            }
        }

        function restoreState(state) {
            board = state.board;
            turn = state.turn;
            goatsToPlace = state.goatsToPlace;
            goatsEaten = state.goatsEaten;
            lastMoveVisual = state.lastMoveVisual;
            selectedPiece = null;
            validMoves = [];
            
            playSound('select');
            renderUnifiedBoard();
            updateStatusAndControls();
        }

        function updateStatusAndControls() {
            let phaseText = goatsToPlace > 0 ? " (Placing)" : " (Moving)";
            if (isGameOver) {
                undoBtn.disabled = true;
                return;
            }

            if (isMyTurn()) {
                turnIndicator.innerText = (gameMode === 'local2P') ? `${turn === 'G' ? "Goat's" : "Tiger's"} Turn` : "Your Action Phase ✨";
                turnIndicator.style.color = turn === 'G' ? 'var(--goat-neon)' : 'var(--tiger-neon)';
                if(turn === 'G') {
                    turnIndicator.style.textShadow = "0 0 10px var(--goat-glow)";
                } else {
                    turnIndicator.style.textShadow = "0 0 10px var(--tiger-glow)";
                }
            } else {
                turnIndicator.innerText = (gameMode === 'vsAI') ? "AI Processing..." : "Opponent Turn...";
                turnIndicator.style.color = 'var(--text-muted)';
                turnIndicator.style.textShadow = 'none';
            }

            scoreBoard.innerText = `Deployable Goats: ${goatsToPlace}  |  Captured: ${goatsEaten}/5 ${turn === 'G' ? phaseText : ''}`;
            
            if (gameMode === 'onlineP2P') {
                undoBtn.style.display = 'none'; 
            } else {
                undoBtn.style.display = 'block';
                undoBtn.disabled = (gameMode === 'vsAI') ? historyStack.length < 2 : historyStack.length < 1;
            }

            checkWinConditions();
        }

        function handleCellClick(r, c) {
            if (!isMyTurn() || isGameOver) return;
            const clickedPiece = board[r][c];

            if (turn === 'G' && goatsToPlace > 0) {
                if (!clickedPiece) {
                    if (gameMode !== 'onlineP2P') saveHistoryState();
                    board[r][c] = 'G';
                    goatsToPlace--;
                    lastMoveVisual = { fromR: null, fromC: null, toR: r, toC: c };
                    executeTurnTransition('place');
                }
                return;
            }

            if (clickedPiece === turn) {
                selectedPiece = { r, c };
                validMoves = getLegalMoves(r, c);
                playSound('select');
                renderUnifiedBoard();
                return;
            }

            const move = validMoves.find(m => m.r === r && m.c === c);
            if (move) {
                if (gameMode !== 'onlineP2P') saveHistoryState();
                lastMoveVisual = { fromR: selectedPiece.r, fromC: selectedPiece.c, toR: r, toC: c };
                
                board[r][c] = turn;
                board[selectedPiece.r][selectedPiece.c] = null;
                let soundUsed = 'place';

                if (turn === 'T' && move.isJump) {
                    board[move.jumpedR][move.jumpedC] = null;
                    goatsEaten++;
                    soundUsed = 'capture';
                }

                executeTurnTransition(soundUsed);
            } else {
                selectedPiece = null;
                validMoves = [];
                renderUnifiedBoard();
            }
        }

        function executeTurnTransition(soundEvent) {
            playSound(soundEvent);
            selectedPiece = null;
            validMoves = [];
            turn = turn === 'G' ? 'T' : 'G';

            if (gameMode === 'onlineP2P' && conn) {
                conn.send({
                    type: 'SYNC_MOVE',
                    board: board,
                    turn: turn,
                    goatsToPlace: goatsToPlace,
                    goatsEaten: goatsEaten,
                    lastMoveVisual: lastMoveVisual,
                    soundEvent: soundEvent
                });
            }

            renderUnifiedBoard();
            updateStatusAndControls();

            if (!isGameOver && gameMode === 'vsAI' && turn !== playerSide) {
                setTimeout(makeComputerMove, 600);
            }
        }

        function getLegalMoves(r, c, customBoard = null) {
            const currentBoard = customBoard || board;
            const moves = [];
            const piece = currentBoard[r][c];
            if (!piece) return [];

            const directions = [
                {dr: -1, dc: 0, diag: false}, {dr: 1, dc: 0, diag: false},
                {dr: 0, dc: -1, diag: false}, {dr: 0, dc: 1, diag: false},
                {dr: -1, dc: -1, diag: true}, {dr: -1, dc: 1, diag: true},
                {dr: 1, dc: -1, diag: true},  {dr: 1, dc: 1, diag: true}
            ];

            directions.forEach(({dr, dc, diag}) => {
                if (diag && !accurateHasDiagonal(r, c)) return;

                const nr = r + dr;
                const nc = c + dc;

                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                    if (!currentBoard[nr][nc]) {
                        moves.push({ r: nr, c: nc, isJump: false });
                    } 
                    else if (piece === 'T' && currentBoard[nr][nc] === 'G') {
                        const jr = nr + dr;
                        const jc = nc + dc;
                        if (jr >= 0 && jr < BOARD_SIZE && jc >= 0 && jc < BOARD_SIZE && !currentBoard[jr][jc]) {
                            moves.push({ r: jr, c: jc, isJump: true, jumpedR: nr, jumpedC: nc });
                        }
                    }
                }
            });
            return moves;
        }

        function makeComputerMove() {
            if (isGameOver) return;
            let chosenMove = null;

            if (turn === 'G') {
                if (goatsToPlace > 0) {
                    let emptyCells = [];
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (!board[r][c]) emptyCells.push({r, c});
                        }
                    }

                    if (currentDifficulty === 'easy') {
                        emptyCells.sort((a,b) => (Math.abs(2-a.r)+Math.abs(2-a.c)) - (Math.abs(2-b.r)+Math.abs(2-b.c)));
                        chosenMove = { type: 'place', to: emptyCells[Math.floor(Math.random() * Math.min(5, emptyCells.length))] };
                    } else {
                        let bestScore = -Infinity;
                        let pool = [];
                        emptyCells.forEach(cell => {
                            let score = 0;
                            score += (4 - (Math.abs(2-cell.r) + Math.abs(2-cell.c))) * 2;
                            board[cell.r][cell.c] = 'G';
                            let tigerJumps = countTotalTigerJumps();
                            board[cell.r][cell.c] = null;
                            score -= tigerJumps * 45;
                            
                            if(currentDifficulty === 'hard') {
                                score += getAdjacencyCount(cell.r, cell.c, 'G') * 5;
                            }
                            if (score > bestScore) { bestScore = score; pool = [cell]; }
                            else if (score === bestScore) { pool.push(cell); }
                        });
                        chosenMove = { type: 'place', to: pool[Math.floor(Math.random() * pool.length)] };
                    }
                } else {
                    let allGoatMoves = [];
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (board[r][c] === 'G') {
                                getLegalMoves(r, c).forEach(m => allGoatMoves.push({from: {r, c}, to: m}));
                            }
                        }
                    }

                    if (currentDifficulty === 'easy' || allGoatMoves.length === 0) {
                        chosenMove = allGoatMoves[Math.floor(Math.random() * allGoatMoves.length)];
                    } else {
                        let bestScore = -Infinity;
                        let pool = [];
                        allGoatMoves.forEach(move => {
                            board[move.from.r][move.from.c] = null;
                            board[move.to.r][move.to.c] = 'G';
                            let score = -countTotalTigerJumps() * 50;
                            let tigerMovesLeft = countTotalTigerMoves();
                            if (tigerMovesLeft === 0) score += 10000;
                            score += (4 - tigerMovesLeft) * 15;
                            board[move.to.r][move.to.c] = null;
                            board[move.from.r][move.from.c] = 'G';

                            if (score > bestScore) { bestScore = score; pool = [move]; }
                            else if (score === bestScore) { pool.push(move); }
                        });
                        chosenMove = pool[Math.floor(Math.random() * pool.length)];
                    }
                }

                if (chosenMove) {
                    saveHistoryState();
                    if (chosenMove.type === 'place') {
                        board[chosenMove.to.r][chosenMove.to.c] = 'G';
                        goatsToPlace--;
                        lastMoveVisual = { fromR: null, fromC: null, toR: chosenMove.to.r, toC: chosenMove.to.c };
                        playSound('place');
                    } else {
                        lastMoveVisual = { fromR: chosenMove.from.r, fromC: chosenMove.from.c, toR: chosenMove.to.r, toC: chosenMove.to.c };
                        board[chosenMove.to.r][chosenMove.to.c] = 'G';
                        board[chosenMove.from.r][chosenMove.from.c] = null;
                        playSound('place');
                    }
                }
            } 
            else if (turn === 'T') {
                let safeSlides = [];
                let forcedJumps = [];

                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[r][c] === 'T') {
                            getLegalMoves(r, c).forEach(m => {
                                if (!m.isJump) safeSlides.push({from: {r, c}, to: m});
                                else forcedJumps.push({from: {r, c}, to: m});
                            });
                        }
                    }
                }

                saveHistoryState();
                let usedSound = 'place';

                if (currentDifficulty === 'easy') {
                    if (safeSlides.length > 0) chosenMove = safeSlides[Math.floor(Math.random() * safeSlides.length)];
                    else if (forcedJumps.length > 0) chosenMove = forcedJumps[Math.floor(Math.random() * forcedJumps.length)];
                } 
                else if (currentDifficulty === 'medium') {
                    if (forcedJumps.length > 0) chosenMove = forcedJumps[Math.floor(Math.random() * forcedJumps.length)];
                    else chosenMove = safeSlides[Math.floor(Math.random() * safeSlides.length)];
                } 
                else if (currentDifficulty === 'hard') {
                    if (forcedJumps.length > 0) {
                        let bestJump = null;
                        let minEscapeScore = Infinity;
                        forcedJumps.forEach(jump => {
                            let origTarget = board[jump.to.r][jump.to.c];
                            let origMid = board[jump.to.jumpedR][jump.to.jumpedC];
                            board[jump.from.r][jump.from.c] = null;
                            board[jump.to.jumpedR][jump.to.jumpedC] = null;
                            board[jump.to.r][jump.to.c] = 'T';
                            let escapes = countTotalTigerMoves();
                            board[jump.to.r][jump.to.c] = origTarget;
                            board[jump.to.jumpedR][jump.to.jumpedC] = origMid;
                            board[jump.from.r][jump.from.c] = 'T';
                            if (escapes < minEscapeScore) { minEscapeScore = escapes; bestJump = jump; }
                        });
                        chosenMove = bestJump || forcedJumps[0];
                    } else {
                        let bestSlide = null;
                        let maxStrategicScore = -Infinity;
                        safeSlides.forEach(slide => {
                            board[slide.from.r][slide.from.c] = null;
                            board[slide.to.r][slide.to.c] = 'T';
                            let localMoves = getLegalMoves(slide.to.r, slide.to.c).length;
                            let centerGravity = (4 - (Math.abs(2 - slide.to.r) + Math.abs(2 - slide.to.c)));
                            let score = (localMoves * 4) + centerGravity;
                            board[slide.to.r][slide.to.c] = null;
                            board[slide.from.r][slide.from.c] = 'T';
                            if (score > maxStrategicScore) { maxStrategicScore = score; bestSlide = slide; }
                        });
                        chosenMove = bestSlide || safeSlides[0];
                    }
                }

                if (chosenMove) {
                    lastMoveVisual = { fromR: chosenMove.from.r, fromC: chosenMove.from.c, toR: chosenMove.to.r, toC: chosenMove.to.c };
                    board[chosenMove.to.r][chosenMove.to.c] = 'T';
                    board[chosenMove.from.r][chosenMove.from.c] = null;
                    if (chosenMove.to.isJump) {
                        board[chosenMove.to.jumpedR][chosenMove.to.jumpedC] = null;
                        goatsEaten++;
                        usedSound = 'capture';
                    }
                    playSound(usedSound);
                }
            }

            turn = turn === 'G' ? 'T' : 'G';
            renderUnifiedBoard();
            updateStatusAndControls();
        }

        function countTotalTigerJumps() {
            let count = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === 'T') {
                        getLegalMoves(r, c).forEach(m => { if(m.isJump) count++; });
                    }
                }
            }
            return count;
        }

        function countTotalTigerMoves() {
            let total = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === 'T') total += getLegalMoves(r, c).length;
                }
            }
            return total;
        }

        function getAdjacencyCount(r, c, type) {
            let adjacent = 0;
            const steps = [-1, 0, 1];
            steps.forEach(dr => {
                steps.forEach(dc => {
                    if (dr === 0 && dc === 0) return;
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        if(board[nr][nc] === type) adjacent++;
                    }
                });
            });
            return adjacent;
        }

        function checkWinConditions() {
            if (goatsEaten >= 5) {
                isGameOver = true;
                setTimeout(() => { showGameOverModal("Tigers dominate the board! 5 goats captured."); }, 300);
                return;
            }

            if (countTotalTigerMoves() === 0) {
                isGameOver = true;
                setTimeout(() => { showGameOverModal("Goats form an impenetrable wall! Tigers are trapped."); }, 300);
            }
        }
    </script>
