<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bird Sort: Migration Journey</title>
    <style>
        :root {
            --sky-top: #a2d2ff;
            --sky-bottom: #e0f2f1;
            --trunk-color: #432818;
        }

        body {
            margin: 0; background: #1a1a1a;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; touch-action: manipulation;
            box-sizing: border-box;
        }

        #game-viewport {
            padding-top: 90px; 
            padding-bottom: 120px; 
            width: 100%; max-width: 480px; flex: 1;
            position: relative; overflow-y: auto; scrollbar-width: none;
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
            transition: background 2s ease, filter 2s ease;
        }

        /* Weather States */
        .weather-morning { --sky-top: #a2d2ff; --sky-bottom: #e0f2f1; filter: saturate(1.1); }
        .weather-evening { --sky-top: #ff9a9e; --sky-bottom: #fad0c4; filter: sepia(0.2); }
        .weather-night   { --sky-top: #0f2027; --sky-bottom: #2c5364; filter: brightness(0.8) contrast(1.2); }
        .weather-rainy   { --sky-top: #485563; --sky-bottom: #29323c; filter: grayscale(0.3); }

        /* Animated Rain Overlay */
        /* Enhanced Rain Animation */
        .rain-overlay {
            display: none; 
            position: absolute; 
            inset: 0; 
            pointer-events: none;
            z-index: 5;
            /* Layer 1: Falling Streaks */
            background: repeating-linear-gradient(transparent, transparent 80%, rgba(255,255,255,0.1) 85%, transparent 90%);
            background-size: 2px 150px;
            animation: rain-fall 0.2s linear infinite;
        }

        /* Layer 2: Random Water Drops/Splashes */
        .rain-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 10% 10%, white 1px, transparent 1px),
                              radial-gradient(circle at 50% 40%, white 1px, transparent 1px),
                              radial-gradient(circle at 80% 20%, white 1px, transparent 1px),
                              radial-gradient(circle at 30% 70%, white 1px, transparent 1px);
            background-size: 100px 100px;
            opacity: 0.3;
            animation: rain-splash 0.5s steps(4) infinite;
        }

        @keyframes rain-fall { 
            from { background-position: 0 0; } 
            to { background-position: 0 150px; } 
        }

        @keyframes rain-splash {
            from { background-position: 0 0; }
            to { background-position: 50px 100px; }
        }

        .weather-rainy .rain-overlay { display: block; }

        /* --- HEADER --- */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            padding: 5px 0;
            display: flex;
            align-items: center;
            flex-direction: row;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: white;
        }
        .stats-bar { 
            display: inline-flex; gap: 15px; background: rgba(255, 255, 255, 0.9); 
            padding: 8px 20px; border-radius: 50px; margin-top: 10px; font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); color: #1b4332; font-size: 14px;
        }

        /* --- TREE STRUCTURE --- */
        #game-wrapper { width: 100%; position: relative; padding-top: 40px; padding-bottom: 150px; }
        .tree-trunk {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 34px; background: linear-gradient(to right, #3d2616, #795548, #3d2616);
            box-shadow: 10px 0 20px rgba(0,0,0,0.2); border-radius: 4px; z-index: 1;
        }

        .branch-container { position: absolute; width: 160px; height: 60px; cursor: pointer; z-index: 2; transition: transform 0.2s; }
        .container-left { right: 50%; }
        .container-right { left: 50%; }

        .branch-wood {
            position: absolute; bottom: 0; width: 100%; height: 18px;
            background: linear-gradient(to bottom, #5d4037, #432818);
            transition: 0.3s;
        }
        .container-left .branch-wood { clip-path: polygon(0% 40%, 100% 0%, 100% 100%, 0% 60%); border-radius: 20px 0 0 20px; }
        .container-right .branch-wood { clip-path: polygon(0% 0%, 100% 40%, 100% 60%, 0% 100%); border-radius: 0 20px 20px 0; }
        .branch-container.selected .branch-wood { filter: brightness(1.5); outline: 2px solid gold; border-radius: 10px; }

        /* --- RESTORED BIRD DESIGN --- */
        .bird-stack { position: absolute; bottom: 16px; width: 100%; display: flex; pointer-events: none; z-index: 10; }
        .container-left .bird-stack { flex-direction: row-reverse; padding-right: 5px; }
        .container-right .bird-stack { flex-direction: row; padding-left: 5px; }

        .bird {
            width: 36px; height: 32px; border-radius: 18px 18px 10px 10px;
            position: relative; margin: 0 2px; transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.2));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        /* Crest */
        .bird::before {
            content: ''; position: absolute; top: -5px; width: 8px; height: 8px;
            background: inherit; clip-path: polygon(100% 100%, 0% 100%, 100% 0%);
        }
        .bird-eye { position: absolute; top: 8px; width: 4px; height: 4px; background: #000; border-radius: 50%; border: 1px solid #fff; }
        .bird-beak { position: absolute; top: 12px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
        .bird-wing { position: absolute; top: 14px; width: 16px; height: 10px; background: rgba(0,0,0,0.1); border-radius: 50%; }

        /* Right-facing specific design */
        .container-right .bird::before { right: 8px; }
        .container-right .bird-eye { right: 6px; }
        .container-right .bird-beak { right: -9px; border-left: 11px solid #ffa000; }
        .container-right .bird-wing { right: 5px; transform: rotate(-10deg); }

        /* Left-facing specific design */
        .container-left .bird::before { left: 8px; transform: scaleX(-1); }
        .container-left .bird-eye { left: 6px; }
        .container-left .bird-beak { left: -9px; border-right: 11px solid #ffa000; }
        .container-left .bird-wing { left: 5px; transform: rotate(10deg); }

        .bird.selected-bird { transform: translateY(-20px); animation: birdBounce 0.8s infinite ease-in-out;}
        @keyframes birdBounce {
            0%, 100% { transform: translateY(-20px); }
            50% { transform: translateY(-30px); }
        }



        .flying-bird {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); /* Slower, smooth flight */
            width: 36px;
            height: 32px;
        }

        /* Wing flap animation during flight */
        .flying-bird .bird-wing {
            animation: flap 0.15s infinite alternate;
        }

        @keyframes flap {
            from { transform: rotate(10deg) translateY(0); }
            to { transform: rotate(-30deg) translateY(-2px); }
        }

        /* Background transition for levels */
        #game-viewport.level-evening { --sky-top: #ff9a9e; --sky-bottom: #fecfef; }
        #game-viewport.level-night { --sky-top: #2c3e50; --sky-bottom: #000000; }

        /* --- MAP OVERLAY --- */
        #map-overlay {
            position: fixed; inset: 0; background: linear-gradient(to bottom, #74ebd5, #acb6e5);
            z-index: 2000; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 80px;
        }
        .map-header { background: rgba(255,255,255,0.3); backdrop-filter: blur(10px); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .map-path { position: relative; width: 100%; max-width: 400px; margin: 40px auto; display: flex; flex-direction: column-reverse; gap: 50px; }
        
        .level-node {
            width: 75px; height: 75px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 900; font-size: 22px; color: #2d6a4f; position: relative; border: 4px solid white; box-shadow: 0 6px 0 #bbb; cursor: pointer; transition: 0.2s;
        }
        .level-node.locked { background: #eee; color: #999; box-shadow: 0 6px 0 #ccc; cursor: not-allowed; }
        .level-node.unlocked { background: radial-gradient(circle, #fff, #ffca28); box-shadow: 0 6px 0 #f57f17; }
        .level-node.current { background: radial-gradient(circle, #fff, #4caf50); box-shadow: 0 6px 0 #2e7d32; animation: pulse 1.5s infinite; }
        
        .node-stars { position: absolute; bottom: -24px; display: flex; gap: 2px; }
        .mini-star { font-size: 16px; color: #ddd; text-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
        .mini-star.earned { color: #ffca28; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Zig-Zag Position for Roadmap */
        .level-node:nth-child(4n+1) { align-self: center; }
        .level-node:nth-child(4n+2) { align-self: flex-start; margin-left: 50px; }
        .level-node:nth-child(4n+3) { align-self: center; }
        .level-node:nth-child(4n+4) { align-self: flex-end; margin-right: 50px; }

        /* --- UI PANEL --- */
        .ui-panel {
            position: fixed;
            bottom: 20px; /* Floating style */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: transparent; /* Darker for better contrast */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px;
            border-radius: 40px; /* Pill shape */
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        /* Button Refinement */
        .game-btn {
            width: 50px;
            height: 50px;
            margin: 0; /* Reset margins */
            border-radius: 50%;
            font-size: 20px;
            background: rgba(255,255,255,0.1);
            box-shadow: none; /* Clean flat look */
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }

        .game-btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.3);
        }
        .btn-map { background: linear-gradient(135deg, #ff9a9e, #fad0c4); color: #333; }
        .btn-undo { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .btn-reset { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .btn-mute { background: linear-gradient(135deg, #84fab0, #8fd3f4); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .box { background: #fff; padding: 25px; border-radius: 20px; text-align: center; width: 260px; }
        .star { font-size: 35px; color: #ccc; }
        .star.filled { color: #ffca28; }
    </style>
</head>
<body>

    <div class="header">
        <div></div>
        <h1>LEVEL <b id="lvl-num">1</b></h1>
        <div class="stats-bar">
            <span>Moves: <b id="move-text">0</b></span>
            <span>Best: <b id="best-text">?</b></span>
        </div>
    </div>

<div id="game-viewport">
    <div id="game-wrapper">
        <div id="trunk" class="tree-trunk"></div>
        <div id="branches-layer"></div>
    </div>
</div>
    <div id="win-popup" class="overlay">
        <div class="box">
            <h2 style="margin:0; color:#2d6a4f;">Migration Clear!</h2>
            <div id="stars-display" style="margin:15px 0;"></div>
            <p id="win-stats" style="font-size:14px; color:#666"></p>
            <button onclick="nextLevel()" style="width:100%; padding:12px; background:#2d6a4f; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Fly Forward</button>
        </div>
    </div>

    <div class="ui-panel">
        <button class="game-btn" onclick="toggleMap()" title="Map">🧭</button>
        <button class="game-btn" onclick="undo()" title="Undo" style="font-size: 25px;">↺</button>
        <button class="game-btn" onclick="reset()" title="Reset" style="font-size: 25px;">⟳</button>
        <button id="mute-btn" class="game-btn" onclick="toggleMute()" title="Mute">🔊</button>
    </div>
</div>

<div id="map-overlay">
        <div class="map-header">
            <h2 style="margin:0; color:#2d6a4f;">Migration Path</h2>
            <button onclick="toggleMap()" style="position:absolute; right:20px; top:20px; border:none; background:none; font-size:24px; cursor:pointer;">✖</button>
        </div>
        <div class="map-path" id="map-path-container"></div>
    </div>

<script>
    // --- AUDIO & PERSISTENCE ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx, mainGain;
    let isMuted = localStorage.getItem('bs_muted') === 'true';

    function initAudio() { 
        if (audioCtx) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return; 
        }
        audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        mainGain = audioCtx.createGain(); 
        mainGain.connect(audioCtx.destination); 
    }   
    function playSound(type) {
        initAudio(); if (isMuted) return; const now = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.connect(g); g.connect(mainGain);
        if (type === 'select') { osc.frequency.setValueAtTime(800, now); g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(); osc.stop(now + 0.1); }
        else if (type === 'move') { osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15); g.gain.setValueAtTime(0.1, now); osc.start(); osc.stop(now + 0.2); }
        else if (type === 'win') playSound('select');
    }
    function toggleMute() { isMuted = !isMuted; localStorage.setItem('bs_muted', isMuted); updateMuteUI(); }
    function updateMuteUI() { document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊'; }

    // --- GAME LOGIC ---
    const COLORS = ['#e63946', '#457b9d', '#2a9d8f', '#e9c46a', '#8338ec', '#ff006e', '#fb5607', '#3a86ff'];
    let level = parseInt(localStorage.getItem('bs_lvl')) || 1;
    let maxUnlockedLevel = parseInt(localStorage.getItem('bs_max_lvl')) || 1;
    let levelRatings = JSON.parse(localStorage.getItem('bs_ratings')) || {}; 
    let branches = [], selected = null, history = [], moves = 0, minMoves = 0;

    function start() {
        history = []; moves = 0; selected = null;
        branches = generate(level);
        setRandomWeather();
        minMoves = Math.max(branches.length, 5);
        document.getElementById('best-text').innerText = minMoves;
        updateMuteUI(); render();
    }

    function generate(lvl) {
        const cCount = Math.min(2 + Math.floor(lvl / 3), COLORS.length);
        let pool = []; for (let i = 0; i < cCount; i++) for (let j = 0; j < 4; j++) pool.push(COLORS[i]);
        // Fisher-Yates Shuffle for better randomization
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        pool.sort(() => Math.random() - 0.5);
        let b = Array.from({ length: cCount + 2 }, () => []);
        for (let i = 0; i < cCount; i++) while (b[i].length < 4) b[i].push(pool.pop());
        return b;
    }

    function render() {
        const layer = document.getElementById('branches-layer');
        const trunk = document.getElementById('trunk');
        layer.innerHTML = '';
        document.getElementById('lvl-num').innerText = level;
        document.getElementById('move-text').innerText = moves;
        const spacing = 115;
        const totalHeight = (branches.length * spacing) / 2 + 150;
        document.getElementById('game-wrapper').style.height = totalHeight + 'px';
        trunk.style.height = (totalHeight - 100) + 'px';

        branches.forEach((b, i) => {
            const isLeft = i % 2 === 0;
            const container = document.createElement('div');
            container.className = `branch-container ${isLeft ? 'container-left' : 'container-right'} ${selected === i ? 'selected' : ''}`;
            container.style.top = (80 + Math.floor(i / 2) * spacing) + 'px';
            container.onclick = () => { 
                if (selected === null) { if (branches[i].length) { selected = i; playSound('select'); } } 
                else { if (selected !== i) move(selected, i); selected = null; } 
                render(); checkWin(); 
            };
            const wood = document.createElement('div'); wood.className = 'branch-wood'; container.appendChild(wood);
            const stack = document.createElement('div'); stack.className = 'bird-stack';
            b.forEach((color, idx) => {
                const bird = document.createElement('div');
                bird.className = `bird ${selected === i && idx === b.length - 1 ? 'selected-bird' : ''}`;
                bird.style.backgroundColor = color;
                // Add Wings, Beak, and Eyes
                ['eye', 'beak', 'wing'].forEach(p => { const s = document.createElement('span'); s.className = `bird-${p}`; bird.appendChild(s); });
                stack.appendChild(bird);
            });
            container.appendChild(stack); layer.appendChild(container);
        });
    }

    function move(a, b) {
    const A = branches[a], B = branches[b];
    if (B.length < 4 && (!B.length || B[B.length - 1] === A[A.length - 1])) {
        const color = A[A.length - 1];
        
        // 1. Get Source Position
        const sourceContainer = document.querySelectorAll('.branch-container')[a];
        const sourceBirds = sourceContainer.querySelectorAll('.bird');
        const movingBirdEl = sourceBirds[sourceBirds.length - 1];
        const rectStart = movingBirdEl.getBoundingClientRect();

        // 2. Logic Update
        history.push(JSON.stringify(branches));
        while (A.length && A[A.length - 1] === color && B.length < 4) B.push(A.pop());
        moves++;
        playSound('move');

        // 3. Create Flying Animation
        const flyer = movingBirdEl.cloneNode(true);
        flyer.classList.add('flying-bird');
        flyer.classList.remove('selected-bird');
        flyer.style.top = rectStart.top + 'px';
        flyer.style.left = rectStart.left + 'px';
        flyer.style.backgroundColor = color;
        document.body.appendChild(flyer);

        // Hide original and re-render
        render(); 
        const allContainers = document.querySelectorAll('.branch-container');
        const destContainer = allContainers[b];
        
        // Find where the bird SHOULD land
        const destStack = destContainer.querySelector('.bird-stack');
        // We temporarily add a hidden bird to find its coordinates
        const tempBird = document.createElement('div');
        tempBird.className = 'bird';
        tempBird.style.visibility = 'hidden';
        destStack.appendChild(tempBird);
        const rectEnd = tempBird.getBoundingClientRect();
        tempBird.remove();

        // 4. Start Flight
        requestAnimationFrame(() => {
            flyer.style.top = rectEnd.top + 'px';
            flyer.style.left = rectEnd.left + 'px';
            // Face the direction of flight
            flyer.style.transform = (rectEnd.left > rectStart.left) ? 'scaleX(1)' : 'scaleX(-1)';
        });

        // 5. Landing
        setTimeout(() => {
            flyer.remove();
            checkWin();
            // Trigger landing hop
            const finalBirds = destContainer.querySelectorAll('.bird');
            const landedBird = finalBirds[finalBirds.length - 1];
            if (landedBird) {
                landedBird.classList.add('hopping');
                setTimeout(() => landedBird.classList.remove('hopping'), 400);
            }
        }, 600); // Matches the 0.6s CSS transition
    }
}

    function checkWin() {
        if (branches.every(b => b.length === 0 || (b.length === 4 && b.every(c => c === b[0])))) {
            playSound('win');
            let stars = (moves <= minMoves) ? 3 : (moves <= minMoves + 5) ? 2 : 1;
            if (!levelRatings[level] || stars > levelRatings[level]) { levelRatings[level] = stars; localStorage.setItem('bs_ratings', JSON.stringify(levelRatings)); }
            if (level === maxUnlockedLevel) { maxUnlockedLevel++; localStorage.setItem('bs_max_lvl', maxUnlockedLevel); }
            let sHtml = ''; for(let i=0; i<3; i++) sHtml += `<span class="star ${i < stars ? 'filled' : ''}">★</span>`;
            document.getElementById('stars-display').innerHTML = sHtml;
            document.getElementById('win-stats').innerText = `Target: ${minMoves} | Moves: ${moves}`;
            document.getElementById('win-popup').style.display = 'flex';
        }
    }

    function renderMap() {
        const container = document.getElementById('map-path-container'); container.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
            const node = document.createElement('div');
            let status = i < maxUnlockedLevel ? 'unlocked' : (i === maxUnlockedLevel ? 'current' : 'locked');
            node.className = `level-node ${status}`;
            node.innerHTML = status === 'locked' ? '🔒' : i;
            if (status !== 'locked') {
                const starsDiv = document.createElement('div'); starsDiv.className = 'node-stars';
                const earned = levelRatings[i] || 0;
                for(let s=0; s<3; s++) { const star = document.createElement('span'); star.className = `mini-star ${s < earned ? 'earned' : ''}`; star.innerHTML = '★'; starsDiv.appendChild(star); }
                node.appendChild(starsDiv);
                node.onclick = () => { level = i; localStorage.setItem('bs_lvl', level); toggleMap(); start(); };
            }
            container.appendChild(node);
        }
        setTimeout(() => { const current = document.querySelector('.level-node.current'); if (current) current.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
    }

    function toggleMap() { const map = document.getElementById('map-overlay'); map.style.display = map.style.display === 'flex' ? 'none' : 'flex'; if (map.style.display === 'flex') renderMap(); }
    function nextLevel() { document.getElementById('win-popup').style.display = 'none'; level++; localStorage.setItem('bs_lvl', level); start(); }
    function undo() { if (history.length) { branches = JSON.parse(history.pop()); moves--; render(); } }
    function reset() { start(); }




    // weather

    let currentWeather = '';

    function setRandomWeather() {
        const vp = document.getElementById('game-viewport');
        const weathers = ['morning', 'evening', 'night', 'rainy'];
        
        let nextWeather;
        do {
            nextWeather = weathers[Math.floor(Math.random() * weathers.length)];
        } while (nextWeather === currentWeather);
        
        currentWeather = nextWeather;
        vp.className = `weather-${nextWeather}`;

        // Dynamic filtering for the "Wet Look"
        if (nextWeather === 'rainy') {
            vp.style.backdropFilter = "blur(1px)";
        } else {
            vp.style.backdropFilter = "none";
        }
    }



    function playBirdChirp() {
    initAudio(); // This now ensures the context is active
    if (isMuted) return;

    // Use the absolute current time from the audio hardware
    const startTime = audioCtx.currentTime + 0.01; // Tiny 10ms buffer to prevent crackle
    
    [0, 0.12].forEach(delay => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        
        const peepStart = startTime + delay;
        
        osc.frequency.setValueAtTime(2800, peepStart);
        osc.frequency.exponentialRampToValueAtTime(4200, peepStart + 0.06);
        
        g.gain.setValueAtTime(0, peepStart);
        g.gain.linearRampToValueAtTime(0.1, peepStart + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, peepStart + 0.06);
        
        osc.connect(g);
        g.connect(mainGain);
        
        osc.start(peepStart);
        osc.stop(peepStart + 0.06);
    });
}


// Ambient Chirp Loop
function ambientBirds() {
    const nextChirp = 3000 + Math.random() * 5000;
    
    setTimeout(() => {
        if (document.getElementById('map-overlay').style.display !== 'flex' && 
            document.getElementById('win-popup').style.display !== 'flex') {
            
            // 1. Trigger Sound
            playBirdChirp();
            
            // 2. Trigger Hop instantly
            const allBirds = document.querySelectorAll('.bird:not(.selected-bird)');
            if (allBirds.length > 0) {
                const randomBird = allBirds[Math.floor(Math.random() * allBirds.length)];
                randomBird.style.animation = 'none'; // Reset animation
                randomBird.offsetHeight; // Trigger reflow
                randomBird.style.animation = 'birdHop 0.4s ease-out';
            }
        }
        ambientBirds();
    }, nextChirp);
}

    start();
</script>
