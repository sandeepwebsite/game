<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth or Dare Online Game</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --truth-color: #06b6d4;
      --truth-glow: rgba(6, 182, 212, 0.4);
      --dare-color: #f43f5e;
      --dare-glow: rgba(244, 63, 94, 0.4);
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Ambient Animated Floating Bubbles */
    .bg-bubbles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-bubbles li {
      position: absolute;
      list-style: none;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.05);
      bottom: -150px;
      border-radius: 50%;
      animation: square 25s infinite linear;
    }

    .bg-bubbles li:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; }
    .bg-bubbles li:nth-child(2) { left: 20%; width: 30px; height: 30px; animation-delay: 2s; animation-duration: 12s; }
    .bg-bubbles li:nth-child(3) { left: 25%; width: 50px; height: 50px; animation-delay: 4s; }
    .bg-bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 18s; }
    .bg-bubbles li:nth-child(5) { left: 70%; width: 90px; height: 90px; animation-delay: 0s; }
    .bg-bubbles li:nth-child(6) { left: 85%; width: 40px; height: 40px; animation-delay: 3s; }

    @keyframes square {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* Animated Flash Banner Alert */
    .flash-banner {
      position: absolute;
      top: -70px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .flash-banner.show {
      top: 75px;
      transform: translateX(-50%) scale(1);
    }

    .flash-truth { 
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      box-shadow: 0 0 20px var(--truth-glow);
    }

    .flash-dare { 
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      box-shadow: 0 0 20px var(--dare-glow);
    }

    /* Glassmorphism Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px;
      text-align: center;
      transition: opacity 0.4s ease;
    }

    .modal-overlay h2 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .modal-overlay p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .room-box {
      width: 100%;
      background: rgba(30, 41, 59, 0.6);
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .room-id-display {
      font-weight: 800;
      color: var(--accent-color);
      font-size: 1.8rem;
      letter-spacing: 4px;
      user-select: all;
      margin-top: 6px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .join-input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      margin-bottom: 16px;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .join-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .btn-connect {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-connect:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }

    .btn-connect:active {
      transform: translateY(0);
    }

    .btn-connect:disabled {
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 20px;
    }

    /* Header */
    .app-header {
      padding: 18px;
      background: rgba(15, 23, 42, 0.7);
      text-align: center;
      border-bottom: 1px solid var(--glass-border);
    }

    .app-header h1 {
      font-size: 1.3rem;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }

    .status-indicator {
      font-size: 0.8rem;
      color: #ef4444;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
      display: inline-block;
      transition: background-color 0.3s;
    }

    .status-indicator.online {
      color: #22c55e;
    }

    .status-indicator.online .status-dot {
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .message.received {
      background: rgba(51, 65, 85, 0.8);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .message.sent {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.system {
      align-self: center;
      background: rgba(71, 85, 105, 0.5);
      color: #cbd5e1;
      font-size: 0.85rem;
      text-align: center;
      max-width: 90%;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
    }

    .tag {
      font-weight: 800;
      display: inline-block;
      margin-right: 6px;
      text-transform: uppercase;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .tag-truth { background: var(--truth-color); color: #fff; box-shadow: 0 0 8px var(--truth-glow); }
    .tag-dare { background: var(--dare-color); color: #fff; box-shadow: 0 0 8px var(--dare-glow); }

    /* Typing Indicator Bar */
    .typing-bar {
      padding: 4px 18px;
      font-size: 0.8rem;
      color: var(--accent-color);
      font-style: italic;
      height: 24px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(5px);
      transition: all 0.2s ease-in-out;
    }

    .typing-bar.active {
      opacity: 1;
      transform: translateY(0);
    }

    .typing-dots span {
      animation: blink 1.4s infinite body;
      animation-fill-mode: both;
      font-weight: bold;
    }

    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0% { opacity: .2; }
      20% { opacity: 1; }
      100% { opacity: .2; }
    }

    /* Control Panel with 3D Effect */
    .game-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(15, 23, 42, 0.7);
      border-top: 1px solid var(--glass-border);
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn.active {
      opacity: 1;
      transform: scale(1.02);
    }

    .btn-truth { 
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: #fff; 
    }

    .btn-truth.active {
      box-shadow: 0 0 20px var(--truth-glow);
    }

    .btn-dare { 
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff; 
    }

    .btn-dare.active {
      box-shadow: 0 0 20px var(--dare-glow);
    }

    /* Message Input */
    .chat-input-area {
      display: flex;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.85);
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      outline: none;
      transition: border-color 0.3s;
    }

    .chat-input-area input:focus {
      border-color: var(--accent-color);
    }

    .chat-input-area button {
      padding: 12px 20px;
      border-radius: 24px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .chat-input-area button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .chat-input-area button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

<!-- Animated Floating Background Bubbles -->
<ul class="bg-bubbles">
  <li></li><li></li><li></li><li></li><li></li><li></li>
</ul>

<div class="app-container">
  <!-- Flash Banner Alert -->
  <div class="flash-banner" id="flashBanner"></div>

  <!-- Join Modal -->
  <div class="modal-overlay" id="joinModal">
    <h2>Truth or Dare</h2>
    <p>Share your code or enter your friend's code below.</p>
    
    <div class="room-box">
      <div>Your 5-Digit Code:</div>
      <div class="room-id-display" id="myRoomId">-----</div>
    </div>

    <input type="text" id="targetRoomId" class="join-input" maxlength="5" placeholder="5-DIGIT CODE">
    <button class="btn-connect" id="joinBtn" onclick="connectToPeer()">JOIN ROOM</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Main Chat Interface -->
  <div class="app-header">
    <h1>Truth or Dare Game</h1>
    <div class="status-indicator" id="statusText"><span class="status-dot"></span> Disconnected</div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="message system">Connected! Select Truth or Dare, then type your question or response.</div>
  </div>

  <!-- Typing Indicator Bar -->
  <div class="typing-bar" id="typingIndicator">
    Opponent is typing<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
  </div>

  <div class="game-controls">
    <button class="btn btn-truth" id="truthBtn" onclick="selectType('truth')">TRUTH</button>
    <button class="btn btn-dare" id="dareBtn" onclick="selectType('dare')">DARE</button>
  </div>

  <div class="chat-input-area">
    <input type="text" id="messageInput" placeholder="Type a message..." oninput="handleTyping()" onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  let peer = null;
  let conn = null;
  let selectedType = null;
  let myCustomId = generate5DigitId();
  let flashTimeout = null;
  let typingTimeout = null;
  let isTypingSent = false;

  function generate5DigitId() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let result = '';
    for (let i = 0; i < 5; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  function initPeer() {
    peer = new Peer(myCustomId, { debug: 1 });

    peer.on('open', (id) => {
      document.getElementById('myRoomId').innerText = id;
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        myCustomId = generate5DigitId();
        initPeer();
      } else {
        showError('Connection error: ' + err.type);
      }
    });

    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      bindConnectionEvents();
    });
  }

  function connectToPeer() {
    const targetId = document.getElementById('targetRoomId').value.trim().toUpperCase();
    document.getElementById('errorMsg').innerText = '';

    if (targetId.length !== 5) {
      showError('Please enter a valid 5-character code.');
      return;
    }

    if (targetId === myCustomId) {
      showError('You cannot join your own room code.');
      return;
    }

    document.getElementById('joinBtn').innerText = 'CONNECTING...';
    document.getElementById('joinBtn').disabled = true;

    conn = peer.connect(targetId, { reliable: true });
    bindConnectionEvents();
  }

  function bindConnectionEvents() {
    conn.on('open', () => {
      document.getElementById('joinModal').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('joinModal').style.display = 'none';
      }, 400);

      const status = document.getElementById('statusText');
      status.innerHTML = '<span class="status-dot"></span> Online with Player';
      status.classList.add('online');
    });

    conn.on('data', (data) => {
      if (data.action === 'selection') {
        showFlashMessage(`Opponent chose ${data.type.toUpperCase()}!`, data.type);
      } 
      else if (data.action === 'typing') {
        setTypingIndicator(data.isTyping);
      }
      else if (data.action === 'message') {
        setTypingIndicator(false);
        appendMessage('received', data.message, data.type);
      }
    });

    conn.on('close', () => {
      const status = document.getElementById('statusText');
      status.innerHTML = '<span class="status-dot"></span> Disconnected';
      status.classList.remove('online');
      appendMessage('system', 'Partner left the chat.');
    });

    conn.on('error', () => {
      showError('Could not connect to room code.');
      resetJoinButton();
    });
  }

  function showFlashMessage(text, type) {
    const banner = document.getElementById('flashBanner');
    banner.innerText = text;
    banner.className = `flash-banner flash-${type} show`;

    if (flashTimeout) clearTimeout(flashTimeout);

    flashTimeout = setTimeout(() => {
      banner.classList.remove('show');
    }, 3000);
  }

  function setTypingIndicator(isTyping) {
    const indicator = document.getElementById('typingIndicator');
    if (isTyping) {
      indicator.classList.add('active');
    } else {
      indicator.classList.remove('active');
    }
  }

  function handleTyping() {
    if (!conn || !conn.open) return;

    if (!isTypingSent) {
      isTypingSent = true;
      conn.send({ action: 'typing', isTyping: true });
    }

    if (typingTimeout) clearTimeout(typingTimeout);

    typingTimeout = setTimeout(() => {
      isTypingSent = false;
      conn.send({ action: 'typing', isTyping: false });
    }, 2000);
  }

  function selectType(type) {
    if (selectedType === type) {
      selectedType = null;
      document.getElementById(`${type}Btn`).classList.remove('active');
    } else {
      selectedType = type;
      document.getElementById('truthBtn').classList.remove('active');
      document.getElementById('dareBtn').classList.remove('active');
      document.getElementById(`${type}Btn`).classList.add('active');

      if (conn && conn.open) {
        conn.send({
          action: 'selection',
          type: type
        });
      }
    }
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();

    if (text === '') return;

    if (conn && conn.open) {
      conn.send({
        action: 'message',
        message: text,
        type: selectedType
      });
      isTypingSent = false;
      conn.send({ action: 'typing', isTyping: false });
    }

    appendMessage('sent', text, selectedType);

    input.value = '';
    selectedType = null;
    document.getElementById('truthBtn').classList.remove('active');
    document.getElementById('dareBtn').classList.remove('active');
  }

  function showError(msg) {
    document.getElementById('errorMsg').innerText = msg;
    resetJoinButton();
  }

  function resetJoinButton() {
    const btn = document.getElementById('joinBtn');
    btn.innerText = 'JOIN ROOM';
    btn.disabled = false;
  }

  function appendMessage(sender, text, type = null) {
    const chatArea = document.getElementById('chatArea');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;

    let content = '';
    if (type) {
      content += `<span class="tag tag-${type}">${type}</span> `;
    }
    content += text;

    msgDiv.innerHTML = content;
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  }

  initPeer();
</script>

</body>
</html>
