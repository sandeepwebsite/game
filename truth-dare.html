<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Truth or Dare Online Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(30, 41, 59, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --truth-color: #06b6d4;
      --truth-glow: rgba(6, 182, 212, 0.4);
      --dare-color: #f43f5e;
      --dare-glow: rgba(244, 63, 94, 0.4);
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Using dvh/svh to avoid dynamic dynamic address bar overflows */
      height: 100dvh;
      min-height: -webkit-fill-available;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      position: relative;
    }

    @media (min-height: 700px) and (min-width: 480px) {
      .app-container {
        height: 92dvh;
        max-height: 850px;
        border-radius: 20px;
      }
    }

    /* Flash Banner Alert */
    .flash-banner {
      position: absolute;
      top: -70px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flash-banner.show {
      top: 58px;
      transform: translateX(-50%) scale(1);
    }

    .flash-truth { background: linear-gradient(135deg, #06b6d4, #0891b2); box-shadow: 0 0 20px var(--truth-glow); }
    .flash-dare { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 0 20px var(--dare-glow); }

    /* Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      transition: opacity 0.4s ease;
      overflow-y: auto;
    }

    .modal-overlay h2 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .modal-overlay p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .room-box {
      width: 100%;
      max-width: 320px;
      background: rgba(30, 41, 59, 0.6);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--glass-border);
    }

    .room-id-display {
      font-weight: 800;
      color: var(--accent-color);
      font-size: 1.6rem;
      letter-spacing: 4px;
      user-select: all;
      margin-top: 4px;
    }

    .join-input {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      margin-bottom: 12px;
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      outline: none;
    }

    .btn-connect {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.8rem;
      margin-top: 8px;
      min-height: 18px;
    }

    /* Header */
    .app-header {
      padding: 12px;
      background: rgba(15, 23, 42, 0.7);
      text-align: center;
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .app-header h1 {
      font-size: 1.1rem;
      color: #f8fafc;
    }

    .status-indicator {
      font-size: 0.75rem;
      color: #ef4444;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #ef4444;
    }

    .status-indicator.online { color: #22c55e; }
    .status-indicator.online .status-dot { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }

    /* Bottle Arena Section */
    .bottle-section {
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      flex-shrink: 0;
    }

    .player-labels {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #94a3b8;
    }

    .bottle-arena {
      width: 90px;
      height: 90px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0;
    }

    .bottle {
      width: 24px;
      height: 70px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      border-radius: 10px 10px 5px 5px;
      position: relative;
      transform-origin: center center;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1.05);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    .bottle::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 6px;
      width: 12px;
      height: 10px;
      background: #166534;
      border-radius: 2px 2px 0 0;
    }

    .bottle-cap {
      position: absolute;
      top: -13px;
      left: 7px;
      width: 10px;
      height: 3px;
      background: #e2e8f0;
      border-radius: 2px;
    }

    .btn-spin {
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .btn-spin:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Chat Area Flexible Scroll Settings */
    .chat-area {
      flex: 1;
      min-height: 0;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.35;
      word-break: break-word;
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .message.received { background: rgba(51, 65, 85, 0.85); align-self: flex-start; }
    .message.sent { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; align-self: flex-end; }
    .message.system { align-self: center; background: rgba(71, 85, 105, 0.5); color: #cbd5e1; font-size: 0.78rem; text-align: center; }

    .tag {
      font-weight: 800;
      display: inline-block;
      margin-right: 4px;
      text-transform: uppercase;
      font-size: 0.65rem;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .tag-truth { background: var(--truth-color); color: #fff; }
    .tag-dare { background: var(--dare-color); color: #fff; }

    /* Typing Bar */
    .typing-bar {
      padding: 2px 14px;
      font-size: 0.75rem;
      color: var(--accent-color);
      font-style: italic;
      height: 18px;
      opacity: 0;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .typing-bar.active { opacity: 1; }

    /* Controls */
    .game-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.7);
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .btn.active { opacity: 1; transform: scale(1.02); }
    .btn-truth { background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; }
    .btn-dare { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; }

    /* Message Input Box */
    .chat-input-area {
      display: flex;
      padding: 8px 12px 12px 12px;
      background: rgba(15, 23, 42, 0.85);
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .chat-input-area button {
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="flash-banner" id="flashBanner"></div>

  <!-- Join Modal -->
  <div class="modal-overlay" id="joinModal">
    <h2>Truth or Dare</h2>
    <p>Share your code or enter your friend's code below.</p>
    
    <div class="room-box">
      <div>Your 5-Digit Code:</div>
      <div class="room-id-display" id="myRoomId">-----</div>
    </div>

    <input type="text" id="targetRoomId" class="join-input" maxlength="5" placeholder="5-DIGIT CODE">
    <button class="btn-connect" id="joinBtn" onclick="connectToPeer()">JOIN ROOM</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- App Header -->
  <div class="app-header">
    <h1>Truth or Dare Chat</h1>
    <div class="status-indicator" id="statusText"><span class="status-dot"></span> Disconnected</div>
  </div>

  <!-- Spin the Bottle Section -->
  <div class="bottle-section">
    <div class="player-labels">
      <span>👈 YOU</span>
      <span>OPPONENT 👉</span>
    </div>
    <div class="bottle-arena">
      <div class="bottle" id="bottle">
        <div class="bottle-cap"></div>
      </div>
    </div>
    <button class="btn-spin" id="spinBtn" onclick="spinBottle()">SPIN BOTTLE 🍾</button>
  </div>

  <!-- Chat Log Viewport -->
  <div class="chat-area" id="chatArea">
    <div class="message system">Connected! Spin the bottle or select Truth/Dare to begin.</div>
  </div>

  <div class="typing-bar" id="typingIndicator">Opponent is typing...</div>

  <div class="game-controls">
    <button class="btn btn-truth" id="truthBtn" onclick="selectType('truth')">TRUTH</button>
    <button class="btn btn-dare" id="dareBtn" onclick="selectType('dare')">DARE</button>
  </div>

  <div class="chat-input-area">
    <input type="text" id="messageInput" placeholder="Type a message..." oninput="handleTyping()" onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  let peer = null;
  let conn = null;
  let selectedType = null;
  let myCustomId = generate5DigitId();
  let flashTimeout = null;
  let typingTimeout = null;
  let isTypingSent = false;
  let currentBottleRotation = 0;
  let heartbeatInterval = null;

  function generate5DigitId() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let result = '';
    for (let i = 0; i < 5; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  function initPeer() {
    peer = new Peer(myCustomId, { debug: 1 });

    peer.on('open', (id) => {
      document.getElementById('myRoomId').innerText = id;
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        myCustomId = generate5DigitId();
        initPeer();
      } else {
        showError('Connection error: ' + err.type);
      }
    });

    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      bindConnectionEvents();
    });
  }

  function connectToPeer() {
    const targetId = document.getElementById('targetRoomId').value.trim().toUpperCase();
    document.getElementById('errorMsg').innerText = '';

    if (targetId.length !== 5) { showError('Please enter a valid 5-character code.'); return; }
    if (targetId === myCustomId) { showError('You cannot join your own room code.'); return; }

    document.getElementById('joinBtn').innerText = 'CONNECTING...';
    document.getElementById('joinBtn').disabled = true;

    conn = peer.connect(targetId, { reliable: true });
    bindConnectionEvents();
  }

  function bindConnectionEvents() {
    conn.on('open', () => {
      document.getElementById('joinModal').style.display = 'none';
      const status = document.getElementById('statusText');
      status.innerHTML = '<span class="status-dot"></span> Online with Partner';
      status.classList.add('online');
      startHeartbeat();
    });

    conn.on('data', (data) => {
      if (data.action === 'selection') {
        showFlashMessage(`Opponent chose ${data.type.toUpperCase()}!`, data.type);
      } else if (data.action === 'typing') {
        setTypingIndicator(data.isTyping);
      } else if (data.action === 'message') {
        setTypingIndicator(false);
        appendMessage('received', data.message, data.type);
      } else if (data.action === 'spin') {
        executeBottleSpin(data.degrees, data.chosenTarget, false);
      } else if (data.action === 'ping') {
        // Keep connection active
      }
    });

    conn.on('close', () => {
      handleDisconnect();
    });

    conn.on('error', () => {
      showError('Connection lost.');
      handleDisconnect();
    });
  }

  function startHeartbeat() {
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(() => {
      if (conn && conn.open) {
        conn.send({ action: 'ping' });
      }
    }, 2000);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && peer && peer.disconnected) {
      peer.reconnect();
    }
  });

  function handleDisconnect() {
    const status = document.getElementById('statusText');
    status.innerHTML = '<span class="status-dot"></span> Disconnected';
    status.classList.remove('online');
    appendMessage('system', 'Partner disconnected.');
  }

  function spinBottle() {
    if (!conn || !conn.open) {
      alert('Please connect with a partner first!');
      return;
    }

    const spins = 5 + Math.floor(Math.random() * 5);
    const isSelf = Math.random() < 0.5;
    const targetAngle = isSelf ? 270 : 90; 
    const totalDegrees = currentBottleRotation + (spins * 360) + (targetAngle - (currentBottleRotation % 360));

    conn.send({
      action: 'spin',
      degrees: totalDegrees,
      chosenTarget: isSelf ? 'OPPONENT' : 'YOU'
    });

    executeBottleSpin(totalDegrees, isSelf ? 'YOU' : 'OPPONENT', true);
  }

  function executeBottleSpin(degrees, winnerText, isInitiator) {
    const bottle = document.getElementById('bottle');
    const spinBtn = document.getElementById('spinBtn');
    
    spinBtn.disabled = true;
    currentBottleRotation = degrees;
    bottle.style.transform = `rotate(${degrees}deg)`;

    setTimeout(() => {
      spinBtn.disabled = false;
      const bannerText = winnerText === 'YOU' ? '🍾 Bottle landed on YOU! Pick Truth or Dare.' : '🍾 Bottle landed on OPPONENT!';
      showFlashMessage(bannerText, winnerText === 'YOU' ? 'truth' : 'dare');
      appendMessage('system', bannerText);
    }, 4000);
  }

  function showFlashMessage(text, type) {
    const banner = document.getElementById('flashBanner');
    banner.innerText = text;
    banner.className = `flash-banner flash-${type} show`;
    if (flashTimeout) clearTimeout(flashTimeout);
    flashTimeout = setTimeout(() => banner.classList.remove('show'), 3000);
  }

  function setTypingIndicator(isTyping) {
    const indicator = document.getElementById('typingIndicator');
    indicator.className = isTyping ? 'typing-bar active' : 'typing-bar';
  }

  function handleTyping() {
    if (!conn || !conn.open) return;
    if (!isTypingSent) {
      isTypingSent = true;
      conn.send({ action: 'typing', isTyping: true });
    }
    if (typingTimeout) clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      isTypingSent = false;
      conn.send({ action: 'typing', isTyping: false });
    }, 2000);
  }

  function selectType(type) {
    if (selectedType === type) {
      selectedType = null;
      document.getElementById(`${type}Btn`).classList.remove('active');
    } else {
      selectedType = type;
      document.getElementById('truthBtn').classList.remove('active');
      document.getElementById('dareBtn').classList.remove('active');
      document.getElementById(`${type}Btn`).classList.add('active');

      if (conn && conn.open) {
        conn.send({ action: 'selection', type: type });
      }
    }
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (text === '') return;

    if (conn && conn.open) {
      conn.send({ action: 'message', message: text, type: selectedType });
      isTypingSent = false;
      conn.send({ action: 'typing', isTyping: false });
    }

    appendMessage('sent', text, selectedType);
    input.value = '';
    selectedType = null;
    document.getElementById('truthBtn').classList.remove('active');
    document.getElementById('dareBtn').classList.remove('active');
  }

  function showError(msg) {
    document.getElementById('errorMsg').innerText = msg;
    const btn = document.getElementById('joinBtn');
    btn.innerText = 'JOIN ROOM';
    btn.disabled = false;
  }

  function appendMessage(sender, text, type = null) {
    const chatArea = document.getElementById('chatArea');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    let content = type ? `<span class="tag tag-${type}">${type}</span> ` : '';
    content += text;
    msgDiv.innerHTML = content;
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendMessage();
  }

  initPeer();
</script>

</body>
</html>
