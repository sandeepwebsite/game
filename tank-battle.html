<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro Handheld Tank Battle</title>
    <style>
        :root {
            --bg-color: #1a1c23;
            --console-color: #f4d03f; /* Classic 90s handheld yellow */
            --console-border: #d4ac0d;
            --screen-bezel: #252830;
            --lcd-bg: #9cb07a; /* Authentic greenish-gray monochrome LCD tone */
            --lcd-pixel: #1c2833;
            --button-color: #e74c3c;
            --button-border: #c0392b;
            --dpad-color: #34495e;
            --dpad-border: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            padding: 10px;
        }

        html {
            height: -webkit-fill-available;
        }

        /* ==========================================================================
           LAPTOP / DESKTOP STYLES (Clean Compact Frame Layout)
           ========================================================================== */
        .handheld-console {
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
            width: 100%;
            max-width: 360px;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* Hide primary controls and physical body casing on desktops */
        .brand, 
        .interface-grid {
            display: none !important;
        }

        /* Centered minimal utility button layout tray */
        .hardware-controls {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .top-row-buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .util-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            font-weight: 900;
            color: #7f8c8d;
            gap: 6px;
        }

        .utility-btn {
            background: #7f8c8d;
            border-radius: 20px;
            width: 50px;
            height: 18px;
            border: 2px solid #5d6d7e;
            box-shadow: 0 3px 0 #424949, inset 0 2px 2px rgba(255,255,255,0.2);
            cursor: pointer;
        }
        .utility-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #424949;
        }

        /* Screen Bezel Outer Frame Enclosure */
        .screen-bezel {
            background: var(--screen-bezel);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 4px solid #1e2026;
        }

        .lcd-display {
            background: var(--lcd-bg);
            border: 5px solid #0f1418;
            border-radius: 6px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.4);
            display: flex;
            padding: 12px;
            gap: 14px;
            position: relative;
            justify-content: center;
        }

        .game-board-wrapper {
            position: relative;
            flex: 1;
        }

        #game-canvas {
            background: transparent;
            border: 2px solid var(--lcd-pixel);
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 2;
        }

        .lcd-side-panel {
            display: flex;
            flex-direction: column;
            width: 80px;
            color: var(--lcd-pixel);
        }

        .stat-box {
            text-align: center;
            border-bottom: 2px dashed rgba(28, 40, 81, 0.25);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .stat-label {
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-val {
            font-size: 1.1rem;
            font-weight: 900;
        }

        /* Overlay Menus Configuration */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(156, 176, 122, 0.92);
            backdrop-filter: blur(1px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 12px;
        }

        .overlay-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--lcd-pixel);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .btn-system {
            background: var(--lcd-pixel);
            color: var(--lcd-bg);
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }

        /* ==========================================================================
           MOBILE / HANDHELD VIEWPORTS (Restores Classic Yellow Housing Cover)
           ========================================================================== */
        @media (max-width: 1080px) {
            .handheld-console {
                background: var(--console-color);
                border: 6px solid var(--console-border);
                border-radius: 24px 24px 64px 24px;
                box-shadow: 
                    0 20px 45px rgba(0,0,0,0.6), 
                    inset 0 -12px 20px rgba(0,0,0,0.2), 
                    inset 0 12px 20px rgba(255,255,255,0.5);
                padding: 20px;
                max-width: 375px;
                height: 92vh;
                max-height: 680px;
                justify-content: space-between;
                gap: 15px;
            }

            .brand {
                display: block !important;
                font-style: italic;
                font-weight: 900;
                color: #11161b;
                letter-spacing: 3px;
                font-size: 1.1rem;
                text-shadow: 1px 1px 0px rgba(255,255,255,0.6);
                text-align: center;
                width: 100%;
                border-bottom: 2px solid rgba(0, 0, 0, 0.08);
                padding-bottom: 6px;
            }

            .screen-bezel {
                box-shadow: inset 0 8px 16px rgba(0,0,0,0.6), 0 2px 3px rgba(255,255,255,0.2);
                border-bottom: 3px solid rgba(255,255,255,0.08);
                padding: 14px 14px 10px 14px;
                border: none;
                border-radius: 12px;
            }

            .hardware-controls {
                gap: 15px;
                flex-grow: 1;
                flex-direction: column;
                justify-content: space-around;
                padding-bottom: 5px;
            }

            .top-row-buttons {
                background: transparent;
                border: none;
                padding: 0;
                border-radius: 0;
            }

            .util-wrapper {
                color: #2c3e50;
            }

            .interface-grid {
                display: flex !important;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                padding: 0 5px;
                gap: 10px;
            }

            .dpad-container {
                position: relative;
                width: 116px;
                height: 116px;
                flex-shrink: 0;
            }

            .dpad-btn {
                position: absolute;
                background: linear-gradient(135deg, var(--dpad-color), #243342);
                border: 2px solid #1a252f;
                box-shadow: 0 4px 0 #111922;
                cursor: pointer;
            }
            .dpad-btn:active {
                background: #1a252f;
                box-shadow: 0 1px 0 #111922;
                transform: translateY(2px);
            }

            #m-left { top: 40px; left: 0; width: 40px; height: 36px; border-radius: 6px 0 0 6px; border-right: none; }
            #m-right { top: 40px; right: 0; width: 40px; height: 36px; border-radius: 0 6px 6px 0; border-left: none; }
            #m-drop { bottom: 0; left: 40px; width: 36px; height: 40px; border-radius: 0 0 6px 6px; border-top: none; }
            #m-up { top: 0; left: 40px; width: 36px; height: 40px; border-radius: 6px 6px 0 0; border-bottom: none; }

            .dpad-center {
                position: absolute;
                top: 40px; left: 40px; width: 36px; height: 36px;
                background: var(--dpad-color);
                z-index: 2;
            }

            .action-container {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 16px;
                flex-grow: 1;
            }

            .action-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 0.65rem;
                font-weight: 900;
                color: #2c3e50;
                gap: 6px;
            }

            .action-btn {
                background: linear-gradient(135deg, var(--button-color), #c0392b);
                border-radius: 50%;
                border: 2px solid #922b21;
                box-shadow: 0 5px 0 #641e16, 0 6px 10px rgba(0,0,0,0.3), inset 0 2px 2px rgba(255,255,255,0.3);
                cursor: pointer;
            }
            .action-btn:active {
                transform: translateY(4px);
                box-shadow: 0 1px 0 #641e16, 0 2px 5px rgba(0,0,0,0.3);
            }

            #m-fire { width: 68px; height: 68px; }
        }

        @media (max-width: 480px) and (max-height: 600px) {
            .handheld-console { padding: 12px; gap: 8px; }
            .brand { padding-bottom: 2px; font-size: 0.95rem; }
            .screen-bezel { padding: 8px 8px 6px 8px; }
            .hardware-controls { gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="handheld-console">
        <div class="brand">TANK BATTLE 2026</div>

        <div class="screen-bezel">
            <div class="lcd-display">
                <div class="game-board-wrapper">
                    <canvas id="game-canvas" width="200" height="400"></canvas>
                    
                    <div id="menu-overlay" class="overlay">
                        <div id="overlay-msg" class="overlay-title">TANK BATTLE</div>
                        <button id="start-btn" class="btn-system">START</button>
                    </div>
                </div>

                <div class="lcd-side-panel">
                    <div class="stat-box">
                        <div class="stat-label">Score</div>
                        <div id="score" class="stat-val">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Hi-Score</div>
                        <div id="high-score" class="stat-val">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Enemy</div>
                        <div id="enemy-count" class="stat-val">0</div>
                    </div>
                    <div style="font-size: 0.5rem; text-align: center; font-weight: bold; opacity: 0.6; margin-top: auto;">
                        TANK-V1
                    </div>
                </div>
            </div>
        </div>

        <div class="hardware-controls">
            <div class="top-row-buttons">
                <div class="util-wrapper">
                    <div class="utility-btn" id="m-mute"></div>
                    <span>SOUND</span>
                </div>
                <div class="util-wrapper">
                    <div class="utility-btn" id="m-pause"></div>
                    <span>PAUSE</span>
                </div>
            </div>

            <div class="interface-grid">
                <div class="dpad-container">
                    <div class="dpad-btn" id="m-up"></div>
                    <div class="dpad-btn" id="m-left"></div>
                    <div class="dpad-center"></div>
                    <div class="dpad-btn" id="m-right"></div>
                    <div class="dpad-btn" id="m-drop"></div>
                </div>

                <div class="action-container">
                    <div class="action-wrapper">
                        <div class="action-btn" id="m-fire"></div>
                        <span>FIRE</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isMuted = localStorage.getItem('tankGameMuted') === 'true';

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function syncMuteBtnUI() {
            document.getElementById('m-mute').style.backgroundColor = isMuted ? '#566573' : '#7f8c8d';
        }
        syncMuteBtnUI();

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'move') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(90, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                osc.start(now); osc.stop(now + 0.04);
            } else if (type === 'fire') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.6);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        const toggleMute = () => { 
            initAudio();
            isMuted = !isMuted; 
            localStorage.setItem('tankGameMuted', isMuted);
            syncMuteBtnUI();
        };
        document.getElementById('m-mute').addEventListener('click', toggleMute);
        document.getElementById('m-mute').addEventListener('touchstart', (e) => { e.preventDefault(); toggleMute(); });

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const COLS = 10, ROWS = 20;
        const BLOCK_SIZE = 20;

        const DARK_PIXEL = "#1c2833";
        const LIGHT_PIXEL = "rgba(28, 40, 51, 0.06)"; 

        let score = 0;
        let highScore = localStorage.getItem('tankHighScore') || 0;
        document.getElementById('high-score').innerText = highScore;

        let gameOver = false;
        let gameRunning = false;
        let isPaused = false;
        let lastTime = 0;
        let enemySpawnTimer = 0;
        let enemyMoveTimer = 0;
        let rafId = null;

        let player = { x: 4, y: 17, dir: 'up' };
        let projectiles = [];
        let enemies = [];

        const TANK_MATRICES = {
            up: [[0, 1, 0], [1, 1, 1], [1, 0, 1]],
            down: [[1, 0, 1], [1, 1, 1], [0, 1, 0]],
            left: [[0, 1, 1], [1, 1, 0], [0, 1, 1]],
            right: [[1, 1, 0], [0, 1, 1], [1, 1, 0]]
        };

        function drawPixelBlock(x, y, isFilled) {
            if(x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
            ctx.fillStyle = isFilled ? DARK_PIXEL : LIGHT_PIXEL;
            ctx.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
            if(isFilled) {
                ctx.strokeStyle = "#9cb07a";
                ctx.lineWidth = 1;
                ctx.strokeRect(x * BLOCK_SIZE + 2, y * BLOCK_SIZE + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
            }
        }

        function renderTank(tankObj) {
            const matrix = TANK_MATRICES[tankObj.dir];
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    if (matrix[r][c] === 1) {
                        drawPixelBlock(tankObj.x + c, tankObj.y + r, true);
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    drawPixelBlock(c, r, false);
                }
            }

            if (!gameOver) renderTank(player);
            enemies.forEach(enemy => renderTank(enemy));
            projectiles.forEach(p => drawPixelBlock(p.x, p.y, true));
        }

        function movePlayer(dx, dy, targetDir) {
            player.dir = targetDir;
            let newX = player.x + dx;
            let newY = player.y + dy;

            if (newX >= 0 && newX <= COLS - 3 && newY >= 0 && newY <= ROWS - 3) {
                player.x = newX;
                player.y = newY;
                playSound('move');
            }
        }

        function fireProjectile(shooter) {
            let px = shooter.x + 1;
            let py = shooter.y + 1;

            if (shooter.dir === 'up') py = shooter.y - 1;
            if (shooter.dir === 'down') py = shooter.y + 3;
            if (shooter.dir === 'left') px = shooter.x - 1;
            if (shooter.dir === 'right') px = shooter.x + 3;

            projectiles.push({ x: px, y: py, dir: shooter.dir, fromPlayer: (shooter === player) });
            if (shooter === player) playSound('fire');
        }

        function spawnEnemy() {
            if (enemies.length >= 3) return;
            const spawnX = Math.floor(Math.random() * (COLS - 2));
            if (!enemies.some(e => Math.abs(e.x - spawnX) < 3 && e.y < 3)) {
                enemies.push({ x: spawnX, y: 0, dir: 'down' });
            }
            document.getElementById('enemy-count').innerText = enemies.length;
        }

        function updateEntities(deltaTime) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                if (p.dir === 'up') p.y--;
                else if (p.dir === 'down') p.y++;
                else if (p.dir === 'left') p.x--;
                else if (p.dir === 'right') p.x++;

                if (p.x < 0 || p.x >= COLS || p.y < 0 || p.y >= ROWS) {
                    projectiles.splice(i, 1);
                    continue;
                }

                if (p.fromPlayer) {
                    let hitIdx = enemies.findIndex(e => p.x >= e.x && p.x < e.x + 3 && p.y >= e.y && p.y < e.y + 3);
                    if (hitIdx !== -1) {
                        enemies.splice(hitIdx, 1);
                        projectiles.splice(i, 1);
                        score += 100;
                        document.getElementById('score').innerText = score;
                        if (score > highScore) {
                            highScore = score;
                            document.getElementById('high-score').innerText = highScore;
                            localStorage.setItem('tankHighScore', highScore);
                        }
                        document.getElementById('enemy-count').innerText = enemies.length;
                        playSound('hit');
                        continue;
                    }
                } else {
                    if (p.x >= player.x && p.x < player.x + 3 && p.y >= player.y && p.y < player.y + 3) {
                        triggerGameOver();
                        return;
                    }
                }
            }

            enemyMoveTimer += deltaTime;
            if (enemyMoveTimer > 700) {
                enemies.forEach(e => {
                    if (Math.random() < 0.6) {
                        if (e.x + 1 < player.x + 1 && e.x < COLS - 3) { e.x++; e.dir = 'right'; }
                        else if (e.x + 1 > player.x + 1 && e.x > 0) { e.x--; e.dir = 'left'; }
                        else if (e.y + 1 < player.y + 1 && e.y < ROWS - 3) { e.y++; e.dir = 'down'; }
                    } else {
                        if (Math.random() < 0.25) fireProjectile(e);
                    }

                    if (Math.abs((e.x + 1) - (player.x + 1)) < 2 && Math.abs((e.y + 1) - (player.y + 1)) < 2) {
                        triggerGameOver();
                    }
                });
                enemyMoveTimer = 0;
            }

            enemySpawnTimer += deltaTime;
            if (enemySpawnTimer > 3000) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }
        }

        function triggerGameOver() {
            gameOver = true;
            gameRunning = false;
            if (rafId) cancelAnimationFrame(rafId);
            playSound('gameover');
            
            document.getElementById('overlay-msg').innerText = 'GAME OVER';
            document.getElementById('start-btn').innerText = 'RESTART';
            document.getElementById('menu-overlay').style.display = 'flex';
        }

        function gameLoop(time = 0) {
            if (!gameRunning) return;
            const deltaTime = time - lastTime;
            lastTime = time;

            updateEntities(deltaTime);
            draw();
            rafId = requestAnimationFrame(gameLoop);
        }

        function handleSystemAction() {
            initAudio();
            if (gameOver || !gameRunning) {
                score = 0;
                document.getElementById('score').innerText = score;
                gameOver = false;
                isPaused = false;
                document.getElementById('m-pause').style.backgroundColor = '#7f8c8d';
                player = { x: 4, y: 17, dir: 'up' };
                enemies = [];
                projectiles = [];
                gameRunning = true;
                lastTime = performance.now();
                document.getElementById('menu-overlay').style.display = 'none';
                spawnEnemy();
                gameLoop();
            }
        }

        document.getElementById('start-btn').addEventListener('click', handleSystemAction);

        function togglePause() {
            initAudio();
            if (gameOver || (!gameRunning && !isPaused)) return;
            isPaused = !isPaused;
            if (isPaused) {
                gameRunning = false;
                if (rafId) cancelAnimationFrame(rafId);
                document.getElementById('overlay-msg').innerText = 'PAUSED';
                document.getElementById('start-btn').innerText = 'RESUME';
                document.getElementById('menu-overlay').style.display = 'flex';
            } else {
                gameRunning = true;
                lastTime = performance.now();
                document.getElementById('menu-overlay').style.display = 'none';
                gameLoop();
            }
            document.getElementById('m-pause').style.backgroundColor = isPaused ? '#566573' : '#7f8c8d';
        }
        document.getElementById('m-pause').addEventListener('click', togglePause);
        document.getElementById('m-pause').addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); });

        window.addEventListener('keydown', e => {
            initAudio();
            if (!gameRunning || isPaused) return;
            if (e.key === 'ArrowLeft') movePlayer(-1, 0, 'left');
            if (e.key === 'ArrowRight') movePlayer(1, 0, 'right');
            if (e.key === 'ArrowUp') movePlayer(0, -1, 'up');
            if (e.key === 'ArrowDown') movePlayer(0, 1, 'down');
            if (e.key === ' ') { fireProjectile(player); e.preventDefault(); }
            draw();
        });

        const connectButton = (id, eventAction) => {
            const el = document.getElementById(id);
            if (!el) return;
            const trigger = (e) => {
                e.preventDefault();
                initAudio();
                if (gameRunning && !isPaused) { eventAction(); draw(); }
            };
            el.addEventListener('touchstart', trigger, { passive: false });
            el.addEventListener('mousedown', trigger);
        };

        connectButton('m-left', () => movePlayer(-1, 0, 'left'));
        connectButton('m-right', () => movePlayer(1, 0, 'right'));
        connectButton('m-up', () => movePlayer(0, -1, 'up'));
        connectButton('m-drop', () => movePlayer(0, 1, 'down')); 
        connectButton('m-fire', () => fireProjectile(player));

        draw();
    </script>
</body>
</html>
